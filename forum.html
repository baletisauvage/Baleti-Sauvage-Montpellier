<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Coin des Sauvages</title><style>html{background:#17110e!important;color-scheme:dark}body{font:16px Arial,sans-serif;background:linear-gradient(#130c09bb,#130c09d9),url('assets/Forum.jpg') center/cover fixed!important;color:#fff;margin:0;min-height:100vh;text-shadow:0 2px 5px #000}.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}h1,h2{font-family:Georgia,serif;font-weight:500}article,form{border-top:1px solid #ffffff99;padding:18px 0}input,textarea,button{font:inherit;padding:10px;background:transparent;border:1px solid #ffffffa8;color:inherit;border-radius:5px}input,textarea{box-sizing:border-box;width:100%;margin:6px 0 12px}textarea{min-height:100px}button{cursor:pointer}button:disabled{opacity:.5}small{color:#ddd}#notice{padding:12px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}.reply{margin-left:25px;border-left:2px solid #fff9;padding-left:14px}a{color:inherit}body.embedded .back-link,body.embedded h1{display:none}body.embedded .wrap{padding-top:0}body.embedded{background:linear-gradient(#130c09bb,#130c09d9),url('assets/Forum.jpg') center/cover fixed!important}input,textarea{background:rgba(0,0,0,.3)}button{background:rgba(0,0,0,.35)}button:hover:not(:disabled){background:rgba(255,255,255,.2)}#notice{font-weight:700}</style></head><body><main class="wrap"><a class="back-link" href="./" id="forumBack">← Retour au site</a><h1>Le Coin des Sauvages</h1><p>Échangez autour des balètis ! Chaque discussion et ses réponses disparaissent au bout de 72 heures. Restez respectueux et ne publiez pas de coordonnées personnelles.</p><div id="notice" role="status" aria-live="polite">Connexion au forum…</div><section id="threads"></section><h2>Écrire un message</h2><form id="form"><div id="nicknameArea"><label>Pseudo<input id="nickname" maxlength="32" minlength="2" required autocomplete="nickname"></label><p id="nicknameSaved" hidden></p><button type="button" id="changeNickname" hidden>Changer de pseudo</button></div><label>Message<textarea id="body" maxlength="800" minlength="2" required></textarea></label><input id="parent" type="hidden"><p id="replylabel"></p><button id="send" disabled>Publier</button><button type="button" id="cancel" hidden>Annuler la réponse</button></form></main><script>if(window.self!==window.top||new URLSearchParams(location.search).has('embedded'))document.body.classList.add('embedded');document.getElementById('forumBack').addEventListener('click',function(e){if(window.self!==window.top){e.preventDefault();window.parent.postMessage({type:'baleti-forum-close'},location.origin)}});const API='https://baleti-sauvage.baletisauvage.workers.dev',el=id=>document.getElementById(id);let ready=false;const NICK_KEY='baleti_forum_nickname_v1',NICK_TTL=72*60*60*1000;function getNick(){try{const v=JSON.parse(localStorage.getItem(NICK_KEY)||'null');if(v&&typeof v.nickname==='string'&&Date.now()-v.lastActive<NICK_TTL&&v.nickname.trim().length>=2)return v.nickname;localStorage.removeItem(NICK_KEY)}catch(e){}return ''}function saveNick(n){try{localStorage.setItem(NICK_KEY,JSON.stringify({nickname:n.trim(),lastActive:Date.now()}))}catch(e){}}function showNick(){const saved=getNick();if(saved){el('nickname').value=saved;el('nickname').required=false;el('nickname').hidden=true;el('nickname').parentElement.hidden=true;el('nicknameSaved').hidden=false;el('nicknameSaved').textContent='Tu écris en tant que '+saved;el('changeNickname').hidden=false}else{el('nickname').hidden=false;el('nickname').parentElement.hidden=false;el('nickname').required=true;el('nicknameSaved').hidden=true;el('changeNickname').hidden=true}}showNick();el('changeNickname').onclick=()=>{try{localStorage.removeItem(NICK_KEY)}catch(e){}el('nickname').hidden=false;el('nickname').parentElement.hidden=false;el('nickname').required=true;el('nicknameSaved').hidden=true;el('changeNickname').hidden=true;el('nickname').focus()};el('nickname').addEventListener('change',()=>{const n=el('nickname').value.trim();if(n.length>=2){saveNick(n);showNick()}});function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function reply(id,name){el('parent').value=id;el('replylabel').textContent='Réponse à '+name;el('cancel').hidden=false;el('body').focus()}el('cancel').onclick=()=>{el('parent').value='';el('replylabel').textContent='';el('cancel').hidden=true};async function load(){try{const r=await fetch(API+'/api/forum',{cache:'no-store'});if(!r.ok)throw Error('Service indisponible');const j=await r.json();if(!j.ok||!Array.isArray(j.posts))throw Error('Forum non disponible');ready=true;el('send').disabled=false;el('notice').textContent='Les discussions sont publiques pendant 72 heures.';const root=el('threads');root.replaceChildren();const parents=j.posts.filter(p=>!p.parent_id);for(const p of parents){const article=document.createElement('article');article.append(node('h2',p.nickname),node('small','Publié le '+new Date(p.created_at).toLocaleString('fr-FR')+' · expire le '+new Date(p.expires_at).toLocaleString('fr-FR')),node('p',p.body));const btn=node('button','Répondre');btn.onclick=()=>reply(p.id,p.nickname);article.append(btn);for(const child of j.posts.filter(c=>c.parent_id===p.id).reverse()){const d=document.createElement('div');d.className='reply';d.append(node('strong',child.nickname),node('p',child.body));article.append(d)}root.append(article)}if(!parents.length)root.append(node('p','Aucune discussion active. Soyez le premier à écrire !'))}catch(e){ready=false;el('send').disabled=true;el('notice').textContent='Le forum n’est pas encore disponible. Revenez prochainement.'}}el('form').onsubmit=async e=>{e.preventDefault();if(!ready)return;const saved=getNick(),nickname=(saved||el('nickname').value).trim();if(nickname.length<2){el('notice').textContent='Choisissez un pseudo de 2 caractères minimum.';return}saveNick(nickname);showNick();el('send').disabled=true;try{const r=await fetch(API+'/api/forum',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({nickname,body:el('body').value,parent_id:el('parent').value})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Publication impossible');el('body').value='';el('cancel').click();await load()}catch(e){el('notice').textContent=e.message}finally{if(ready)el('send').disabled=false}};load();</script></body></html>
