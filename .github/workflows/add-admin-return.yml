name: Add admin return links
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "from pathlib import Path; p=Path('admin.html'); s=p.read_text(); s=s.replace('<section class=\"card section\" id=\"sec-next\"><h2>Prochain Balèti</h2>','<section class=\"card section\" id=\"sec-next\"><a class=\"public-return\" href=\"admin.html\">← Retour à l’administration</a><h2>Prochain Balèti</h2>',1).replace('<section class=\"card section\" id=\"sec-presentation\"><h2>Présentation Balèti Sauvage</h2>','<section class=\"card section\" id=\"sec-presentation\"><a class=\"public-return\" href=\"admin.html\">← Retour à l’administration</a><h2>Présentation Balèti Sauvage</h2>',1); p.write_text(s)"
          git config user.name github-actions
          git config user.email actions@github.com
          git add admin.html
          git commit -m "Add return links to Baleti admin sections"
          git push
