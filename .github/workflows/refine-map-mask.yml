name: Refine map mask 300
on:
  push:
    paths:
      - '.github/workflows/refine-map-mask.yml'
permissions:
  contents: write
jobs:
  refine:
    if: github.event.head_commit.message != 'Apply 300-point interactive map mask with star clearance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace current map clip path with 300-point contour
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Control points follow the wooden inner rim. Bottom is deliberately raised/narrowed
          # so the interactive Leaflet layer never covers the decorative compass/star.
          pts=[(22.8,0),(34,6),(49.6,8.3),(66.2,6),(77.2,0),(79,7.4),(89.3,13.2),(96.3,21.7),(99.3,33.8),(99.1,49.3),(96.1,64),(89.3,76),(79,85.7),(66.5,91.8),(58.5,94.2),(54.0,94.8),(50.0,93.0),(46.0,94.8),(41.5,94.2),(33.5,91.8),(21,85.7),(10.7,76),(3.9,64),(.9,49.3),(.7,33.8),(3.7,21.7),(10.7,13.2),(21,7.4)]
          def cr(p0,p1,p2,p3,t):
              t2=t*t;t3=t2*t
              return tuple(.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3) for j in range(2))
          out=[]
          n=300
          for k in range(n):
              u=k*len(pts)/n;i=int(u);t=u-i
              x,y=cr(pts[(i-1)%len(pts)],pts[i],pts[(i+1)%len(pts)],pts[(i+2)%len(pts)],t)
              x=max(0,min(100,x)); y=max(0,min(100,y))
              out.append(f'{x:.2f}% {y:.2f}%')
          new='clip-path:polygon('+','.join(out)+')'
          pat=r'(?<=\.map-shell\{position:absolute;z-index:12;left:33\.50%;top:17\.89%;width:33\.01%;height:58\.62%;overflow:hidden;)clip-path:polygon\([^;]+\)'
          s2,nsub=re.subn(pat,new,s,count=1)
          if nsub != 1: raise SystemExit('Current map-shell clip path not found; index left unchanged')
          p.write_text(s2)
          PY
      - name: Commit refined mask
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply 300-point interactive map mask with star clearance'
          git push
