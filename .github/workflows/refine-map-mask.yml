name: Apply reference frame overlay
on:
  push:
    paths: ['.github/workflows/refine-map-mask.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page layering
        run: |
          sed -i -E 's/\.stage-bg\{position:absolute;z-index:1;/\.stage-bg{position:absolute;z-index:10;/' index.html
          sed -i -E 's/\.map-shell\{position:absolute;z-index:12;left:[^;]+;top:[^;]+;width:[^;]+;height:[^;]+;overflow:hidden;clip-path:polygon\([^;]+\)/.map-shell{position:absolute;z-index:2;left:33.8%;top:19.0%;width:32.4%;height:58.5%;overflow:hidden;border-radius:48% 48% 45% 45% \/ 22% 22% 46% 46%/' index.html
      - name: Save
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'Place interactive map behind reference frame'
          git push
