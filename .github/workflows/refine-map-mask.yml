name: Apply reference map mask
on:
  push:
    paths: ['.github/workflows/refine-map-mask.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply exact reference inner-border map mask'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply inner black-border mask and foreground map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, math

          p=Path('index.html')
          s=p.read_text()

          # Coordinates are tied to reference.jpg (2048x1152), not to screenshots.
          # The map rectangle covers only the central shield opening.
          x,y,w,h = 681,218,686,690

          # Control points follow the FIRST INNER BLACK BAND around the map.
          # The top deliberately follows the underside of the wooden arch.
          # The bottom rises around the star so Leaflet never paints over it.
          ctrl=[
            (8.0,7.0),(14.0,3.0),(22.0,2.0),(30.0,4.0),(39.0,8.0),(50.0,11.0),
            (61.0,8.0),(70.0,4.0),(78.0,2.0),(86.0,3.0),(92.0,7.0),
            (96.0,15.0),(99.0,27.0),(100.0,40.0),(99.0,54.0),(96.0,67.0),
            (91.0,78.0),(84.0,87.0),(75.0,93.0),(64.0,97.0),
            # star clearance: concave notch around the upper rays
            (59.0,97.5),(57.0,93.0),(55.0,87.0),(53.0,82.0),(50.0,78.0),
            (47.0,82.0),(45.0,87.0),(43.0,93.0),(41.0,97.5),(36.0,97.0),
            (25.0,93.0),(16.0,87.0),(9.0,78.0),(4.0,67.0),(1.0,54.0),
            (0.0,40.0),(1.0,27.0),(4.0,15.0)
          ]

          # Dense linear sampling preserves the traced shape without Catmull-Rom overshoot
          # (the old source of the unwanted horns).
          pts=[]
          target=700
          seg=[]; total=0.0
          for i,a in enumerate(ctrl):
            b=ctrl[(i+1)%len(ctrl)]
            d=math.hypot(b[0]-a[0],b[1]-a[1]); seg.append(d); total+=d
          for i,a in enumerate(ctrl):
            b=ctrl[(i+1)%len(ctrl)]
            n=max(1,round(target*seg[i]/total))
            for k in range(n):
              t=k/n
              pts.append((a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t))
          clip='polygon('+','.join(f'{px:.3f}% {py:.3f}%' for px,py in pts)+')'
          css=(f'.map-shell{{position:absolute;z-index:20;left:{x/2048*100:.5f}%;top:{y/1152*100:.5f}%;'
               f'width:{w/2048*100:.5f}%;height:{h/1152*100:.5f}%;overflow:hidden;clip-path:{clip};background:#ddd')

          pattern=r'\.map-shell\{position:absolute;z-index:[^;]+;left:[^;]+;top:[^;]+;width:[^;]+;height:[^;]+;overflow:hidden;(?:clip-path:polygon\([^;]+\);?|border-radius:[^;}]*(?:;[^}]*)?)?background:#ddd'
          s,n=re.subn(pattern,css,s,count=1)
          if n!=1:
            # Current production version has border-radius before background.
            pattern=r'\.map-shell\{position:absolute;z-index:[^}]+?background:#ddd'
            s,n=re.subn(pattern,css,s,count=1)
          if n!=1: raise SystemExit('map-shell CSS not found')

          # reference image stays behind; Leaflet is foreground but clipped to the opening.
          s=re.sub(r'\.stage-bg\{position:absolute;z-index:\d+;', '.stage-bg{position:absolute;z-index:1;', s, count=1)
          p.write_text(s)
          print('Applied',len(pts),'mask points; bbox',x,y,w,h)
          PY
      - name: Commit map mask
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'Apply exact reference inner-border map mask'
          git push
