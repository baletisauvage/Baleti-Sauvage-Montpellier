name: Refine map mask
on:
  push:
    paths:
      - '.github/workflows/refine-map-mask.yml'
permissions:
  contents: write
jobs:
  refine:
    if: github.event.head_commit.message != 'Apply 150-point interactive map mask'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace map clip path with 150-point contour
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='clip-path:polygon(22.8% 0,34% 6%,49.6% 8.3%,66.2% 6%,77.2% 0,79% 7.4%,89.3% 13.2%,96.3% 21.7%,99.3% 33.8%,99.1% 49.3%,96.1% 64%,89.3% 76%,79% 85.7%,64.3% 92.8%,50% 100%,35.7% 92.8%,21% 85.7%,10.7% 76%,3.9% 64%,.9% 49.3%,.7% 33.8%,3.7% 21.7%,10.7% 13.2%,21% 7.4%)'
          pts=[(22.8,0),(34,6),(49.6,8.3),(66.2,6),(77.2,0),(79,7.4),(89.3,13.2),(96.3,21.7),(99.3,33.8),(99.1,49.3),(96.1,64),(89.3,76),(79,85.7),(64.3,92.8),(50,100),(35.7,92.8),(21,85.7),(10.7,76),(3.9,64),(.9,49.3),(.7,33.8),(3.7,21.7),(10.7,13.2),(21,7.4)]
          def cr(p0,p1,p2,p3,t):
              t2=t*t;t3=t2*t
              return tuple(.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3) for j in range(2))
          out=[]
          for k in range(150):
              u=k*len(pts)/150;i=int(u);t=u-i
              x,y=cr(pts[(i-1)%len(pts)],pts[i],pts[(i+1)%len(pts)],pts[(i+2)%len(pts)],t)
              out.append(f'{x:.2f}% {y:.2f}%')
          new='clip-path:polygon('+','.join(out)+')'
          if old not in s: raise SystemExit('Current map mask not found; index left unchanged')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit refined mask
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply 150-point interactive map mask'
          git push
