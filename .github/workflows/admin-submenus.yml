name: Admin contextual submenus
on:
  push:
    paths:
      - '.github/workflows/admin-submenus.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('admin.html')
          s=p.read_text()
          s=s.replace(".admin-link{display:inline-block;padding:11px 0;border:0;border-bottom:2px solid #17130d;background:transparent;color:#17130d;text-align:left;text-decoration:none;font-weight:800}.admin-link:after{content:'  →'}", ".action-menu{display:flex;gap:8px;margin-top:16px}.action-menu a{display:inline-block;padding:10px 15px;border:1px solid #17130d;background:transparent;color:#17130d;text-decoration:none;font-size:13px;font-weight:800;text-transform:uppercase}.action-menu a:hover{background:#17130d;color:#f4f0e7}")
          s=s.replace(".clickable-admin-section{cursor:pointer}.clickable-admin-section:hover .admin-link{border-bottom-width:3px}.clickable-admin-section:focus{outline:2px solid #17130d;outline-offset:4px}", "")
          s=s.replace('<section class="card section" id="sec-photos"><h2>Photos</h2></section>', '<section class="card section" id="sec-photos"><h2>Photos</h2><div class="action-menu"><a href="admin-photos.html?view=add">Ajouter</a><a href="admin-photos.html?view=gallery">Archives</a></div></section>')
          s=s.replace('<section class="card section" id="sec-videos"><h2>Vidéos</h2><a class="admin-link" href="admin-videos.html">Gérer les vidéos</a></section>', '<section class="card section" id="sec-videos"><h2>Vidéos</h2><div class="action-menu"><a href="admin-videos.html#ajouter">Ajouter</a><a href="admin-videos.html#archives">Archives</a></div></section>')
          s=s.replace('<section class="card section clickable-admin-section" id="sec-messages" role="link" tabindex="0" aria-label="Lire et gérer les messages"><h2>Messages</h2><p class="hint">Messages reçus depuis le bouton MESSAGES du site.</p><a class="admin-link" href="admin-messages.html">Lire et gérer les messages</a></section>', '<section class="card section" id="sec-messages"><h2>Messages</h2><div class="action-menu"><a href="admin-messages.html">Archives</a></div></section>')
          s=s.replace('<section class="card section" id="sec-links"><h2>Liens</h2><p class="hint">Ajouter, modifier ou supprimer les liens affichés dans la rubrique LIENS du site public.</p><a class="admin-link" href="admin-liens.html">Gérer les liens</a></section>', '<section class="card section" id="sec-links"><h2>Liens</h2><div class="action-menu"><a href="admin-liens.html#ajouter">Ajouter</a><a href="admin-liens.html#archives">Archives</a></div></section>')
          s=s.replace('<section class="card section" id="sec-papers"><h2>Papiers</h2><p class="hint">Télécharger, stocker et choisir les documents visibles sur le site public.</p><a class="admin-link" href="admin-papiers.html">Gérer les papiers</a></section>', '<section class="card section" id="sec-papers"><h2>Papiers</h2><div class="action-menu"><a href="admin-papiers.html#ajouter">Ajouter</a><a href="admin-papiers.html#archives">Archives</a></div></section>')
          s=s.replace("function showSection(n){if(n==='photos'){location.href='admin-photos.html';return}", "function showSection(n){")
          start="const msgSection=$('sec-messages');msgSection.onclick=e=>{if(!e.target.closest('a'))location.href='admin-messages.html'};msgSection.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();location.href='admin-messages.html'}};"
          s=s.replace(start,'')
          p.write_text(s)

          p=Path('admin-videos.html'); s=p.read_text(); s=s.replace('<h2>Ajouter une vidéo YouTube</h2>','<h2 id="ajouter">Ajouter une vidéo YouTube</h2>').replace('<h2>Archives vidéos</h2>','<h2 id="archives">Archives vidéos</h2>'); p.write_text(s)
          p=Path('admin-liens.html'); s=p.read_text(); s=s.replace('<h2>Ajouter un lien</h2>','<h2 id="ajouter">Ajouter un lien</h2>').replace('<h2>Liens publiés</h2>','<h2 id="archives">Liens publiés</h2>'); p.write_text(s)
          p=Path('admin-papiers.html'); s=p.read_text(); s=s.replace('<form id="upload">','<div id="ajouter"></div><form id="upload">',1).replace('<h2>Papiers enregistrés</h2>','<h2 id="archives">Papiers enregistrés</h2>'); p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin-videos.html admin-liens.html admin-papiers.html
          git commit -m "Simplify admin navigation with add and archive buttons" || exit 0
          git push
