name: Affiche erreur Worker
on:
  push:
    paths:
      - '.github/workflows/show-worker-error.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Afficher le detail Worker en priorite
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "j.error||j.detail"
          new = "j.detail||j.error"
          if old not in s:
              raise SystemExit('Texte cible introuvable; aucune modification effectuee')
          if s.count(old) != 1:
              raise SystemExit(f'Texte cible present {s.count(old)} fois; aucune modification effectuee')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit et suppression du workflow temporaire
        run: |
          rm -f .github/workflows/show-worker-error.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/show-worker-error.yml
          git commit -m "Affiche le détail des erreurs du formulaire message"
          git push origin main
