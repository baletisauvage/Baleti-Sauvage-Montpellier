name: Update Baleti monochrome style
on:
  push:
    paths:
      - '.github/workflows/baleti-bw.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          changes={
            '💃 BALÈTI SAUVAGE 🕺':'• BALÈTI SAUVAGE •',
            '🎵 MONTPELLIER 🎵':'• MONTPELLIER •',
            "body{margin:0;min-height:calc(100vh - 20px);font-family:Arial,sans-serif;color:#fff;border:8px solid #000;background:url('assets/site-bg.jpg') center/cover fixed no-repeat}":"body{margin:0;min-height:calc(100vh - 20px);font-family:Arial,sans-serif;color:#fff;border:8px solid #000;background:url('assets/site-bg.jpg') center/cover fixed no-repeat}body:before{content:'';position:fixed;inset:0;z-index:-1;background:url('assets/site-bg.jpg') center/cover no-repeat;filter:grayscale(100%)}"
          }
          for old,new in changes.items():
              if old not in s:
                  raise SystemExit('expected code not found: '+old[:60])
              s=s.replace(old,new,1)
          # Hide the original colored body background while retaining its sizing behavior.
          s=s.replace("background:url('assets/site-bg.jpg') center/cover fixed no-repeat}body:before", "background:#000}body:before",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name baletisauvage
          git config user.email baletisauvage@gmail.com
          git add index.html
          git commit -m "Replace ring emojis with dots and grayscale background"
          git push
