<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test D1 — Balèti Sauvage</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:20px;background:#111;color:#fff}.box{background:#222;padding:24px;border-radius:16px}.ok{color:#7ee787}.bad{color:#ff7b72}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><div class="box"><h1>Worker + D1</h1><p id="status">Lecture de la base…</p><pre id="out"></pre></div><script>
const API='https://baleti-sauvage.baletisauvage.workers.dev/api/public';
(async()=>{const s=document.getElementById('status'),o=document.getElementById('out');try{const r=await fetch(API,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Réponse invalide');s.className='ok';s.textContent='✓ Le site lit bien les données D1.';o.textContent=JSON.stringify(d,null,2);}catch(e){s.className='bad';s.textContent='✗ Lecture D1 impossible.';o.textContent=String(e);}})();
</script></body></html>
