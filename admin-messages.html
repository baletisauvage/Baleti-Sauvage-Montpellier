<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1{font-family:Georgia,serif;font-size:42px;font-weight:500;margin:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.back{display:block;padding:0 0 5px;border:0;border-bottom:1px solid #17130d;color:#17130d;background:transparent;font-size:13px;font-weight:800;text-decoration:none}.msg{padding:20px 0;margin:0;border:0;border-top:1px solid #17130d;background:transparent}.msg.unread{border-left:3px solid #17130d;padding-left:14px}.date{font-size:12px;opacity:.6}.text{white-space:pre-wrap;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 14px;border:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-weight:800;cursor:pointer}.delete{border-color:#8b1d14;color:#8b1d14}.status{padding:12px 0;border-bottom:1px solid #17130d;margin:18px 0;font-size:13px}@media(max-width:600px){.wrap{width:90vw;margin-top:24px}h1{font-size:34px}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>Messages</h1><a class="back" href="admin.html">← Menu</a></div><div id="status" class="status">Chargement…</div><div id="list"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let messages=[];async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}const post=(p,b)=>call(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});function date(s){try{return new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',dateStyle:'short',timeStyle:'short'}).format(new Date(String(s).replace(' ','T')+'Z'))}catch{return s||''}}function render(){const unread=messages.filter(m=>!Number(m.lu)).length;document.getElementById('status').textContent=messages.length+' message'+(messages.length>1?'s':'')+(unread?' — '+unread+' nouveau'+(unread>1?'x':''):'');document.getElementById('list').innerHTML=messages.length?messages.map(m=>`<article class="msg ${Number(m.lu)?'':'unread'}"><div class="date">${esc(date(m.date_creation))}</div><h3>${Number(m.lu)?'':'● '}${esc(m.prenom||'Visiteur')}</h3>${m.contact?`<p><strong>Contact :</strong> ${esc(m.contact)}</p>`:''}<p class="text">${esc(m.message)}</p><div class="actions">${Number(m.lu)?'':`<button data-read="${m.id}">Marquer comme lu</button>`}<button class="delete" data-del="${m.id}">Supprimer</button></div></article>`).join(''):'<p>Aucun message.</p>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{try{const j=await post('/api/messages/read',{id:+b.dataset.read});messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement ce message ?'))return;try{const j=await post('/api/messages/delete',{id:+b.dataset.del});messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}})}async function load(){try{const s=await call('/api/session');if(!s.authenticated){location.href='admin.html';return}const j=await call('/api/admin');messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}}load();</script></body></html>
