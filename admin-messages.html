blication">×</button></header><form id="publishForm" class="publish-form"><p id="publishDestination"></p><label for="publishTitle">Titre visible sur le site public</label><input id="publishTitle" maxlength="100" required><p class="publish-privacy">Seule la pièce jointe sera rendue publique. Le message et les coordonnées restent privés.</p><label class="publish-rights"><input id="publishRights" type="checkbox" required><span>Je confirme disposer des autorisations nécessaires pour publier ce fichier.</span></label><p id="publishStatus" role="status" aria-live="polite"></p><div class="publish-actions"><button type="button" id="publishCancel">Fermer</button><button type="submit" id="publishSubmit">Confirmer la publication</button></div></form></dialog><script src="attachment-preview.js?v=20261015-preview1"></script><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let messages=[];async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}const post=(p,b)=>call(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});function date(s){try{return new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',dateStyle:'short',timeStyle:'short'}).format(new Date(String(s).replace(' ','T')+'Z'))}catch{return s||''}}function size(n){n=Number(n||0);if(n<1024)return n+' o';if(n<1048576)return(n/1024).toFixed(1).replace('.',',')+' Ko';return(n/1048576).toFixed(1).replace('.',',')+' Mo'}async function downloadAttachment(id,name){const status=document.getElementById('status');try{status.textContent='Téléchargement…';const r=await fetch(API+'/api/messages/attachment?id='+encodeURIComponent(id),{credentials:'include'});if(r.status===401){location.href='admin.html';return}if(!r.ok){let msg='HTTP '+r.status;try{const j=await r.json();msg=j.error||j.detail||msg}catch{}throw Error(msg)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name||'piece-jointe';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=messages.length+' message'+(messages.length>1?'s':'')}catch(e){status.textContent='Erreur : '+e.message}}function publicationDestination(m){return /^image\//.test(m?.attachment_type||'')?'Photos':/^video\//.test(m?.attachment_type||'')?'Vidéos':'Papiers'}let publicationMessage=null,publicationBusy=false;
const publicationDialog=document.getElementById('publishDialog'),publicationStatus=document.getElementById('publishStatus'),publicationSubmit=document.getElementById('publishSubmit');
function openPublication(id){const m=messages.find(x=>Number(x.id)===id);if(!m)return;publicationMessage=m;document.getElementById('publishForm').reset();document.getElementById('publishTitle').value=String(m.attachment_name||'Pièce jointe').replace(/\.[^.]+$/,'').slice(0,100);document.getElementById('publishTitle').disabled=false;document.getElementById('publishRights').disabled=false;document.getElementById('publishDestination').textContent='Destination : '+publicationDestination(m);publicationStatus.textContent='Choisis un titre et confirme l’autorisation ci-dessous.';publicationStatus.classList.remove('error');publicationSubmit.disabled=false;publicationSubmit.textContent='Confirmer la publication';publicationDialog.showModal()}

document.getElementById('publishForm').onsubmit=async e=>{e.preventDefault();if(publicationBusy||!publicationMessage)return;const title=document.getElementById('publishTitle').value.trim(),rights=document.getElementById('publishRights').checked;if(!title||!rights){publicationStatus.textContent='Un titre et l’autorisation de publication sont obligatoires.';publicationStatus.classList.add('error');return}const m=publicationMessage,destination=publicationDestination(m);publicationBusy=true;publicationSubmit.disabled=true;publicationSubmit.textContent='Publication en cours…';publicationStatus.classList.remove('error');publicationStatus.textContent='Copie du fichier et publication dans '+destination+'…';try{const j=await post('/api/messages/publish',{id:Number(m.id),title,confirmRights:rights});m.published_count=1;render();const success=(j.alreadyPublished?'Déjà publié':'Publication réussie')+' dans '+destination+'. Ouvre ou recharge la galerie publique pour le voir.';publicationStatus.textContent='✓ '+success;document.getElementById('status').textContent='✓ '+success;document.getElementById('publishTitle').disabled=true;document.getElementById('publishRights').disabled=true;publicationSubmit.textContent='Publié'}catch(error){publicationStatus.textContent='Publication impossible : '+error.message;publicationStatus.classList.add('error');publicationSubmit.disabled=false;publicationSubmit.textContent='Réessayer'}finally{publicationBusy=false}};
function render(){const unread=messages.filter(m=>!Number(m.lu)).length;document.getElementById('status').textContent=messages.length+' message'+(messages.length>1?'s':'')+(unread?' — '+unread+' nouveau'+(unread>1?'x':''):'');document.getElementById('list').innerHTML=messages.length?messages.map(m=>`<article class="msg ${Number(m.lu)?'':'unread'}"><div class="date">${esc(date(m.date_creation))}</div><h3>${Number(m.lu)?'':'● '}${esc(m.prenom||'Visiteur')}</h3>${m.contact?`<p><strong>Contact :</strong> ${esc(m.contact)}</p>`:''}<p class="text">${esc(m.message)}</p>${m.attachment_file_id?`<div class="attachment"><p class="attachment-meta"><strong>Pièce jointe :</strong> ${esc(m.attachment_name||'fichier')} · ${esc(m.attachment_type||'fichier')} · ${esc(size(m.attachment_size))}</p><div class="attachment-tools"><button type="button" class="preview-button" data-preview="${m.id}">Aperçu</button><button type="button" data-download="${m.id}" data-name="${esc(m.attachment_name||'piece-jointe')}">Télécharger la pièce jointe</button> ${Number(m.published_count)>0?`<span class="published-badge">✓ Publié dans ${publicationDestination(m)}</span>`:`<button type="button" data-publish="${m.id}">Publier sur le site</button>`}</div></div>`:''}<div class="actions">${Number(m.lu)?'':`<button data-read="${m.id}">Marquer comme lu</button>`}<button class="delete" data-del="${m.id}">Supprimer</button></div></article>`).join(''):'<p>Aucun message.</p>';document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{const m=messages.find(m=>Number(m.id)===Number(b.dataset.preview));if(m)window.previewAttachment(m,()=>downloadAttachment(m.id,m.attachment_name))});document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadAttachment(+b.dataset.download,b.dataset.name));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>openPublication(Number(b.dataset.publish)));document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{try{const j=await post('/api/messages/read',{id:+b.dataset.read});messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement ce message et sa pièce jointe éventuelle ?'))return;try{const j=await post('/api/messages/delete',{id:+b.dataset.del});messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}})}async function load(){try{const s=await call('/api/session');if(!s.authenticated){location.href='admin.html';return}const j=await call('/api/admin');messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}}load();</script></body></html>
