<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(800px,94vw);margin:30px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.back,button{padding:11px 14px;border:2px solid #222;border-radius:9px;background:#17130d;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.msg{padding:14px;margin:10px 0;border:2px solid #222;border-radius:12px;background:#fff8e8}.msg.unread{border-width:4px}.date{font-size:13px;opacity:.7}.text{white-space:pre-wrap;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.delete{background:#7e1812}.status{padding:12px;background:#fff8e8;border-radius:8px}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>Messages</h1><a class="back" href="admin.html">← Menu</a></div><div id="status" class="status">Chargement…</div><div id="list"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let messages=[];async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.detail||'Erreur');return j}const post=(p,b)=>call(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});function date(s){try{return new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',dateStyle:'short',timeStyle:'short'}).format(new Date(String(s).replace(' ','T')+'Z'))}catch{return s||''}}function render(){const unread=messages.filter(m=>!Number(m.lu)).length;document.getElementById('status').textContent=messages.length+' message'+(messages.length>1?'s':'')+(unread?' — '+unread+' nouveau'+(unread>1?'x':''):'');document.getElementById('list').innerHTML=messages.length?messages.map(m=>`<article class="msg ${Number(m.lu)?'':'unread'}"><div class="date">${esc(date(m.date_creation))}</div><h3>${Number(m.lu)?'':'● '}${esc(m.prenom||'Visiteur')}</h3>${m.contact?`<p><strong>Contact :</strong> ${esc(m.contact)}</p>`:''}<p class="text">${esc(m.message)}</p><div class="actions">${Number(m.lu)?'':`<button data-read="${m.id}">Marquer comme lu</button>`}<button class="delete" data-del="${m.id}">Supprimer</button></div></article>`).join(''):'<p>Aucun message.</p>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{const j=await post('/api/messages/read',{id:+b.dataset.read});messages=j.messages;render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement ce message ?'))return;const j=await post('/api/messages/delete',{id:+b.dataset.del});messages=j.messages;render()})}async function load(){try{const s=await call('/api/session');if(!s.authenticated){location.href='admin.html';return}const j=await call('/api/admin');messages=j.messages||[];render()}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}}load();</script></body></html>
