<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px;margin-bottom:10px}h2{font-size:27px}label{display:block;font-size:14px;margin-top:12px}input,button{width:100%;padding:10px 2px;margin:3px 0 10px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.photo-menu{display:flex;gap:8px;margin:22px 0 0}.photo-menu button{margin:0}.photo-menu button.active{background:#17130d;color:#f4f0e7}.photo-panel{display:none}.photo-panel.active{display:block}.checks{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 16px}.checks label{display:flex;gap:7px;align-items:center;margin:0}.checks input{width:auto;margin:0}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px}.photo{min-width:0;padding:0 0 20px;border-bottom:1px solid #17130d;background:transparent}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #17130d;margin-bottom:12px}.photo .meta{min-width:0}.photo label{font-size:12px;margin-top:8px}.photo input{font-size:13px;padding:7px 1px;margin-bottom:6px}.photo .checks{gap:12px;margin:10px 0}.photo .checks label{font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{margin:0;padding:7px 9px;font-size:12px}.delete{border-color:#8b1d14;color:#8b1d14}.status{padding:12px 0;border:0;border-bottom:1px solid #17130d;margin-top:10px;font-size:13px}.hidden{display:none}@media(max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.wrap{width:90vw;margin-top:24px}.photo-menu{display:grid;grid-template-columns:1fr 1fr}.photo-menu button{width:100%}.gallery{grid-template-columns:1fr}.photo img{aspect-ratio:auto;max-height:70vh}.actions{flex-wrap:wrap}h1{font-size:34px}}</style></head><body><main class="wrap"><section class="card"><a class="back" href="admin.html">← Retour à l’administration</a><h1>Photos</h1><div class="photo-menu"><button type="button" data-view="add">Ajouter une photo</button><button type="button" data-view="gallery">Galerie</button></div></section><section class="card photo-panel" id="panel-add"><h2>Ajouter une photo</h2><p>Photos originales JPG, sans transformation.</p><form id="upload"><label>Photo JPG<input id="photo" name="photo" type="file" accept="image/jpeg,.jpg,.jpeg" required></label><label>Titre / légende<input name="titre" maxlength="100"></label><label>Date<input name="datePhoto" type="date"></label><label>Crédit<input name="credit" maxlength="120"></label><label>Lien<input name="lien" type="url" placeholder="https://…"></label><label>Texte du lien<input name="texteLien" maxlength="80"></label><div class="checks"><label><input name="visible" type="checkbox" checked> Visible</label><label><input name="principale" type="checkbox"> Photo principale</label></div><button type="submit">Ajouter la photo</button></form><div id="status" class="status"></div></section><section class="card photo-panel" id="panel-gallery"><h2>Galerie</h2><div id="list" class="gallery">Chargement…</div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),list=document.getElementById('list');let photos=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function view(name){document.querySelectorAll('.photo-panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+name));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===name));history.replaceState(null,'','?view='+name)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}function render(){if(!photos.length){list.innerHTML='<p>Aucune photo enregistrée.</p>';return}list.innerHTML=photos.map((p,i)=>`<article class="photo"><img src="${esc(p.url)}?v=${Date.now()}" alt="${esc(p.titre||'Photo enregistrée')}" loading="lazy"><div class="meta"><label>Titre / légende<input maxlength="100" data-i="${i}" data-k="titre" value="${esc(p.titre)}"></label><label>Date<input type="date" data-i="${i}" data-k="datePhoto" value="${esc(p.datePhoto)}"></label><label>Crédit<input maxlength="120" data-i="${i}" data-k="credit" value="${esc(p.credit)}"></label><label>Lien<input type="url" data-i="${i}" data-k="lien" value="${esc(p.lien)}"></label><label>Texte du lien<input maxlength="80" data-i="${i}" data-k="texteLien" value="${esc(p.texteLien)}"></label><div class="checks"><label><input type="checkbox" data-i="${i}" data-k="visible" ${p.visible?'checked':''}> Visible</label><label><input type="checkbox" data-i="${i}" data-k="principale" ${p.principale?'checked':''}> Principale</label></div><div class="actions"><button data-save="${i}">Enregistrer</button><button class="delete" data-delete="${i}">Supprimer</button></div></div></article>`).join('');list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(+b.dataset.save));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete))}function val(i,k){const e=list.querySelector(`[data-i="${i}"][data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value}async function load(){try{const s=await req('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await req('/api/admin');photos=d.photos||[];render();status.textContent=photos.length+' photo(s) enregistrée(s).'}catch(e){status.textContent='Erreur : '+e.message}}document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),file=document.getElementById('photo').files[0];if(!file)return;if(file.type!=='image/jpeg'){status.textContent='Format accepté : JPG uniquement.';return}if(file.size>8*1024*1024){status.textContent='La photo dépasse 8 Mo.';return}fd.set('visible',f.visible.checked?'1':'0');fd.set('principale',f.principale.checked?'1':'0');status.textContent='Téléversement en cours…';try{const d=await req('/api/photos/upload',{method:'POST',body:fd});photos=d.photos||[];f.reset();f.visible.checked=true;render();status.textContent='Photo ajoutée.'}catch(e){status.textContent='Erreur : '+e.message}};async function save(i){const p=photos[i];try{const d=await req('/api/photos/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier,titre:val(i,'titre'),datePhoto:val(i,'datePhoto'),credit:val(i,'credit'),lien:val(i,'lien'),texteLien:val(i,'texteLien'),visible:val(i,'visible'),principale:val(i,'principale')})});photos=d.photos||[];render();status.textContent='Photo modifiée.'}catch(e){status.textContent='Erreur : '+e.message}}async function del(i){const p=photos[i];if(!confirm('Supprimer cette photo ?'))return;try{const d=await req('/api/photos/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier})});photos=d.photos||[];render();status.textContent='Photo supprimée.'}catch(e){status.textContent='Erreur : '+e.message}}const initial=new URLSearchParams(location.search).get('view');view(initial==='gallery'?'gallery':'add');load();</script></body></html>
