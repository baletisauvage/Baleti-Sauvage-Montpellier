<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(900px,94vw);margin:28px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif}input,button{width:100%;padding:11px;margin:5px 0 10px;border:2px solid #222;border-radius:9px;font-size:16px}button{background:#17130d;color:#fff;font-weight:800;cursor:pointer}.back{display:inline-block;color:#17130d;font-weight:bold;margin-bottom:8px}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px}.checks label{display:flex;gap:7px;align-items:center}.checks input{width:auto;margin:0}.photo{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:14px;margin:12px 0;background:#fff8e8;border:2px solid #17130d;border-radius:13px}.photo img{width:180px;height:150px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:8px}.actions button{margin:0}.delete{background:#7b1d18}.status{padding:11px;background:#fff8e8;border-radius:9px;margin-top:10px}.hidden{display:none}@media(max-width:650px){.photo{grid-template-columns:1fr}.photo img{width:100%;height:auto}.actions{display:block}}</style></head><body><main class="wrap"><section class="card"><a class="back" href="admin.html">← Retour à l’administration</a><h1>Photos</h1><p>Photos originales JPG, sans transformation.</p><form id="upload"><label>Photo JPG<input id="photo" name="photo" type="file" accept="image/jpeg,.jpg,.jpeg" required></label><label>Titre / légende<input name="titre" maxlength="100"></label><label>Date<input name="datePhoto" type="date"></label><label>Crédit<input name="credit" maxlength="120"></label><label>Lien<input name="lien" type="url" placeholder="https://…"></label><label>Texte du lien<input name="texteLien" maxlength="80"></label><div class="checks"><label><input name="visible" type="checkbox" checked> Visible</label><label><input name="principale" type="checkbox"> Photo principale</label></div><button type="submit">Ajouter la photo</button></form><div id="status" class="status"></div></section><section class="card"><h2>Photos enregistrées</h2><div id="list">Chargement…</div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),list=document.getElementById('list');let photos=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(!r.ok||!j.ok)throw Error(j.error||j.detail||'Erreur');return j}function render(){if(!photos.length){list.innerHTML='<p>Aucune photo enregistrée.</p>';return}list.innerHTML=photos.map((p,i)=>`<article class="photo"><img src="${esc(p.url)}?v=${Date.now()}" alt=""><div><label>Titre / légende<input data-i="${i}" data-k="titre" value="${esc(p.titre)}"></label><label>Date<input type="date" data-i="${i}" data-k="datePhoto" value="${esc(p.datePhoto)}"></label><label>Crédit<input data-i="${i}" data-k="credit" value="${esc(p.credit)}"></label><label>Lien<input data-i="${i}" data-k="lien" value="${esc(p.lien)}"></label><label>Texte du lien<input data-i="${i}" data-k="texteLien" value="${esc(p.texteLien)}"></label><div class="checks"><label><input type="checkbox" data-i="${i}" data-k="visible" ${p.visible?'checked':''}> Visible</label><label><input type="checkbox" data-i="${i}" data-k="principale" ${p.principale?'checked':''}> Principale</label></div><div class="actions"><button data-save="${i}">Enregistrer</button><button class="delete" data-delete="${i}">Supprimer</button></div></div></article>`).join('');list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(+b.dataset.save));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete))}function val(i,k){const e=list.querySelector(`[data-i="${i}"][data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value}async function load(){try{const s=await req('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await req('/api/admin');photos=d.photos||[];render();status.textContent=photos.length+' photo(s) enregistrée(s).'}catch(e){status.textContent='Erreur : '+e.message}}document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),file=document.getElementById('photo').files[0];if(!file)return;if(file.type!=='image/jpeg'){status.textContent='Format accepté : JPG uniquement.';return}if(file.size>8*1024*1024){status.textContent='La photo dépasse 8 Mo.';return}fd.set('visible',f.visible.checked?'1':'0');fd.set('principale',f.principale.checked?'1':'0');status.textContent='Téléversement en cours…';try{const d=await req('/api/photos/upload',{method:'POST',body:fd});photos=d.photos||[];f.reset();f.visible.checked=true;render();status.textContent='Photo ajoutée.'}catch(e){status.textContent='Erreur : '+e.message}};async function save(i){const p=photos[i];try{const d=await req('/api/photos/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier,titre:val(i,'titre'),datePhoto:val(i,'datePhoto'),credit:val(i,'credit'),lien:val(i,'lien'),texteLien:val(i,'texteLien'),visible:val(i,'visible'),principale:val(i,'principale')})});photos=d.photos||[];render();status.textContent='Photo modifiée.'}catch(e){status.textContent='Erreur : '+e.message}}async function del(i){const p=photos[i];if(!confirm('Supprimer cette photo ?'))return;try{const d=await req('/api/photos/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier})});photos=d.photos||[];render();status.textContent='Photo supprimée.'}catch(e){status.textContent='Erreur : '+e.message}}load();</script></body></html>
