<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{border-top:1px solid #17130d;padding:26px 0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.status{padding:12px 0;border-bottom:1px solid #17130d;margin:10px 0}.contact{padding:18px 0;border-top:1px solid #17130d}.contact.inactive{opacity:.5}.name{font-family:Georgia,serif;font-size:20px}.meta{font-size:13px;opacity:.7;margin:6px 0 12px}.coords{line-height:1.7;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 14px;border:1px solid #17130d;background:transparent;color:#17130d;font-weight:800;cursor:pointer}.danger{border-color:#8b1d14;color:#8b1d14}.empty{padding:18px 0}.stats{font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button.active{background:#17130d;color:#f4f0e7}@media(max-width:600px){.wrap{width:90vw;margin-top:24px}h1{font-size:34px}}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}return F(input,opt)}})();</script></head><body><main class="wrap"><a class="back" href="admin.html">← ADMINISTRATION</a><section class="card"><h1>CONTACTS</h1><p class="stats" id="stats">Chargement…</p><div class="filters"><button data-filter="active" class="active">ACTIFS</button><button data-filter="all">TOUS</button></div><div id="status" class="status"></div></section><section class="card"><div id="list"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',L=document.getElementById('list'),S=document.getElementById('status'),ST=document.getElementById('stats');let contacts=[],filter='active';async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||('HTTP '+r.status));return j}const post=(p,b)=>call(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(s){if(!s)return'';let d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?esc(s):d.toLocaleString('fr-FR')}function draw(){let active=contacts.filter(x=>Number(x.active)),rows=filter==='active'?active:contacts;ST.textContent=active.length+' contact(s) actif(s) — '+contacts.length+' au total';L.innerHTML=rows.length?rows.map(x=>'<article class="contact '+(Number(x.active)?'':'inactive')+'"><div class="name">'+esc(x.prenom||'Sans prénom')+'</div><div class="coords">'+(x.email?'E-mail : '+esc(x.email)+'<br>':'')+(x.telephone?'Téléphone / WhatsApp : '+esc(x.telephone):'')+'</div><div class="meta">Inscription : '+date(x.created_at)+(Number(x.active)?'':' — désinscrit : '+date(x.unsubscribed_at))+'</div><div class="actions">'+(Number(x.active)?'<button data-off="'+x.id+'">DÉSACTIVER</button>':'')+'<button class="danger" data-del="'+x.id+'">SUPPRIMER</button></div></article>').join(''):'<div class="empty">Aucun contact dans cette vue.</div>';document.querySelectorAll('[data-off]').forEach(b=>b.onclick=async()=>{if(!confirm('Désinscrire ce contact ?'))return;try{let j=await post('/api/contacts/deactivate',{id:+b.dataset.off});contacts=j.contacts||[];draw();S.textContent='✓ Contact désinscrit.'}catch(e){S.textContent='× '+e.message}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement ce contact ?'))return;try{let j=await post('/api/contacts/delete',{id:+b.dataset.del});contacts=j.contacts||[];draw();S.textContent='✓ Contact supprimé.'}catch(e){S.textContent='× '+e.message}})}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});(async()=>{try{let j=await call('/api/admin');contacts=Array.isArray(j.contacts)?j.contacts:[];draw();S.textContent='Liste chargée.'}catch(e){S.textContent='× '+e.message}})();</script></body></html>
