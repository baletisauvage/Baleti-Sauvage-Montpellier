<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{border-top:1px solid #17130d;padding:26px 0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.status{padding:12px 0;border-bottom:1px solid #17130d;margin:10px 0}.contact{padding:18px 0;border-top:1px solid #17130d}.contact.inactive{opacity:.5}.name{font-family:Georgia,serif;font-size:20px}.meta{font-size:13px;opacity:.7;margin:6px 0 12px}.coords{line-height:1.7;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 14px;border:1px solid #17130d;background:transparent;color:#17130d;font-weight:800;cursor:pointer}.danger{border-color:#8b1d14;color:#8b1d14}.empty{padding:18px 0}.stats{font-size:14px}input[type="search"]{width:100%;padding:11px 2px;margin:14px 0 4px;border:0;border-bottom:1px solid #17130d;background:transparent;color:#17130d;font-size:15px}input[type="search"]:focus{outline:0;border-bottom-width:2px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button.active{background:#17130d;color:#f4f0e7}@media(max-width:600px){.wrap{width:90vw;margin-top:24px}h1{font-size:34px}}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}return F(input,opt)}})();</script></head><body><main class="wrap"><a class="back" href="admin.html">← ADMINISTRATION</a><section class="card"><h1>CONTACTS</h1><p class="stats" id="stats">Chargement…</p><input id="search" type="search" placeholder="Rechercher prénom, e-mail ou téléphone"><div class="filters"><button data-filter="active" class="active">ACTIFS</button><button data-filter="all">TOUS</button><button data-filter="messages">ISSUS DES MESSAGES</button></div><div id="status" class="status"></div></section><section class="card"><div id="list"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',L=document.getElementById('list'),S=document.getElementById('status'),ST=document.getElementById('stats');let contacts=[],messages=[],people=[],filter='active',query='';async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||('HTTP '+r.status));return j}const post=(p,b)=>call(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(s){if(!s)return'';let d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?esc(s):d.toLocaleString('fr-FR')}function emailKey(v){let s=String(v||'').trim().toLowerCase(),m=s.match(/[a-z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-z0-9.-]+\.[a-z]{2,}/i);return m?m[0].toLowerCase():''}function phoneKey(v){let s=String(v||'').trim(),m=s.match(/(?:\+?33|0)[\s.()-]*[1-9](?:[\s.()-]*\d{2}){4}/);if(!m)return'';let n=m[0].replace(/\D/g,'');if(n.startsWith('33'))n='0'+n.slice(2);return n.length===10?n:''}function keys(v){let e=emailKey(v),p=phoneKey(v);return[e&&'e:'+e,p&&'p:'+p].filter(Boolean)}function rebuild(){let groups=[],map=new Map;function groupFor(ks){for(const k of ks)if(map.has(k))return map.get(k);let g={contacts:[],messages:[],keys:new Set};groups.push(g);return g}function bind(g,ks){for(const k of ks){let other=map.get(k);if(other&&other!==g){other.contacts.push(...g.contacts);other.messages.push(...g.messages);for(const x of g.keys)other.keys.add(x);groups=groups.filter(z=>z!==g);g=other}g.keys.add(k);map.set(k,g)}return g}for(const x of contacts){let ks=[...keys(x.email),...keys(x.telephone)],g=groupFor(ks);g.contacts.push(x);bind(g,ks)}for(const m of messages){let ks=keys(m.contact),g=groupFor(ks);g.messages.push(m);bind(g,ks)}people=groups.map(g=>{let cs=g.contacts.slice().sort((a,b)=>Number(b.active)-Number(a.active)),c=cs[0]||null,m=g.messages[0]||null,active=cs.some(x=>Number(x.active)),emails=[...new Set([...cs.map(x=>emailKey(x.email)),...g.messages.map(x=>emailKey(x.contact))].filter(Boolean))],phones=[...new Set([...cs.map(x=>phoneKey(x.telephone)),...g.messages.map(x=>phoneKey(x.contact))].filter(Boolean))];return{c,cs,ms:g.messages,active,prenom:c?.prenom||m?.prenom||'',emails,phones}});draw()}function draw(){let active=people.filter(x=>x.active),rows=filter==='active'?active:filter==='messages'?people.filter(x=>x.ms.length):people;if(query)rows=rows.filter(x=>(x.prenom+' '+x.emails.join(' ')+' '+x.phones.join(' ')).toLowerCase().includes(query));ST.textContent=active.length+' contact(s) actif(s) — '+people.length+' personne(s) regroupée(s) — '+people.filter(x=>!x.cs.length&&x.ms.length).length+' issue(s) uniquement des messages';L.innerHTML=rows.length?rows.map(x=>{let src=(x.cs.length?'CONTACT':'')+(x.cs.length&&x.ms.length?' + ':'')+(x.ms.length?'MESSAGE'+(x.ms.length>1?'S':''):'');return'<article class="contact '+(x.active?'':'inactive')+'"><div class="name">'+esc(x.prenom||'Sans prénom')+'</div><div class="coords">'+x.emails.map(v=>'E-mail : '+esc(v)).join('<br>')+(x.emails.length&&x.phones.length?'<br>':'')+x.phones.map(v=>'Téléphone / WhatsApp : '+esc(v)).join('<br>')+'</div><div class="meta">Source : '+src+(x.active?' — consentement CONTACT actif':' — pas de consentement actif')+(x.ms.length?' — '+x.ms.length+' message(s)':'')+'</div><div class="actions">'+(x.active&&x.c?'<button data-off="'+x.c.id+'">DÉSACTIVER</button>':'')+(x.c?'<button class="danger" data-del="'+x.c.id+'">SUPPRIMER LE CONTACT</button>':'')+'</div></article>'}).join(''):'<div class="empty">Aucun contact dans cette vue.</div>';document.querySelectorAll('[data-off]').forEach(b=>b.onclick=async()=>{if(!confirm('Désinscrire ce contact ?'))return;try{let j=await post('/api/contacts/deactivate',{id:+b.dataset.off});contacts=j.contacts||[];rebuild();S.textContent='✓ Contact désinscrit.'}catch(e){S.textContent='× '+e.message}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer la fiche CONTACT ? Les messages restent conservés.'))return;try{let j=await post('/api/contacts/delete',{id:+b.dataset.del});contacts=j.contacts||[];rebuild();S.textContent='✓ Fiche contact supprimée. Les messages sont conservés.'}catch(e){S.textContent='× '+e.message}})}document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();draw()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});(async()=>{try{let j=await call('/api/admin');contacts=Array.isArray(j.contacts)?j.contacts:[];messages=Array.isArray(j.messages)?j.messages:[];rebuild();S.textContent='Contacts et adresses des messages comparés et regroupés.'}catch(e){S.textContent='× '+e.message}})();</script></body></html>
