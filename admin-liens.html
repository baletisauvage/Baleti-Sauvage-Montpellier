<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liens — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}h2{font-size:27px}input,button{width:100%;padding:10px 2px;margin:5px 0 12px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.back{display:block;width:max-content;margin-bottom:28px;padding:0 0 5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.hint{font-size:13px;opacity:.65}.status{padding:12px 0;border:0;border-bottom:1px solid #17130d;margin:10px 0;font-size:13px}.link-row{background:transparent;border:0;border-top:1px solid #17130d;padding:18px 0;margin:0}.link-row .actions{display:flex;gap:8px}.danger{border-color:#8b1d14;color:#8b1d14}.empty{padding:16px 0;border-top:1px solid #17130d}.secondary{background:transparent;color:#17130d}@media(max-width:600px){.wrap{width:90vw;margin-top:24px}.link-row .actions{flex-wrap:wrap}h1{font-size:34px}}</style></head><body><main class="wrap"><a class="back" href="admin.html">← ADMINISTRATION</a><section class="card"><h1>LIENS</h1><p class="hint">Ajoute ici les liens qui doivent apparaître dans la rubrique LIENS du site public.</p><h2 id="ajouter">Ajouter un lien</h2><input id="title" maxlength="120" placeholder="Titre du lien (ex. Facebook, association, agenda…)"><input id="url" type="url" maxlength="1000" placeholder="https://…"><button id="add">AJOUTER LE LIEN</button><div id="status" class="status">Chargement…</div></section><section class="card"><h2 id="archives">Liens publiés</h2><div id="list"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',S=document.getElementById('status'),L=document.getElementById('list');let links=[];async function call(p,o={}){let r=await fetch(API+p,{credentials:'include',...o}),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}async function save(nextLinks,msg){let j=await call('/api/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({links:nextLinks})});links=Array.isArray(j.links)?j.links:[];draw();S.textContent='✓ '+msg}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function valid(title,url){return !!title&&/^https?:\/\//i.test(url)}function draw(){L.innerHTML=links.length?links.map((x,i)=>'<div class="link-row"><input maxlength="120" data-title="'+i+'" value="'+esc(x.title)+'" aria-label="Titre"><input type="url" maxlength="1000" data-url="'+i+'" value="'+esc(x.url)+'" aria-label="Adresse"><div class="actions"><button data-save="'+i+'">ENREGISTRER</button><button class="danger" data-del="'+i+'">SUPPRIMER</button></div></div>').join(''):'<div class="empty">Aucun lien pour le moment.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{let i=+b.dataset.save,title=document.querySelector('[data-title="'+i+'"]').value.trim(),url=document.querySelector('[data-url="'+i+'"]').value.trim();if(!valid(title,url)){S.textContent='Indique un titre et une adresse commençant par http:// ou https://';return}let next=links.slice();next[i]={title,url};try{await save(next,'Lien modifié.')}catch(e){S.textContent='× '+e.message}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{let i=+b.dataset.del;if(!confirm('Supprimer ce lien ?'))return;let next=links.filter((_,n)=>n!==i);try{await save(next,'Lien supprimé.')}catch(e){S.textContent='× '+e.message}})}document.getElementById('add').onclick=async()=>{let title=document.getElementById('title').value.trim(),url=document.getElementById('url').value.trim();if(!valid(title,url)){S.textContent='Indique un titre et une adresse commençant par http:// ou https://';return}let next=[{title,url},...links];try{await save(next,'Lien ajouté au site public.');document.getElementById('title').value='';document.getElementById('url').value=''}catch(e){S.textContent='× '+e.message}};(async()=>{try{let j=await call('/api/admin');links=Array.isArray(j.settings?.links)?j.settings.links:[];draw();S.textContent=links.length+' lien(s) actuellement publié(s).'}catch(e){S.textContent='× '+e.message}})();</script></body></html>
