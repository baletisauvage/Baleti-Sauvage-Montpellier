<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liens — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(800px,94vw);margin:30px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif;margin-top:0}input,button{width:100%;padding:11px;margin:5px 0 10px;border:2px solid #222;border-radius:9px;font-size:16px}button{font-weight:800;cursor:pointer;background:#17130d;color:#fff}.back{display:inline-block;padding:10px 15px;border:2px solid #f6e6bd;border-radius:9px;color:#fff;text-decoration:none;font-weight:900}.hint{font-size:14px;opacity:.78}.status{padding:12px;border-radius:8px;background:#fff8e8;margin:10px 0}.link-row{background:#fff8e8;border:2px solid #17130d;border-radius:12px;padding:12px;margin:10px 0}.link-row .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{background:#f6e6bd;color:#17130d}.danger{background:#8b1d14}.empty{padding:16px;text-align:center;background:#fff8e8;border-radius:10px}@media(max-width:600px){.link-row .actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="admin.html">← ADMINISTRATION</a><section class="card"><h1>LIENS</h1><p class="hint">Ajoute ici les liens qui doivent apparaître dans la rubrique LIENS du site public.</p><h2>Ajouter un lien</h2><input id="title" placeholder="Titre du lien (ex. Facebook, association, agenda…)"><input id="url" type="url" placeholder="https://…"><button id="add">AJOUTER LE LIEN</button><div id="status" class="status">Chargement…</div></section><section class="card"><h2>Liens publiés</h2><div id="list"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',S=document.getElementById('status'),L=document.getElementById('list');let links=[];async function call(p,o={}){let r=await fetch(API+p,{credentials:'include',...o}),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok)throw Error(j.error||j.detail||('HTTP '+r.status));return j}async function save(msg){let j=await call('/api/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({links})});links=j.links||[];draw();S.textContent='✓ '+msg}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){L.innerHTML=links.length?links.map((x,i)=>'<div class="link-row"><input data-title="'+i+'" value="'+esc(x.title)+'" aria-label="Titre"><input data-url="'+i+'" value="'+esc(x.url)+'" aria-label="Adresse"><div class="actions"><button data-save="'+i+'">ENREGISTRER</button><button class="danger" data-del="'+i+'">SUPPRIMER</button></div></div>').join(''):'<div class="empty">Aucun lien pour le moment.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{let i=+b.dataset.save;links[i]={title:document.querySelector('[data-title="'+i+'"]').value.trim(),url:document.querySelector('[data-url="'+i+'"]').value.trim()};try{await save('Lien modifié.')}catch(e){S.textContent='× '+e.message}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{let i=+b.dataset.del;if(!confirm('Supprimer ce lien ?'))return;links.splice(i,1);try{await save('Lien supprimé.')}catch(e){S.textContent='× '+e.message}})}document.getElementById('add').onclick=async()=>{let title=document.getElementById('title').value.trim(),url=document.getElementById('url').value.trim();if(!title||!/^https?:\/\//i.test(url)){S.textContent='Indique un titre et une adresse commençant par http:// ou https://';return}links.unshift({title,url});try{await save('Lien ajouté au site public.');document.getElementById('title').value='';document.getElementById('url').value=''}catch(e){S.textContent='× '+e.message}};(async()=>{try{let j=await call('/api/admin');links=Array.isArray(j.settings?.links)?j.settings.links:[];draw();S.textContent=links.length+' lien(s) actuellement publié(s).'}catch(e){S.textContent='× '+e.message}})();</script></body></html>
