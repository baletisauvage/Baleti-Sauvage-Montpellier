<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Administration — Balèti Sauvage</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(800px,94vw);margin:30px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif;margin-top:0}input,textarea,select,button{width:100%;padding:11px;margin:5px 0 10px;border:2px solid #222;border-radius:9px;font-size:16px}button{font-weight:800;cursor:pointer;background:#17130d;color:#fff}.hidden{display:none}.status{padding:12px;border-radius:8px;background:#fff8e8;margin:8px 0;line-height:1.5}.secondary{background:#f6e6bd;color:#17130d}.map{height:330px;border:3px solid #17130d;border-radius:12px;margin:10px 0;overflow:hidden;background:#ddd}.map-error{display:grid;place-items:center;padding:20px;text-align:center}.hint{font-size:13px;opacity:.75}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top button{width:auto}.cancel-line{display:flex;gap:8px;align-items:center;margin:8px 0 12px}.cancel-line input{width:auto;margin:0}.selected{font-weight:700}.error{background:#ffd9d5;border:2px solid #9b2118}@media(max-width:600px){.map{height:280px}}</style></head><body><main class="wrap"><section class="card" id="login"><h1>Administration</h1><p>Balèti Sauvage Montpellier</p><input id="password" type="password" placeholder="Mot de passe administrateur"><button id="loginBtn">Se connecter</button><div id="loginMsg"></div></section><div id="admin" class="hidden"><section class="card"><div class="top"><h1>Administration</h1><button id="logout">Déconnexion</button></div><div class="status" id="summary">Connexion au Worker…</div></section><section class="card"><h2>Programme habituel</h2><label>Rythme</label><select id="mode"><option value="thu">Jeudi — 21h30</option><option value="sun">Dimanche — 14h00</option></select><label>Nom du lieu habituel</label><input id="place"><p class="hint">Clique sur la carte ou déplace le repère.</p><div id="habitualMap" class="map"></div><div id="habitualCoords" class="status selected">En attente des données…</div><button id="saveHabitual">Enregistrer le programme habituel</button></section><section class="card"><h2>Modifier ce Balèti uniquement</h2><label>Date concernée</label><input id="eventDate" type="date"><label>Heure exceptionnelle</label><input id="eventTime" type="time"><label>Lieu exceptionnel</label><input id="eventPlace" placeholder="Laisser vide pour conserver le lieu habituel"><label>Lieu déjà utilisé</label><select id="savedLocation"><option value="">— Choisir sur la carte —</option></select><div id="eventMap" class="map"></div><div id="eventCoords" class="status selected">En attente des données…</div><label>Commentaire</label><textarea id="comment" rows="3"></textarea><label class="cancel-line"><input id="cancelled" type="checkbox"> Balèti annulé</label><button id="saveOverride">Enregistrer pour cette date</button><button id="clearOverride" class="secondary">Revenir au programme habituel</button></section><section class="card"><h2>Présentation Balèti Sauvage</h2><textarea id="presentation" rows="7"></textarea><button id="savePresentation">Enregistrer le texte</button></section><div class="status" id="msg"></div></div></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',CENTER=[43.6108225,3.8766489],$=id=>document.getElementById(id);let data=null,hm,em,hmark,emark,hp=[...CENTER],ep=[...CENTER];async function call(path,opt={}){const c=new AbortController(),timer=setTimeout(()=>c.abort(),8000);try{const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json'},signal:c.signal,...opt});const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error('Réponse Worker invalide — HTTP '+r.status+' — '+text.slice(0,300))};if(!r.ok){const parts=[j.error||('Erreur HTTP '+r.status)];if(j.detail)parts.push(j.detail);parts.push('HTTP '+r.status);throw new Error(parts.join(' — '))}return j}catch(e){if(e.name==='AbortError')throw new Error('Le Worker ne répond pas après 8 secondes. Recharge la page.');throw e}finally{clearTimeout(timer)}}function nextDate(mode){const n=new Date(),d=new Date(n),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(x===0&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function coords(p){return'Position choisie : '+p[0].toFixed(6)+', '+p[1].toFixed(6)}function setH(p){hp=[+p[0],+p[1]];$('habitualCoords').textContent=coords(hp)}function setE(p){ep=[+p[0],+p[1]];$('eventCoords').textContent=coords(ep)}function say(t,bad=false){$('msg').textContent=t;$('msg').classList.toggle('error',bad)}function mk(id,p,setter){const m=L.map(id,{minZoom:14,maxZoom:19}).setView(p,16);const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:0,maxZoom:19,tileSize:256,zoomOffset:0,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);tiles.on('tileerror',()=>say('Le fond OpenStreetMap ne se charge pas.',true));const k=L.marker(p,{draggable:true}).addTo(m),set=ll=>{k.setLatLng(ll);setter([ll.lat,ll.lng])};k.on('dragend',e=>set(e.target.getLatLng()));m.on('click',e=>set(e.latlng));return[m,k]}function ov(date){return(data?.overrides||[]).find(x=>x.event_date===date)}function loadOv(){if(!data)return;const o=ov($('eventDate').value);$('eventTime').value=o?.time||'';$('eventPlace').value=o?.place||'';$('comment').value=o?.comment||'';$('cancelled').checked=!!Number(o?.cancelled);setE(o?.lat!=null?[+o.lat,+o.lng]:[+data.settings.usualLat,+data.settings.usualLng]);emark?.setLatLng(ep);em?.setView(ep,16)}async function maps(s){try{if(!window.L)throw new Error('Leaflet ne s’est pas chargé.');if(!hm){[hm,hmark]=mk('habitualMap',hp,setH);[em,emark]=mk('eventMap',[+s.usualLat,+s.usualLng],setE)}else{hmark.setLatLng(hp);hm.setView(hp,16)}setTimeout(()=>{hm.invalidateSize();em.invalidateSize()},150)}catch(e){['habitualMap','eventMap'].forEach(id=>{$(id).classList.add('map-error');$(id).textContent=e.message});say(e.message,true)}}async function load(){try{$('summary').textContent='Connexion au Worker…';data=await call('/api/admin');const s=data.settings;$('mode').value=s.mode;$('place').value=s.usualPlace;$('presentation').value=s.baletiText||'';setH([+s.usualLat,+s.usualLng]);const d=nextDate(s.mode),date=iso(d),o=ov(date);$('eventDate').value=date;$('summary').innerHTML='<strong>PROCHAIN BALÈTI</strong><br>'+new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)+' — '+(o?.time||(s.mode==='sun'?'14h00':'21h30'))+' — '+(o?.place||s.usualPlace)+(Number(o?.cancelled)?'<br><strong>ANNULÉ</strong>':'');$('savedLocation').innerHTML='<option value="">— Choisir sur la carte —</option>'+(data.locations||[]).map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');loadOv();maps(s)}catch(e){$('summary').textContent='ERREUR : '+e.message;$('summary').classList.add('error');$('habitualCoords').textContent='Données non chargées';$('eventCoords').textContent='Données non chargées';say(e.message,true)}}async function show(){$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}$('loginBtn').onclick=async()=>{try{await call('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';show()}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=async()=>{try{await call('/api/logout',{method:'POST'})}finally{location.reload()}};$('eventDate').onchange=loadOv;$('savedLocation').onchange=()=>{const x=data?.locations?.[+$('savedLocation').value];if(x){$('eventPlace').value=x.name;setE([+x.lat,+x.lng]);emark?.setLatLng(ep);em?.setView(ep,16)}};$('saveHabitual').onclick=async()=>{try{await call('/api/habitual',{method:'POST',body:JSON.stringify({mode:$('mode').value,place:$('place').value,lat:hp[0],lng:hp[1]})});say('Programme habituel enregistré.');load()}catch(e){say(e.message,true)}};$('saveOverride').onclick=async()=>{try{const cp=$('eventPlace').value.trim()!=='';await call('/api/override',{method:'POST',body:JSON.stringify({date:$('eventDate').value,time:$('eventTime').value||null,place:cp?$('eventPlace').value.trim():null,lat:cp?ep[0]:null,lng:cp?ep[1]:null,comment:$('comment').value,cancelled:$('cancelled').checked})});say('Modification enregistrée.');load()}catch(e){say(e.message,true)}};$('clearOverride').onclick=async()=>{try{await call('/api/override/clear',{method:'POST',body:JSON.stringify({date:$('eventDate').value})});say('Retour au programme habituel.');load()}catch(e){say(e.message,true)}};$('savePresentation').onclick=async()=>{try{await call('/api/presentation',{method:'POST',body:JSON.stringify({text:$('presentation').value})});say('Présentation enregistrée.')}catch(e){say(e.message,true)}};(async()=>{try{const s=await call('/api/session');if(s.authenticated)show()}catch(e){$('loginMsg').textContent=e.message}})();</script></body></html>
