<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(760px,94vw);margin:30px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif;margin-top:0}input,textarea,select,button{width:100%;padding:11px;margin:5px 0 10px;border:2px solid #222;border-radius:9px;font-size:16px}button{font-weight:800;cursor:pointer;background:#17130d;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.status{padding:10px;border-radius:8px;background:#fff8e8;margin:8px 0}.danger{background:#a51e18}.secondary{background:#f6e6bd;color:#17130d}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top button{width:auto}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card" id="login"><h1>Administration</h1><p>Balèti Sauvage Montpellier</p><input id="password" type="password" placeholder="Mot de passe administrateur" autocomplete="current-password"><button id="loginBtn">Se connecter</button><div id="loginMsg"></div></section><div id="admin" class="hidden"><section class="card"><div class="top"><h1>Administration</h1><button id="logout">Déconnexion</button></div><div class="status" id="summary">Chargement…</div></section><section class="card"><h2>Programme habituel</h2><label>Rythme</label><select id="mode"><option value="thu">Jeudi — 21h30</option><option value="sun">Dimanche — 14h00</option></select><label>Nom du lieu</label><input id="place"><div class="row"><div><label>Latitude</label><input id="lat" type="number" step="0.000001"></div><div><label>Longitude</label><input id="lng" type="number" step="0.000001"></div></div><button id="saveHabitual">Enregistrer le programme habituel</button></section><section class="card"><h2>Modifier ce Balèti uniquement</h2><label>Date concernée</label><input id="eventDate" type="date"><label>Heure exceptionnelle</label><input id="eventTime" type="time"><label>Lieu exceptionnel</label><input id="eventPlace"><div class="row"><input id="eventLat" type="number" step="0.000001" placeholder="Latitude"><input id="eventLng" type="number" step="0.000001" placeholder="Longitude"></div><label>Commentaire</label><textarea id="comment" rows="3"></textarea><label><input id="cancelled" type="checkbox" style="width:auto"> Balèti annulé</label><button id="saveOverride">Enregistrer pour cette date</button><button id="clearOverride" class="secondary">Revenir au programme habituel</button></section><section class="card"><h2>Présentation Balèti Sauvage</h2><textarea id="presentation" rows="7"></textarea><button id="savePresentation">Enregistrer le texte</button></section><div class="status" id="msg"></div></div></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev';const $=id=>document.getElementById(id);const call=async(path,opt={})=>{const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');return j};function nextDate(mode){const n=new Date(),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30,d=new Date(n);d.setHours(h,m,0,0);let delta=(day-d.getDay()+7)%7;if(delta===0&&d<=n)delta=7;d.setDate(d.getDate()+delta);return d}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function say(t){$('msg').textContent=t}async function load(){const j=await call('/api/admin');const s=j.settings;$('mode').value=s.mode;$('place').value=s.usualPlace;$('lat').value=s.usualLat;$('lng').value=s.usualLng;$('presentation').value=s.baletiText||'';const d=nextDate(s.mode);$('eventDate').value=iso(d);$('summary').textContent='PROCHAIN BALÈTI : '+new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)+' — '+(s.mode==='sun'?'14h00':'21h30')+' — '+s.usualPlace}async function showAdmin(){ $('login').classList.add('hidden');$('admin').classList.remove('hidden');await load()}$('loginBtn').onclick=async()=>{try{await call('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});await showAdmin()}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=async()=>{await call('/api/logout',{method:'POST'});location.reload()};$('saveHabitual').onclick=async()=>{try{await call('/api/habitual',{method:'POST',body:JSON.stringify({mode:$('mode').value,place:$('place').value,lat:Number($('lat').value),lng:Number($('lng').value)})});say('Programme habituel enregistré.');await load()}catch(e){say(e.message)}};$('saveOverride').onclick=async()=>{try{await call('/api/override',{method:'POST',body:JSON.stringify({date:$('eventDate').value,time:$('eventTime').value||null,place:$('eventPlace').value||null,lat:$('eventLat').value===''?null:Number($('eventLat').value),lng:$('eventLng').value===''?null:Number($('eventLng').value),comment:$('comment').value,cancelled:$('cancelled').checked})});say('Modification de ce Balèti enregistrée.')}catch(e){say(e.message)}};$('clearOverride').onclick=async()=>{try{await call('/api/override/clear',{method:'POST',body:JSON.stringify({date:$('eventDate').value})});say('Retour au programme habituel pour cette date.')}catch(e){say(e.message)}};$('savePresentation').onclick=async()=>{try{await call('/api/presentation',{method:'POST',body:JSON.stringify({text:$('presentation').value})});say('Présentation enregistrée.')}catch(e){say(e.message)}};(async()=>{try{const s=await call('/api/session');if(s.authenticated)await showAdmin()}catch{}})();</script></body></html>
