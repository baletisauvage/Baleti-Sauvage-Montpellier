<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prochain Balèti — Administration</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{border-top:1px solid #17130d;padding:26px 0}h1,h2,h3{font-family:Georgia,serif;font-weight:500}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}input,textarea,select,button{width:100%;padding:12px 2px;margin:4px 0 16px;border:0;border-bottom:1px solid #17130d;background:transparent;color:#17130d;font-size:16px}button{width:auto;padding:10px 15px;border:1px solid #17130d;font-weight:800;cursor:pointer}.map{height:330px;border:1px solid #17130d;margin:16px 0}.status{padding:12px 0;border-bottom:1px solid #17130d}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}.next-menu{display:flex;gap:8px}.subpanel{display:none}.subpanel.active{display:block}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}return F(input,opt)}})();</script></head><body><main class="wrap"><a class="back" href="admin.html">← Retour à l’administration</a><section class="card"><h1>Prochain Balèti</h1><div class="next-menu"><button data-sub="habitual">Programme habituel</button><button data-sub="event">Modifier ce Balèti uniquement</button></div><div class="subpanel active" id="sub-habitual"><h3>Programme habituel</h3><select id="mode"><option value="thu">Jeudi — 21h30</option><option value="sun">Dimanche — 14h00</option></select><input id="place" placeholder="Nom du lieu habituel"><div id="habitualMap" class="map"></div><div id="habitualCoords" class="status"></div><button id="saveHabitual">Enregistrer le programme habituel</button></div><div class="subpanel" id="sub-event"><h3>Modifier ce Balèti uniquement</h3><input id="eventDate" type="date"><input id="eventTime" type="time"><input id="eventPlace" placeholder="Lieu exceptionnel"><div id="eventMap" class="map"></div><div id="eventCoords" class="status"></div><textarea id="comment" rows="3" placeholder="Commentaire"></textarea><label class="check"><input id="cancelled" type="checkbox"> Balèti annulé</label><button id="saveOverride">Enregistrer pour cette date</button><button id="clearOverride">Revenir au programme habituel</button></div><div id="msg" class="status"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',CENTER=[43.6108225,3.8766489],$=id=>document.getElementById(id);let data,hm,em,hmark,emark,hp=[...CENTER],ep=[...CENTER];async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok)throw Error(j.error||j.detail||('HTTP '+r.status));return j}const post=(p,b)=>call(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});function pos(p){let a=Number(p?.[0]),b=Number(p?.[1]);return Number.isFinite(a)&&Number.isFinite(b)&&!(a===0&&b===0)?[a,b]:[...CENTER]}function setH(p){hp=pos(p);$('habitualCoords').textContent='Position : '+hp.map(x=>x.toFixed(6)).join(', ')}function setE(p){ep=pos(p);$('eventCoords').textContent='Position : '+ep.map(x=>x.toFixed(6)).join(', ')}function mk(id,p,setter){let m=L.map(id).setView(p,16);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);let k=L.marker(p,{draggable:true}).addTo(m);function s(ll){k.setLatLng(ll);setter([ll.lat,ll.lng])}k.on('dragend',e=>s(e.target.getLatLng()));m.on('click',e=>s(e.latlng));return[m,k]}function maps(){if(!hm){[hm,hmark]=mk('habitualMap',hp,setH);[em,emark]=mk('eventMap',ep,setE)}setTimeout(()=>{hm.invalidateSize();em.invalidateSize()},80)}function nextDate(mode){let n=new Date(),d=new Date(n),day=mode==='sun'?0:4;d.setHours(mode==='sun'?14:21,mode==='sun'?0:30,0,0);let x=(day-d.getDay()+7)%7;if(!x&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function ov(date){return(data?.overrides||[]).find(x=>x.event_date===date)}function loadOv(){let o=ov($('eventDate').value),s=data.settings;$('eventTime').value=o?.time||'';$('eventPlace').value=o?.place||'';$('comment').value=o?.comment||'';$('cancelled').checked=!!Number(o?.cancelled);setE(o?.lat!=null?[o.lat,o.lng]:[s.usualLat,s.usualLng]);emark?.setLatLng(ep)}async function load(){data=await call('/api/admin');let s=data.settings;$('mode').value=s.mode;$('place').value=s.usualPlace;setH([s.usualLat,s.usualLng]);$('eventDate').value=iso(nextDate(s.mode));loadOv();maps()}document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subpanel').forEach(x=>x.classList.remove('active'));$('sub-'+b.dataset.sub).classList.add('active');maps()});$('saveHabitual').onclick=async()=>{try{await post('/api/habitual',{mode:$('mode').value,place:$('place').value,lat:hp[0],lng:hp[1]});await load();$('msg').textContent='Programme habituel enregistré.'}catch(e){$('msg').textContent=e.message}};$('saveOverride').onclick=async()=>{try{await post('/api/override',{date:$('eventDate').value,time:$('eventTime').value||null,place:$('eventPlace').value||null,lat:ep[0],lng:ep[1],comment:$('comment').value,cancelled:$('cancelled').checked});await load();$('msg').textContent='Ce Balèti a été modifié.'}catch(e){$('msg').textContent=e.message}};$('clearOverride').onclick=async()=>{try{await post('/api/override/clear',{date:$('eventDate').value});await load();$('msg').textContent='Programme habituel rétabli.'}catch(e){$('msg').textContent=e.message}};$('eventDate').onchange=loadOv;load().catch(e=>$('msg').textContent=e.message);</script></body></html>
