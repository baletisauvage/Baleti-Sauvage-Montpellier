<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidéos — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}h2{font-size:27px;margin-top:30px}label{display:block;font-size:14px;margin-top:12px}input,button{width:100%;padding:10px 2px;margin:3px 0 10px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.danger{border-color:#8b1d14;color:#8b1d14}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:auto;margin:0}.item{padding:18px 0;margin:0;border:0;border-top:1px solid #17130d;background:transparent}.item>strong{font-family:Georgia,serif;font-size:18px}.actions{display:flex;gap:8px}.status{padding:12px 0;border-bottom:1px solid #17130d;margin-top:18px;font-size:13px}.error{color:#8b1d14}a{color:inherit}main>.card>p:first-child a{display:block;width:max-content;padding-bottom:5px;border-bottom:1px solid #17130d;text-decoration:none;font-size:13px;font-weight:800}.video-menu{display:flex;gap:8px;margin:22px 0}.video-menu button{margin:0}.video-menu button.active{background:#17130d;color:#f4f0e7}.video-panel{display:none}.video-panel.active{display:block}@media(max-width:600px){.wrap{width:90vw;margin-top:24px}.actions{flex-wrap:wrap}h1{font-size:34px}}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}const r=await F(input,opt);if(u.includes("/api/login")&&r.ok){try{const j=await r.clone().json();if(j.token)localStorage.setItem(K,j.token)}catch{}}if(u.includes("/api/logout")&&r.ok)localStorage.removeItem(K);return r}})();</script></head><body><main class="wrap"><section class="card"><p><a href="admin.html">← Administration principale</a></p><h1>Vidéos</h1><div class="video-menu"><button type="button" data-view="add">Ajouter une vidéo</button><button type="button" data-view="gallery">Galerie</button></div><div class="video-panel" id="panel-add"><h2 id="ajouter">Ajouter une vidéo YouTube</h2><label>Titre</label><input id="title" maxlength="120"><label>Lien YouTube</label><input id="url" type="url" maxlength="500" placeholder="https://…"><label>Date</label><input id="date" type="date"><label>Événement / Balèti</label><input id="event" maxlength="120"><label class="check"><input id="visible" type="checkbox" checked> Visible</label><label class="check"><input id="main" type="checkbox"> Vidéo principale</label><button id="add">Ajouter</button></div><div class="video-panel" id="panel-gallery"><h2 id="archives">Galerie</h2><div id="list">Chargement…</div></div><div id="msg" class="status"></div></section></main><script>function view(name){document.querySelectorAll('.video-panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+name));document.querySelectorAll('.video-menu button').forEach(x=>x.classList.toggle('active',x.dataset.view===name));if(name==='gallery'&&typeof load==='function')load()}document.querySelectorAll('.video-menu button').forEach(b=>b.onclick=()=>view(b.dataset.view));view(location.hash==='#archives'?'gallery':'add');const API='https://baleti-sauvage.baletisauvage.workers.dev',$=x=>document.getElementById(x);let videos=[];async function call(p,b){const r=await fetch(API+p,{method:b?'POST':'GET',credentials:'include',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):null}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok)throw Error(j.error||j.detail||('HTTP '+r.status));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s,b=false){$('msg').textContent=s;$('msg').classList.toggle('error',b)}function render(){if(!videos.length){$('list').innerHTML='<p>Aucune vidéo publiée.</p>';return}$('list').innerHTML=videos.map((v,i)=>`<div class="item"><strong>${v.principale?'★ ':''}${esc(v.titre)}</strong><p><a target="_blank" rel="noopener noreferrer" href="${esc(v.url)}">${v.fichier?'Voir la vidéo':'Voir sur YouTube'}</a>${v.fichier?' · <a href="'+esc(v.url)+'" download="'+esc(v.fichier)+'">Télécharger</a>':''}</p><label>Titre</label><input maxlength="120" data-i="${i}" data-k="titre" value="${esc(v.titre)}"><label>Date</label><input data-i="${i}" data-k="dateVideo" type="date" value="${esc(v.dateVideo)}"><label>Événement / Balèti</label><input maxlength="120" data-i="${i}" data-k="evenement" value="${esc(v.evenement)}"><label class="check"><input data-i="${i}" data-k="visible" type="checkbox" ${v.visible?'checked':''}> Visible</label><label class="check"><input data-i="${i}" data-k="principale" type="checkbox" ${v.principale?'checked':''}> Vidéo principale</label><div class="actions"><button data-save="${i}">Enregistrer</button><button class="danger" data-del="${i}">Supprimer</button></div></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>videos[+e.dataset.i][e.dataset.k]=e.type==='checkbox'?e.checked:e.value);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{const r=await call('/api/videos/update',videos[+b.dataset.save]);videos=r.videos||[];render();say('Vidéo enregistrée.')}catch(e){say(e.message,true)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer cette vidéo ?'))return;try{const v=videos[+b.dataset.del];const r=await call('/api/videos/delete',v.fichier?{fichier:v.fichier}:{youtubeId:v.youtubeId});videos=r.videos||[];render();say('Vidéo supprimée.')}catch(e){say(e.message,true)}})}async function load(){try{const s=await call('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await call('/api/admin');videos=d.videos||[];render();say('Vidéos chargées.')}catch(e){say(e.message,true)}}$('add').onclick=async()=>{try{const r=await call('/api/videos/add',{titre:$('title').value,url:$('url').value,dateVideo:$('date').value,evenement:$('event').value,visible:$('visible').checked,principale:$('main').checked});videos=r.videos||[];['title','url','date','event'].forEach(x=>$(x).value='');$('visible').checked=true;$('main').checked=false;render();say('Vidéo ajoutée.')}catch(e){say(e.message,true)}};load();</script><script>
/* Publications provenant des messages : liste persistante et édition identique. */
(function(){
 const api='https://baleti-sauvage.baletisauvage.workers.dev',kind='video';
 const list=document.getElementById('list');if(!list)return;
 const panel=list.parentElement;
 const container=document.createElement('div');container.className='published-media-list';container.style.cssText='margin-top:16px';
 panel.append(container);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function downloadPublished(item,button){const old=button.textContent;button.disabled=true;button.textContent='Téléchargement…';try{const url=api+'/api/published/file?id='+encodeURIComponent(item.id);const response=await fetch(url,{credentials:'include'});if(!response.ok)throw Error('Fichier indisponible ('+response.status+')');const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=(item.original_name||'piece-jointe').replace(/[\\/]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),60000)}catch(err){alert('Téléchargement impossible : '+err.message)}finally{button.disabled=false;button.textContent=old}}
 async function call(path,options={}){const r=await fetch(api+path,{credentials:'include',...options});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Erreur serveur');return d}
 function field(form,label,value,type='text'){const wrap=document.createElement('label');wrap.textContent=label+' ';const input=document.createElement('input');input.type=type;if(type==='checkbox')input.checked=!!value;else input.value=value||'';wrap.append(input);form.append(wrap);return input}
 async function refresh(){
  try{
   const data=await call('/api/published/admin');container.replaceChildren();
   for(const item of (data.items||[]).filter(x=>x.kind===kind)){
    const card=document.createElement('article');card.className='item published-media-card';card.style.cssText='margin:12px 0;padding:16px;border:1px solid #aaa5;border-radius:8px';
    const url=api+'/api/published/file?id='+encodeURIComponent(item.id);
    const title=document.createElement('strong');title.textContent=item.title||item.original_name||'Sans titre';card.append(title);
    const video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=url;video.style.cssText='display:block;width:100%;max-width:460px;max-height:260px;margin:12px 0';card.append(video);
    const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Voir / télécharger';card.append(link);const download=document.createElement('button');download.type='button';download.textContent='Télécharger le fichier';download.style.marginLeft='12px';download.onclick=()=>downloadPublished(item,download);card.append(download);
    const form=document.createElement('form');form.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:12px';
    const titleInput=field(form,'Titre',item.title||item.original_name||'');titleInput.maxLength=120;
    const dateInput=field(form,'Date',item.date_media||'','date');const creditInput=field(form,'Crédit / auteur',item.credit||'');creditInput.maxLength=160;
    const visibleInput=field(form,'Visible',Number(item.visible)!==0,'checkbox');
    const mainInput=field(form,'Vidéo principale',Number(item.principale)===1,'checkbox');
    const actions=document.createElement('div');actions.className='actions';const save=document.createElement('button');save.type='submit';save.textContent='Enregistrer';actions.append(save);
    const remove=document.createElement('button');remove.type='button';remove.textContent='Supprimer';remove.className='delete';actions.append(remove);form.append(actions);card.append(form);container.append(card);
    form.onsubmit=async e=>{e.preventDefault();if(!titleInput.value.trim()){alert('Titre obligatoire');return}save.disabled=true;try{await call('/api/published/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,title:titleInput.value.trim(),visible:visibleInput.checked,date_media:dateInput.value,credit:creditInput.value,principale:mainInput.checked})});await refresh()}catch(err){alert(err.message);save.disabled=false}};
    remove.onclick=async()=>{if(!confirm('Supprimer définitivement cette publication ?'))return;remove.disabled=true;try{await call('/api/published/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})});await refresh()}catch(err){alert(err.message);remove.disabled=false}};
   }
  }catch(e){container.textContent='Impossible de charger les publications : '+e.message}
 }
 refresh();
})();
</script></body></html>
