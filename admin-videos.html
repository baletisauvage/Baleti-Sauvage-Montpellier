<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidéos — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}h2{font-size:27px;margin-top:30px}label{display:block;font-size:14px;margin-top:12px}input,button{width:100%;padding:10px 2px;margin:3px 0 10px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.danger{border-color:#8b1d14;color:#8b1d14}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:auto;margin:0}.item{padding:18px 0;margin:0;border:0;border-top:1px solid #17130d;background:transparent}.item>strong{font-family:Georgia,serif;font-size:18px}.actions{display:flex;gap:8px}.status{padding:12px 0;border-bottom:1px solid #17130d;margin-top:18px;font-size:13px}.error{color:#8b1d14}a{color:inherit}main>.card>p:first-child a{display:block;width:max-content;padding-bottom:5px;border-bottom:1px solid #17130d;text-decoration:none;font-size:13px;font-weight:800}@media(max-width:600px){.wrap{width:90vw;margin-top:24px}.actions{flex-wrap:wrap}h1{font-size:34px}}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}const r=await F(input,opt);if(u.includes("/api/login")&&r.ok){try{const j=await r.clone().json();if(j.token)localStorage.setItem(K,j.token)}catch{}}if(u.includes("/api/logout")&&r.ok)localStorage.removeItem(K);return r}})();</script></head><body><main class="wrap"><section class="card"><p><a href="admin.html">← Administration principale</a></p><h1>Vidéos</h1><h2 id="ajouter">Ajouter une vidéo YouTube</h2><label>Titre</label><input id="title" maxlength="120"><label>Lien YouTube</label><input id="url" type="url" maxlength="500" placeholder="https://…"><label>Date</label><input id="date" type="date"><label>Événement / Balèti</label><input id="event" maxlength="120"><label class="check"><input id="visible" type="checkbox" checked> Visible</label><label class="check"><input id="main" type="checkbox"> Vidéo principale</label><button id="add">Ajouter</button><h2 id="archives">Archives vidéos</h2><div id="list">Chargement…</div><div id="msg" class="status"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',$=x=>document.getElementById(x);let videos=[];async function call(p,b){const r=await fetch(API+p,{method:b?'POST':'GET',credentials:'include',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):null}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok)throw Error(j.error||j.detail||('HTTP '+r.status));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s,b=false){$('msg').textContent=s;$('msg').classList.toggle('error',b)}function render(){if(!videos.length){$('list').innerHTML='<p>Aucune vidéo publiée.</p>';return}$('list').innerHTML=videos.map((v,i)=>`<div class="item"><strong>${v.principale?'★ ':''}${esc(v.titre)}</strong><p><a target="_blank" rel="noopener noreferrer" href="${esc(v.url)}">Voir sur YouTube</a></p><label>Titre</label><input maxlength="120" data-i="${i}" data-k="titre" value="${esc(v.titre)}"><label>Date</label><input data-i="${i}" data-k="dateVideo" type="date" value="${esc(v.dateVideo)}"><label>Événement / Balèti</label><input maxlength="120" data-i="${i}" data-k="evenement" value="${esc(v.evenement)}"><label class="check"><input data-i="${i}" data-k="visible" type="checkbox" ${v.visible?'checked':''}> Visible</label><label class="check"><input data-i="${i}" data-k="principale" type="checkbox" ${v.principale?'checked':''}> Vidéo principale</label><div class="actions"><button data-save="${i}">Enregistrer</button><button class="danger" data-del="${i}">Supprimer</button></div></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>videos[+e.dataset.i][e.dataset.k]=e.type==='checkbox'?e.checked:e.value);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{const r=await call('/api/videos/update',videos[+b.dataset.save]);videos=r.videos||[];render();say('Vidéo enregistrée.')}catch(e){say(e.message,true)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer cette vidéo ?'))return;try{const r=await call('/api/videos/delete',{youtubeId:videos[+b.dataset.del].youtubeId});videos=r.videos||[];render();say('Vidéo supprimée.')}catch(e){say(e.message,true)}})}async function load(){try{const s=await call('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await call('/api/admin');videos=d.videos||[];render();say('Vidéos chargées.')}catch(e){say(e.message,true)}}$('add').onclick=async()=>{try{const r=await call('/api/videos/add',{titre:$('title').value,url:$('url').value,dateVideo:$('date').value,evenement:$('event').value,visible:$('visible').checked,principale:$('main').checked});videos=r.videos||[];['title','url','date','event'].forEach(x=>$(x).value='');$('visible').checked=true;$('main').checked=false;render();say('Vidéo ajoutée.')}catch(e){say(e.message,true)}};load();</script></body></html>
