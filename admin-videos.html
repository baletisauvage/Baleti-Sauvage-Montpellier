<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidéos — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#17130d;font-family:Arial;color:#17130d}.wrap{width:min(800px,94vw);margin:30px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif}input,button{width:100%;padding:11px;margin:5px 0 10px;border:2px solid #222;border-radius:9px;font-size:16px}button{background:#17130d;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#fff8e8;color:#17130d}.danger{background:#7e1812}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:auto;margin:0}.item{padding:14px;margin:12px 0;border:2px solid #222;border-radius:12px;background:#fff8e8}.actions{display:flex;gap:8px}.status{padding:12px;background:#fff8e8;border-radius:9px}.error{background:#ffd9d5}.hidden{display:none}a{color:inherit}</style></head><body><main class="wrap"><section class="card"><p><a href="admin.html">← Administration principale</a></p><h1>Vidéos</h1><div id="login"><input id="password" type="password" placeholder="Mot de passe administrateur"><button id="loginBtn">Se connecter</button></div><div id="content" class="hidden"><h2>Ajouter une vidéo YouTube</h2><label>Titre</label><input id="title" maxlength="120"><label>Lien YouTube</label><input id="url" type="url" maxlength="500"><label>Date</label><input id="date" type="date"><label>Événement / Balèti</label><input id="event" maxlength="120"><label class="check"><input id="visible" type="checkbox" checked> Visible</label><label class="check"><input id="main" type="checkbox"> Vidéo principale</label><button id="add">Ajouter</button><h2>Archives vidéos</h2><div id="list"></div></div><div id="msg" class="status"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',$=x=>document.getElementById(x);let videos=[];async function call(p,b){const r=await fetch(API+p,{method:b?'POST':'GET',credentials:'include',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):null}),j=await r.json();if(!r.ok)throw Error([j.error,j.detail].filter(Boolean).join(' — '));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s,b=false){$('msg').textContent=s;$('msg').classList.toggle('error',b)}function render(){if(!videos.length){$('list').innerHTML='<p>Aucune vidéo publiée.</p>';return}$('list').innerHTML=videos.map((v,i)=>`<div class="item"><strong>${v.principale?'★ ':''}${esc(v.titre)}</strong><p><a target="_blank" rel="noopener" href="${esc(v.url)}">Voir sur YouTube</a></p><label>Titre</label><input data-i="${i}" data-k="titre" value="${esc(v.titre)}"><label>Date</label><input data-i="${i}" data-k="dateVideo" type="date" value="${esc(v.dateVideo)}"><label>Événement / Balèti</label><input data-i="${i}" data-k="evenement" value="${esc(v.evenement)}"><label class="check"><input data-i="${i}" data-k="visible" type="checkbox" ${v.visible?'checked':''}> Visible</label><label class="check"><input data-i="${i}" data-k="principale" type="checkbox" ${v.principale?'checked':''}> Vidéo principale</label><div class="actions"><button data-save="${i}">Enregistrer</button><button class="danger" data-del="${i}">Supprimer</button></div></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>videos[+e.dataset.i][e.dataset.k]=e.type==='checkbox'?e.checked:e.value);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{const r=await call('/api/videos/update',videos[+b.dataset.save]);videos=r.videos;render();say('Vidéo enregistrée.')}catch(e){say(e.message,true)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer cette vidéo ?'))return;try{const r=await call('/api/videos/delete',{youtubeId:videos[+b.dataset.del].youtubeId});videos=r.videos;render();say('Vidéo supprimée.')}catch(e){say(e.message,true)}})}async function load(){try{const d=await call('/api/admin');videos=d.videos||[];$('login').classList.add('hidden');$('content').classList.remove('hidden');render();say('Vidéos chargées.')}catch(e){say(e.message,true)}}$('loginBtn').onclick=async()=>{try{await call('/api/login',{password:$('password').value});load()}catch(e){say(e.message,true)}};$('add').onclick=async()=>{try{const r=await call('/api/videos/add',{titre:$('title').value,url:$('url').value,dateVideo:$('date').value,evenement:$('event').value,visible:$('visible').checked,principale:$('main').checked});videos=r.videos;['title','url','date','event'].forEach(x=>$(x).value='');$('visible').checked=true;$('main').checked=false;render();say('Vidéo ajoutée.')}catch(e){say(e.message,true)}};(async()=>{try{if((await call('/api/session')).authenticated)load()}catch{}})();</script></body></html>
