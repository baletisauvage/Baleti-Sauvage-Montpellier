<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.panel{width:min(620px,94vw);padding:26px;border:4px solid #17130d;border-radius:24px;background:#f5e5bd}h1{font-family:Georgia,serif}label{display:block;font-weight:700;margin-top:12px}input,textarea,button{width:100%;padding:12px;margin-top:6px;border:2px solid #222;border-radius:9px;font:16px Arial}button{background:#17130d;color:#fff;font-weight:800;cursor:pointer}.back{display:inline-block;color:#17130d;margin-bottom:8px}.trap{position:absolute;left:-9999px}.status{margin-top:12px;padding:10px;border-radius:8px}.ok{background:#dff2d8}.err{background:#ffd9d5}</style></head><body><section class="panel"><a class="back" href="index.html">← Retour</a><h1>Laisser un message au Balèti Sauvage</h1><p>Un petit mot ? Écrivez-nous ici.</p><form id="form"><label>Prénom<input name="prenom" maxlength="60" autocomplete="given-name" required></label><label>E-mail ou téléphone <span style="font-weight:400;opacity:.65">(facultatif)</span><input name="contact" maxlength="254" placeholder="Pour vous répondre si vous le souhaitez"></label><label>Message<textarea name="message" maxlength="1200" rows="6" required></textarea></label><label class="trap" aria-hidden="true">Site<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">Envoyer le message</button><div id="status" class="status" role="status"></div></form></section><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',form=document.getElementById('form'),status=document.getElementById('status');form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button'),fd=new FormData(form),data=Object.fromEntries(fd.entries());status.className='status';status.textContent='Envoi…';b.disabled=true;try{const r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||'Envoi impossible.');form.reset();status.className='status ok';status.textContent='Merci, votre message a bien été envoyé.'}catch(err){status.className='status err';status.textContent=err.message||'Le message n’a pas pu être envoyé.'}finally{b.disabled=false}};</script></body></html>
