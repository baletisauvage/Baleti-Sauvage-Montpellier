<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balèti Sauvage — Administration</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{border-top:1px solid #17130d;padding:26px 0}h1,h2,h3{font-family:Georgia,serif;font-weight:500}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}input,textarea,select,button{width:100%;padding:12px 2px;margin:4px 0 16px;border:0;border-bottom:1px solid #17130d;background:transparent;color:#17130d;font-size:16px}button{width:auto;padding:10px 15px;border:1px solid #17130d;font-weight:800;cursor:pointer}.map{height:330px;border:1px solid #17130d;margin:16px 0}.status{padding:12px 0;border-bottom:1px solid #17130d}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}.next-menu{display:flex;gap:8px}.subpanel{display:none}.subpanel.active{display:block}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}return F(input,opt)}})();</script></head><body><main class="wrap"><a class="back" href="admin.html">← Retour à l’administration</a><section class="card"><h1>Balèti Sauvage</h1><h2>Présentation</h2><textarea id="presentation" rows="10"></textarea><button id="save">Enregistrer le texte</button><div id="msg" class="status"></div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',$=id=>document.getElementById(id);async function call(p,o={}){const r=await fetch(API+p,{credentials:'include',...o}),j=await r.json();if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok)throw Error(j.error||'Erreur');return j}call('/api/admin').then(d=>$('presentation').value=d.settings?.baletiText||'').catch(e=>$('msg').textContent=e.message);$('save').onclick=()=>call('/api/presentation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('presentation').value})}).then(()=>$('msg').textContent='Présentation enregistrée.').catch(e=>$('msg').textContent=e.message);</script></body></html>
