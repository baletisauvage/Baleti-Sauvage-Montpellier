<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Suivre</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2,h3{font-family:Georgia,serif;margin-top:0}h1{font-size:clamp(30px,5vw,48px);font-weight:500;letter-spacing:-.02em;margin-bottom:8px}h2{font-size:27px;font-weight:500;margin-bottom:22px}h3{font-size:20px;font-weight:500}input,textarea,select,button{width:100%;padding:12px 2px;margin:4px 0 16px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:16px}input:focus,textarea:focus,select:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:10px 15px;border:1px solid #17130d;font-weight:800;cursor:pointer}.hidden{display:none!important}.status{padding:16px 0;border-radius:0;background:transparent;margin:8px 0;line-height:1.55;border-bottom:1px solid #17130d}.secondary{background:transparent;color:#17130d}.map{height:330px;border:1px solid #17130d;border-radius:0;margin:16px 0;overflow:hidden;background:#ddd}.hint{font-size:13px;opacity:.65;line-height:1.5}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.top button{width:auto;margin-top:3px}.check{display:flex;gap:8px;align-items:center;margin:8px 0 18px}.check input{width:auto;margin:0}.error{color:#9b2118;border-color:#9b2118}.admin-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:28px;border-top:1px solid #17130d}.admin-menu button{width:100%;min-height:50px;margin:0;padding:14px 8px;border:0;border-bottom:1px solid #17130d;text-align:left;text-transform:uppercase;font-size:13px;background:transparent;color:#17130d}.admin-menu button:hover,.admin-menu button.active{background:#17130d;color:#f4f0e7}.next-menu{display:flex;gap:8px;margin:0 0 28px}.next-menu button{margin:0;border:1px solid #17130d;background:transparent;color:#17130d}.next-menu button.active{background:#17130d;color:#f4f0e7}.section{display:none}.section.active{display:block}.subpanel{display:none;margin-top:16px}.subpanel.active{display:block}.action-menu{display:flex;gap:8px;margin-top:16px}.action-menu a{display:inline-block;padding:10px 15px;border:1px solid #17130d;background:transparent;color:#17130d;text-decoration:none;font-size:13px;font-weight:800;text-transform:uppercase}.action-menu a:hover{background:#17130d;color:#f4f0e7}.public-return{display:block;width:max-content;max-width:100%;margin:0 0 34px;padding:0 0 5px;border:0;border-bottom:1px solid #17130d;background:transparent;color:#17130d;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.06em}.storage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid #17130d}.storage-box{padding:18px;min-width:0;border:0;border-bottom:1px solid #17130d;background:transparent;min-height:155px}.storage-box:nth-child(even){border-left:1px solid #17130d}.storage-box strong.title{display:block;font-family:Georgia,serif;font-size:1.05rem;margin-bottom:14px}.storage-line,.storage-total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px;line-height:1.8}.storage-line strong,.storage-total span{float:none;text-align:right;overflow-wrap:anywhere}.storage-total{margin-top:8px;padding-top:8px;border-top:1px solid #0002;font-size:13px;font-weight:800}.storage-box small{display:block;margin-top:10px;line-height:1.45;opacity:.6;font-size:11px}#login{max-width:520px;margin:12vh auto 0;border-top:2px solid #17130d}#login p{margin-bottom:30px}#loginBtn{margin-top:10px;background:#17130d;color:#f4f0e7}#summary strong{font-family:Georgia,serif;font-size:18px;font-weight:500}#logout{font-size:13px}#msg:empty{display:none}@media(max-width:700px){.wrap{width:90vw;margin-top:24px}.admin-menu{grid-template-columns:repeat(2,1fr)}.storage-grid{grid-template-columns:1fr}.storage-box,.storage-box:nth-child(even){padding:16px 0;border-left:0;min-height:0}.next-menu{display:grid;grid-template-columns:1fr}.map{height:280px}.top{align-items:center}h1{font-size:34px}}.admin-subpage{display:block;width:100%;min-height:70vh;border:0;background:transparent}\n.admin-home.hidden-view{display:none}.section.page-open{display:block}.section.page-open .public-return{cursor:pointer}</style></head><body><main class="wrap"><section class="card"><a class="public-return" href="admin.html">← Retour à l’administration</a><h2>Suivre</h2><p class="hint">Cette rubrique reste réservée pour plus tard.</p></section></main></body></html>
