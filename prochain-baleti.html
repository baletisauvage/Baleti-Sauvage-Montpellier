(async()=>{const $=id=>document.getElementById(id);try{const r=await fetch('https://baleti-sauvage.baletisauvage.workers.dev/api/public',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json();if(!j.ok)throw Error();const s=j.settings||{};const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=k=>Number(parts.find(p=>p.type===k).value);const target=s.mode==='sun'?0:4;const d=new Date(Date.UTC(v('year'),v('month')-1,v('day')+2));d.setUTCDate(d.getUTCDate()-(d.getUTCDay()-target+7)%7);const date=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');const o=(j.overrides||[]).find(x=>x.event_date===date)||{};const cancelled=o.cancelled===true||Number(o.cancelled)===1;const time=String(o.time||(s.mode==='sun'?'14:00':'21:30')).slice(0,5);const place=o.place||s.usualPlace||'Lieu à confirmer';$('status').textContent=cancelled?'Balèti annulé':'Le prochain rendez-vous';$('date').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(d);$('time').textContent='Horaire : '+time.replace(':',' h ');$('place').textContent='Lieu : '+place;$('comment').textContent=o.comment||'';const json={'@context':'https://schema.org','@type':'Event',name:'Balèti Sauvage Montpellier',startDate:date+'T'+time+':00+02:00',eventStatus:cancelled?'https://schema.org/EventCancelled':'https://schema.org/EventScheduled',eventAttendanceMode:'https://schema.org/OfflineEventAttendanceMode',location:{'@type':'Place',name:place,address:{'@type':'PostalAddress',addressLocality:'Montpellier',addressCountry:'FR'}},organizer:{'@type':'Organization',name:'Balèti Sauvage Montpellier',url:'https://baletisauvage.github.io/'},url:location.href};const el=document.createElement('script');el.type='application/ld+json';el.textContent=JSON.stringify(json);document.head.append(el)}catch(e){$('status').textContent='Informations momentanément indisponibles. Consultez la page d’accueil.'}})();
</script></body></html>
