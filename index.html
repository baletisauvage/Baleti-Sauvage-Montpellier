*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#080808;font-family:Impact,"Arial Black",system-ui,sans-serif}button,input,textarea{font:inherit}.scene{position:fixed;inset:0 0 60px;background:#f7f5ed;overflow:hidden}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background:repeating-radial-gradient(circle at 30% 20%,#000 0 1px,transparent 1px 5px);mix-blend-mode:multiply}.scene svg{width:100%;height:100%;display:block}.ink{fill:#080808}.paper{fill:#f7f5ed}.stroke{stroke:#080808;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:3}.title{font:900 58px Impact,"Arial Black",sans-serif;letter-spacing:4px}.ppl{transform-box:fill-box;transform-origin:center bottom;animation:sway var(--d,2.1s) ease-in-out infinite alternate}.ppl:nth-of-type(2n){--d:2.7s}.ppl:nth-of-type(3n){--d:1.65s}.arm{transform-box:fill-box;transform-origin:50% 5%;animation:arm 1.7s ease-in-out infinite alternate}.accordion{animation:squeeze 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.skirt{animation:skirt 1.9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}.nav{cursor:pointer;outline:none}.nav .board{transition:.18s;transform-box:fill-box;transform-origin:center}.nav:hover .board,.nav:focus .board{transform:translateY(-12px) rotate(-2deg) scale(1.12);fill:#080808}.nav:hover .label,.nav:focus .label{fill:#fff}.nav:hover .ppl{animation-play-state:paused}.label{font:900 24px Impact,"Arial Black",sans-serif;pointer-events:none}.small{font-size:18px}@keyframes sway{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(-5px)}}@keyframes arm{to{transform:rotate(13deg)}}@keyframes squeeze{to{transform:scaleX(.72)}}@keyframes skirt{to{transform:skewX(-5deg) rotate(3deg)}}.next{position:fixed;z-index:80;left:0;right:0;bottom:0;height:60px;border:5px solid #080808;border-left:0;border-right:0;background:#fff;display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 58px 4px 12px;cursor:pointer;font-size:clamp(14px,2vw,24px)}.dot{width:17px;height:17px;border-radius:50%;background:#080808;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(.45);opacity:.35}}.place{max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:system-ui,sans-serif;font-weight:900}.admin{position:fixed;z-index:90;right:11px;bottom:10px;width:39px;height:39px;border:3px solid #080808;background:#fff;color:#080808;text-decoration:none;display:grid;place-items:center;transform:rotate(2deg)}.modal{position:fixed;z-index:70;inset:0 0 60px;background:rgba(247,245,237,.97);display:none;overflow:auto;padding:clamp(18px,4vw,60px)}.modal.open{display:block}.close{position:fixed;z-index:75;right:18px;top:14px;width:50px;height:50px;border:4px solid;background:#fff;font-size:28px;cursor:pointer}.panel{max-width:1100px;margin:auto}.panel h2{font-size:clamp(45px,9vw,110px);line-height:.85;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{border:5px solid;background:#fff;padding:9px;box-shadow:8px 8px #080808}.card img{width:100%;height:240px;object-fit:cover;display:block;filter:grayscale(1) contrast(1.25)}.links{display:flex;flex-wrap:wrap;gap:15px}.links a,.action{border:5px solid;background:#fff;color:#080808;text-decoration:none;padding:14px 18px;font-size:clamp(20px,3vw,36px);box-shadow:7px 7px #080808}.map{height:min(70vh,650px);border:6px solid;filter:grayscale(1) contrast(1.2)}.form{display:grid;gap:13px;max-width:700px}.form input,.form textarea{border:5px solid;padding:13px;background:#fff;font-family:system-ui,sans-serif;font-weight:800}.form textarea{min-height:160px}.form button{border:5px solid;background:#080808;color:#fff;padding:13px}.event{border:6px solid;background:#fff;padding:25px;box-shadow:10px 10px #080808;font-size:clamp(22px,4vw,50px)}.event small{display:block;font:800 .4em system-ui,sans-serif;margin-top:14px}.empty{font-size:70px}.leaflet-control-attribution{font-size:9px!important}@media(max-width:720px){.scene{inset:0 0 54px}.next{height:54px;justify-content:flex-start;gap:8px;font-size:12px}.place{display:none}.admin{width:35px;height:35px}.modal{inset:0 0 54px}.title{font-size:44px}.nav .label{font-size:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<button class="next" id="next"><span class="dot"></span><b>BALÈTI</b><span id="nextDate">—</span><span id="nextTime">—</span><span>⌖</span><span class="place" id="nextPlace"></span></button><a class="admin" href="admin.html" aria-label="Administration">⚙</a>
<div id="modal" class="modal"><button class="close" id="close">×</button><div class="panel"><h2 id="heading"></h2><div id="content"></div></div></div>
<script>
const API='https://baleti-sauvage.baletisauvage.workers.dev';let pub={},map;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function habitualDate(mode){let d=new Date(),target=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30,add=(target-d.getDay()+7)%7;if(add===0&&(d.getHours()>h||(d.getHours()===h&&d.getMinutes()>=m)))add=7;d.setDate(d.getDate()+add);d.setHours(h,m,0,0);return d}
function key(d){return d.toISOString().slice(0,10)}
function eventData(){let s=pub.settings||pub||{},d=habitualDate(s.mode),ov=(pub.overrides||[]).find(x=>x.date===key(d))||{};if(ov.date){let p=ov.date.split('-').map(Number);d=new Date(p[0],p[1]-1,p[2])}let time=ov.time||(s.mode==='sun'?'14:00':'21:30');return{date:d,time,place:ov.place||s.usualPlace||'',lat:Number(ov.lat??s.usualLat??43.6108225),lng:Number(ov.lng??s.usualLng??3.8766489),comment:ov.comment||'',cancelled:!!ov.cancelled}}
function drawNext(){let e=eventData();$('#nextDate').textContent=e.date.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}).replace('/','·');$('#nextTime').textContent=e.time.replace(':','H');$('#nextPlace').textContent=e.place;e.cancelled&&($('#nextTime').textContent='×')}
async function load(){try{let r=await fetch(API+'/api/public');pub=await r.json();drawNext()}catch(e){pub={settings:{mode:'thu',usualPlace:'Montpellier',usualLat:43.6108225,usualLng:3.8766489},photos:[],videos:[],links:[]};drawNext()}}
function photos(){let a=pub.photos||[];return a.length?'<div class="grid">'+a.map(x=>`<div class="card"><img loading="lazy" src="${esc(x.url||x.src||x.path)}" alt=""></div>`).join('')+'</div>':'<div class="empty">▧</div>'}
function videos(){let a=pub.videos||[];return a.length?'<div class="grid">'+a.map(x=>{let u=x.url||'',id=(u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/)||[])[1];return `<a class="card" target="_blank" rel="noopener" href="${esc(u)}">${id?`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="">`:'▶'}</a>`}).join('')+'</div>':'<div class="empty">▶</div>'}
function links(){let a=(pub.settings?.links||pub.links||[]);return '<div class="links">'+a.map(x=>`<a target="_blank" rel="noopener" href="${esc(x.url||x.href)}">${esc(x.label||x.name||'↗')}</a>`).join('')+'</div>'}
function event(){let e=eventData();return `<div class="event">${e.cancelled?'× ':''}${e.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · ${esc(e.time)}<small>⌖ ${esc(e.place)} ${esc(e.comment)}</small></div>`}
function messageForm(){return `<form class="form" id="msg"><input name="name" placeholder="✎"><textarea name="message" required placeholder="✉"></textarea><button>→</button><div id="status"></div></form>`}
function showMap(){let e=eventData();setTimeout(()=>{map&&map.remove();map=L.map('map',{zoomControl:true}).setView([e.lat,e.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.circleMarker([e.lat,e.lng],{radius:12,color:'#000',fillColor:'#000',fillOpacity:1}).addTo(map)},40)}
function open(type){let names={baleti:'BALÈTI',photos:'▧',videos:'▶',map:'⌖',messages:'✉',follow:'◎',links:'↗',papers:'▤',propose:'+'};$('#heading').textContent=names[type]||'';let html='';if(type==='baleti')html=event();if(type==='photos')html=photos();if(type==='videos')html=videos();if(type==='messages')html=messageForm();if(type==='links'||type==='follow')html=links();if(type==='papers')html='<div class="empty">▤</div>';if(type==='propose')html='<div class="empty">+</div>';if(type==='map')html='<div id="map" class="map"></div>';$('#content').innerHTML=html;$('#modal').classList.add('open');if(type==='map')showMap();if(type==='messages')$('#msg').onsubmit=send}
async function send(ev){ev.preventDefault();let f=new FormData(ev.target),body={name:f.get('name')||'',message:f.get('message')||''};let s=$('#status');try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});s.textContent=r.ok?'✓':'×';r.ok&&ev.target.reset()}catch(e){s.textContent='×'}}
document.querySelectorAll('.nav').forEach(n=>{n.onclick=()=>open(n.dataset.open);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(n.dataset.open)}}});$('#next').onclick=()=>open('baleti');$('#close').onclick=()=>$('#modal').classList.remove('open');document.addEventListener('keydown',e=>e.key==='Escape'&&$('#modal').classList.remove('open'));load();
</script></body></html>
