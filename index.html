.event-note{margin-top:22px;padding:15px 17px;background:#ffffff0d;border-radius:8px;border-left:2px solid var(--event-accent)}
.event-note p{margin:5px 0 0;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.event-map-link{display:inline-flex;gap:18px;align-items:center;margin-top:20px;padding:10px 0;border:0;border-bottom:1px solid #f5cf7e;background:transparent;color:#f5cf7e;font:700 14px Arial,sans-serif;cursor:pointer}
.event-map-link:focus-visible{outline:2px solid #fff;outline-offset:5px}
@media(max-width:480px){.event-announcement{padding:20px 18px}#next{margin-top:22px}.event-badge{font-size:12px;padding:7px 10px}.event-place{font-size:17px}}
 .forum-tile{background-image:url('assets/Forum.jpg');left:50%;top:50%;transform:translate(-50%,-50%)}#forum{background-image:linear-gradient(#0005,#0008),url('assets/Forum.jpg')}#forum .panel{width:min(1000px,94vw);background:rgba(0,0,0,.38);backdrop-filter:blur(3px);border-left:2px solid #fff}#forumFrame{display:block;width:100%;height:min(68vh,720px);border:0;background:#17110e;color-scheme:dark} @media(max-width:600px){#forumFrame{height:70vh}} #forum .panel{background:transparent;backdrop-filter:none}#forum .forum-content{max-width:740px;font:16px/1.55 Arial,sans-serif;color:#fff}#forum .forum-content p{max-width:700px}#forum .forum-content h3{font:500 29px Georgia,serif;margin:26px 0 20px}#forum .forum-content article{padding:18px 0;border-top:1px solid #fffa}#forum .forum-content article p{white-space:pre-wrap;overflow-wrap:anywhere}#forum .forum-content small{color:#eee}#forum .forum-content .forum-reply{margin:15px 0 0 25px;padding-left:15px;border-left:2px solid #fffa}#forum .forum-actions{display:flex;gap:12px;flex-wrap:wrap}#forum .forum-content button:disabled{opacity:.5;cursor:not-allowed}#forum #forumNotice{font-weight:700;text-shadow:0 2px 7px #000}
/* Bouton Forum sur l'accueil, en haut à gauche, comme Admin et Contact */
.home-grid .forum-home{position:fixed!important;left:18px!important;right:auto!important;top:18px!important;bottom:auto!important;transform:none!important;margin:0!important;z-index:35!important;width:86px!important;height:59px!important;border-radius:8px;background:url('assets/Forum.jpg') center/cover no-repeat}
.home-grid .forum-home span{font-size:10px;padding:7px 4px}
@media(max-width:900px){.home-grid .forum-home{left:13px!important;top:13px!important}}
@media(max-width:600px){.home-grid .forum-home{width:72px!important;height:49px!important}}
@media(max-width:900px) and (orientation:landscape){.home-grid .forum-home{width:70px!important;height:48px!important}}
