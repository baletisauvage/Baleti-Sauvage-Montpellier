<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Balèti Sauvage Montpellier</title><link rel="icon" href="favicon_baleti_original.ico"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;font-family:Georgia,serif}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,146.111vh);aspect-ratio:789/540;overflow:hidden;background:#111}.stage-bg{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.admin{position:absolute;z-index:60;right:1.3%;top:2%;width:46px;height:46px;display:grid;place-items:center;border:2px solid #111;border-radius:50%;background:#f7e9c6;color:#111;text-decoration:none}.map-shell{position:absolute;z-index:12;left:31.65%;top:11.68%;width:51.94%;height:78.53%;overflow:hidden;clip-path:polygon(51.5% 0,85% 6.5%,100% 23.5%,96.8% 73.4%,51% 100%,3% 73.4%,0 24.2%,17% 7.2%);background:#ddd}.map{width:100%;height:100%;opacity:1}.leaflet-control-container{font-family:Arial,sans-serif}.leaflet-control-attribution{font-size:7px!important}.hotspot{position:absolute;z-index:30;border:1px solid rgba(255,255,255,.38);border-radius:50%;background:rgba(255,220,90,.22);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);cursor:pointer;padding:0}.hotspot:hover{background:rgba(255,220,90,.34)}.hotspot span{display:none}.photos{left:28.17%;top:5.46%;width:16.93%;height:23.73%}.baleti{left:71.83%;top:5.46%;width:17.18%;height:23.73%}.videos{left:17.57%;top:39.17%;width:16.15%;height:23.54%}.suivre{left:81.27%;top:39.17%;width:16.28%;height:23.54%}.liens{left:28.55%;top:69.30%;width:16.41%;height:24.11%}.messages{left:71.19%;top:69.30%;width:16.67%;height:24.11%}.modal{position:fixed;z-index:1000;inset:0;display:none;place-items:center;padding:20px;background:#000a}.modal.open{display:grid}.panel{position:relative;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:28px;border:4px solid #17130d;border-radius:24px;background:#f5e5bd;color:#17130d}.close{position:absolute;right:14px;top:12px;width:40px;height:40px;border:2px solid #111;border-radius:50%;background:#fff7df;font-size:25px}.gallery,.video-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.photo-card,.video-card{margin:0;background:#fff8e8;border:2px solid #17130d;border-radius:12px;overflow:hidden;cursor:pointer}.photo-card img,.video-card img{display:block;width:100%;height:180px;object-fit:cover}.photo-card figcaption,.video-info{padding:9px;font:14px Arial}.photo-card.main,.video-card.main{grid-column:span 2}.photo-card.main img,.video-card.main img{height:280px}.video-player{display:none;margin-bottom:16px}.video-player.open{display:block}.video-player iframe{width:100%;aspect-ratio:16/9;border:0}.links-list,.message-form{display:grid;gap:10px}.links-list a{padding:12px;border:2px solid #17130d;border-radius:10px;background:#fff8e8;color:#17130d;font:bold 16px Arial;text-decoration:none}.message-form input,.message-form textarea,.message-form button{width:100%;padding:12px;border:2px solid #17130d;border-radius:10px;font:16px Arial}.message-form textarea{min-height:150px}.message-form button{background:#17130d;color:#fff;font-weight:800}.message-status{margin-top:10px}.lightbox{position:fixed;z-index:1500;inset:0;display:none;place-items:center;background:#000e;padding:30px}.lightbox.open{display:grid}.lightbox img{max-width:94vw;max-height:82vh}.lbclose{position:absolute;right:20px;top:15px;font-size:34px;color:#fff;background:none;border:0}.lbinfo{color:#fff;text-align:center;font:15px Arial}.pin-card{position:relative;transform:translate(-50%,-100%);min-width:145px;padding:7px 9px 11px;background:#111;color:#fff;border:3px solid #f5e5b8;border-radius:15px;text-align:center;font:900 12px/1.1 Arial}.pin-card em{display:block;color:#f7d270;font-style:normal;font-size:15px}.history-dot{width:9px;height:9px;border-radius:50%;background:#111;border:2px solid #f5e5b8}@media(max-width:760px){body{display:block}.admin{width:36px;height:36px}.leaflet-control-zoom{display:none}.photo-card.main,.video-card.main{grid-column:auto}.photo-card.main img,.video-card.main img{height:180px}}</style></head><body><main class="stage"><img class="stage-bg" src="./reference.jpg?v=1062a195" alt="" aria-hidden="true"><a class="admin" href="admin.html" title="Administration">🔒</a><div class="map-shell"><div id="map" class="map"></div></div><button class="hotspot photos" data-modal="photosModal"><span>Photos</span></button><button class="hotspot baleti" data-modal="baletiModal"><span>Balèti Sauvage</span></button><button class="hotspot videos" data-modal="videosModal"><span>Vidéos</span></button><button class="hotspot suivre" data-modal="suivreModal"><span>Suivre</span></button><button class="hotspot liens" data-modal="liensModal"><span>Liens</span></button><button class="hotspot messages" data-modal="messagesModal"><span>Messages</span></button></main><div class="modal" id="baletiModal"><section class="panel"><button class="close">×</button><h2>Balèti Sauvage</h2><div id="baletiText">Chargement…</div></section></div><div class="modal" id="photosModal"><section class="panel"><button class="close">×</button><h2>Photos</h2><div id="photoGallery" class="gallery"></div></section></div><div class="modal" id="videosModal"><section class="panel"><button class="close">×</button><h2>Vidéos</h2><div id="videoPlayer" class="video-player"><iframe id="videoFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div id="videoGallery" class="video-gallery"></div></section></div><div class="modal" id="suivreModal"><section class="panel"><button class="close">×</button><h2>Suivre</h2><p>Cette rubrique sera définie plus tard.</p></section></div><div class="modal" id="liensModal"><section class="panel"><button class="close">×</button><h2>Liens</h2><div id="publicLinks" class="links-list"></div></section></div><div class="modal" id="messagesModal"><section class="panel"><button class="close">×</button><h2>Messages</h2><form id="messageForm" class="message-form"><label>Prénom<input id="messageName" maxlength="60" required></label><label>Contact <small>(facultatif)</small><input id="messageContact" maxlength="254"></label><label>Message<textarea id="messageText" maxlength="1200" required></textarea></label><button type="submit">Envoyer le message</button></form><div id="messageStatus" class="message-status"></div></section></div><div id="lightbox" class="lightbox"><button class="lbclose">×</button><div><img id="lbimg" alt=""><div id="lbinfo" class="lbinfo"></div></div></div><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',FALLBACK=[43.6108225,3.8766489];let map;const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),valid=(a,b)=>Number.isFinite(+a)&&Number.isFinite(+b)&&!(+a===0&&+b===0);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nextDate(mode){let n=new Date(),d=new Date(n),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(!x&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function fmt(d){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)}function initMap(c){map=L.map('map',{minZoom:13,maxZoom:19,zoomControl:true,scrollWheelZoom:true,dragging:true,touchZoom:true,doubleClickZoom:true,boxZoom:true}).setView(c,15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(true),120)}function draw(s,ovs){let d=nextDate(s.mode),key=iso(d),o=ovs.find(x=>x.event_date===key)||{},base=valid(s.usualLat,s.usualLng)?[+s.usualLat,+s.usualLng]:FALLBACK,pos=valid(o.lat,o.lng)?[+o.lat,+o.lng]:base,time=o.time||(s.mode==='sun'?'14:00':'21:30');if(!map)initMap(pos);else{map.setView(pos,15);map.invalidateSize(true)}L.marker(pos,{icon:L.divIcon({className:'',iconSize:[1,1],html:`<div class="pin-card"><strong>${o.cancelled?'ANNULÉ':'PROCHAIN BALÈTI'}</strong><br>${fmt(d).toUpperCase()}<em>${time.replace(':','H')}</em></div>`})}).addTo(map).bindPopup(`<strong>${E(o.place||s.usualPlace||'')}</strong>${o.comment?'<br>'+E(o.comment):''}`)}function renderPhotos(ps){let g=document.getElementById('photoGallery');g.innerHTML=ps.length?ps.map((p,i)=>`<figure class="photo-card ${p.principale?'main':''}" data-i="${i}"><img src="${E(p.url)}" loading="lazy"><figcaption>${E(p.titre||'')}${p.credit?'<br>© '+E(p.credit):''}</figcaption></figure>`).join(''):'<p>Aucune photo pour le moment.</p>';g.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let p=ps[+x.dataset.i];lbimg.src=p.url;lbinfo.innerHTML=E(p.titre||'')+(p.credit?'<br>© '+E(p.credit):'');lightbox.classList.add('open')})}function renderVideos(vs){let g=document.getElementById('videoGallery'),list=[...vs].sort((a,b)=>+b.principale-+a.principale);g.innerHTML=list.length?list.map((v,i)=>`<article class="video-card ${v.principale?'main':''}" data-v="${i}"><img src="https://i.ytimg.com/vi/${E(v.youtubeId)}/hqdefault.jpg"><div class="video-info"><strong>${E(v.titre)}</strong>${v.evenement?'<br>'+E(v.evenement):''}</div></article>`).join(''):'<p>Aucune vidéo pour le moment.</p>';g.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{videoFrame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(list[+x.dataset.v].youtubeId)+'?autoplay=1&rel=0';videoPlayer.classList.add('open')})}function renderLinks(ls){publicLinks.innerHTML=ls.length?ls.map(x=>`<a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.title)}</a>`).join(''):'<p>Aucun lien pour le moment.</p>'}async function load(){try{let r=await fetch(API+'/api/public',{cache:'no-store'}),j=await r.json();baletiText.textContent=j.settings.baletiText||'';renderPhotos(j.photos||[]);renderVideos(j.videos||[]);renderLinks(j.settings.links||[]);draw(j.settings,j.overrides||[])}catch(e){if(!map)initMap(FALLBACK)}}document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.modal).classList.add('open'));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>{let m=b.closest('.modal');if(m.id==='videosModal'){videoFrame.src='';videoPlayer.classList.remove('open')}m.classList.remove('open')});document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});document.querySelector('.lbclose').onclick=()=>lightbox.classList.remove('open');messageForm.onsubmit=async e=>{e.preventDefault();messageStatus.textContent='Envoi…';try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:messageName.value,contact:messageContact.value,message:messageText.value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');messageForm.reset();messageStatus.textContent='Message envoyé. Merci !'}catch(x){messageStatus.textContent='Erreur : '+x.message}};load();</script></body></html>
