<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balèti Sauvage Montpellier</title><link rel="icon" href="favicon_baleti_original.ico"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}body{min-height:100vh;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.5)),url('assets/site-bg.jpg') center/cover fixed no-repeat}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(18px,4vw,55px)}.grid{width:min(1100px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,22px)}.tile{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:clamp(150px,24vh,245px);overflow:hidden;border:2px solid rgba(255,255,255,.72);border-radius:5px;background-position:center;background-size:cover;color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.35);transition:transform .16s ease}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(0,0,0,.72))}.tile span{position:relative;z-index:1;width:100%;padding:20px 12px 17px;text-align:center;font-size:clamp(19px,2.4vw,31px);font-weight:900;letter-spacing:.04em;text-shadow:0 2px 5px #000}.tile:hover,.tile:focus-visible{transform:scale(1.025);outline:3px solid #fff;outline-offset:2px}.lieu{background-image:url('assets/lieu.jpg')}.date{background-image:url('assets/date.jpg')}.photos{background-image:url('assets/photos.jpg')}.video{background-image:url('assets/video.jpg')}.admin{background-image:url('assets/admin.jpg')}.baleti{background-image:url('assets/baleti-sauvage.jpg')}.liens{background-image:url('assets/liens.jpg')}.message{background-image:url('assets/message.jpg')}.papiers{background-image:url('assets/papiers.jpg')}@media(max-width:760px){body{background-attachment:scroll}.wrap{align-items:flex-start;padding:12px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tile{min-height:180px}.tile span{font-size:19px;padding:15px 7px 13px}}@media(max-width:420px){.tile{min-height:155px}.tile span{font-size:16px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}</style></head><body><main class="wrap"><nav class="grid" aria-label="Balèti Sauvage"><a class="tile lieu" href="#" data-open="map"><span>LIEU</span></a><a class="tile date" href="#" data-open="baleti"><span>DATE</span></a><a class="tile photos" href="#" data-open="photos"><span>PHOTOS</span></a><a class="tile video" href="#" data-open="videos"><span>VIDÉO</span></a><a class="tile admin" href="admin.html"><span>ADMIN</span></a><a class="tile baleti" href="#" data-open="baleti"><span>BALÈTI SAUVAGE</span></a><a class="tile liens" href="#" data-open="links"><span>LIENS</span></a><a class="tile message" href="#" data-open="messages"><span>MESSAGE</span></a><a class="tile papiers" href="#" data-open="papers"><span>PAPIERS</span></a></nav></main><script>const routes={map:'map',baleti:'baleti',photos:'photos',videos:'videos',links:'links',messages:'messages',papers:'papers'};document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const t=a.dataset.open;location.href='index-old.html#'+(routes[t]||t)}));</script></body></html>
