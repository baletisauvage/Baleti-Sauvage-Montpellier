<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balèti Sauvage Montpellier</title><link rel="icon" href="favicon_baleti_original.ico"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}html{background:#000;padding:10px}body{margin:0;min-height:calc(100vh - 20px);font-family:Arial,sans-serif;color:#fff;border:8px solid #000;background:url('assets/site-bg.jpg') center/cover fixed no-repeat}.home{min-height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center;padding:20px}.grid{position:relative;width:min(780px,88vw);height:min(720px,82vh);min-height:610px}.tile{position:absolute;display:flex;align-items:flex-end;justify-content:center;width:clamp(150px,18vw,190px);height:clamp(105px,13vw,130px);border:2px solid #fff;border-radius:8px;background:center/cover;color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 8px 28px #0009;padding:0;overflow:hidden}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,#000c)}.tile span{z-index:1;width:100%;padding:12px;text-align:center;font-weight:900;text-shadow:0 2px 5px #000}.tile:hover{filter:brightness(1.1)}.lieu{background-image:url('assets/lieu.jpg');left:50%;top:0;transform:translateX(-50%)}.photos{background-image:url('assets/photos.jpg');right:2%;top:19%}.video{background-image:url('assets/video.jpg');right:2%;bottom:19%}.liens{background-image:url('assets/liens.jpg');left:50%;bottom:0;transform:translateX(-50%)}.message{background-image:url('assets/message.jpg');left:2%;bottom:19%}.papiers{background-image:url('assets/papiers.jpg');left:2%;top:19%}.baleti{background-image:url('assets/baleti-sauvage.jpg');left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(210px,27vw,285px);height:clamp(210px,27vw,285px);border-radius:50%;border:0;overflow:visible;z-index:5;box-shadow:none}.baleti:after,.baleti-flight:after{display:none}.baleti-ring{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);pointer-events:none;transform-origin:50% 50%;animation:baletiRingSpin 14s linear infinite}.baleti-ring text{fill:#fff;font:600 13px Georgia,serif;letter-spacing:.7px}@keyframes baletiRingSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.admin{background-image:url('assets/admin.jpg');right:0;bottom:0;width:86px;height:59px;aspect-ratio:1.46/1;border-radius:8px}.admin span{font-size:10px;padding:7px 4px}.baleti-flight{position:fixed!important;z-index:90!important;transform:none!important;background:url('assets/baleti-sauvage.jpg') center/cover;transition:.5s!important;pointer-events:none}.baleti-flight.go{left:18px!important;top:18px!important;width:calc(100vw - 36px)!important;height:calc(100vh - 36px)!important;border-radius:0}.baleti-flight.go .baleti-ring{opacity:0}.modal{position:fixed;z-index:50;inset:10px;display:none;padding:16px;overflow:auto;background:center/cover no-repeat;border:8px solid #000}.modal.open{display:grid;place-items:center}#map{background-image:url('assets/lieu.jpg')}#photos{background-image:url('assets/photos.jpg')}#videos{background-image:url('assets/video.jpg')}#baleti{background-image:url('assets/baleti-sauvage.jpg')}#links{background-image:url('assets/liens.jpg')}#messages{background-image:url('assets/message.jpg')}#papers{background-image:url('assets/papiers.jpg')}.panel{position:relative;width:min(900px,92vw);max-height:88vh;overflow:auto;padding:clamp(24px,5vw,56px);background:transparent;border-left:2px solid #fff;text-shadow:0 2px 8px #000}.close{position:absolute;right:18px;top:18px;width:42px;height:42px;border:1px solid #fff;border-radius:50%;background:transparent;color:#fff;font-size:25px;cursor:pointer}h2{margin:0 65px 36px 0;font:900 clamp(28px,5vw,48px) Georgia,serif;letter-spacing:.05em}.form{display:grid;gap:20px;max-width:720px}.form input,.form textarea{padding:12px 2px;background:transparent;color:#fff;border:0;border-bottom:2px solid #fff;font:500 16px Arial;outline:none;text-shadow:0 2px 5px #000}.form input::placeholder,.form textarea::placeholder{color:#fff}.form textarea{min-height:130px}.form button{width:max-content;min-width:150px;padding:12px 22px;border:2px solid #fff;background:transparent;color:#fff;font-weight:900;letter-spacing:.08em;cursor:pointer}.form button:hover{background:#fff;color:#111}.links a,.links button{display:block;width:auto;max-width:100%;padding:13px 2px;margin:0 0 10px;color:#fff;background:transparent;border:0;border-bottom:1px solid #fff;text-decoration:none;text-align:left;font:800 16px Arial;text-shadow:0 2px 5px #000;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,200px));gap:22px}.photo-card,.card{background:transparent;color:#fff;border:0;border-bottom:2px solid #fff;padding:0 0 8px;text-align:left;cursor:pointer}.photo-card img,.gallery img{width:100%;height:140px;object-fit:cover}.map{height:min(68vh,650px);border:2px solid #fff}.player{width:100%;aspect-ratio:16/9;border:0}.big{font-size:clamp(21px,3.5vw,42px);font-weight:800}.status{font-weight:900;margin-top:10px}.lightbox{position:fixed;z-index:100;inset:0;display:none;align-items:center;justify-content:center;background:#000e;padding:55px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:85vh}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;background:#0008;color:#fff;border:1px solid #fff;font-size:30px}.lightbox-close{top:14px;right:18px}.lightbox-prev{left:12px}.lightbox-next{right:12px}.lightbox-caption{position:absolute;bottom:14px}@media(max-width:760px){html{padding:5px}body{border-width:5px;background-attachment:scroll}.grid{width:100%;height:auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:235px}.tile{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;width:100%;height:105px}.baleti{position:absolute!important;left:50%!important;top:105px!important;transform:translate(-50%,-50%)!important;width:180px;height:180px}.admin{grid-column:2;width:86px!important;height:59px!important;justify-self:end}.baleti-flight{transform:none!important}.modal{inset:5px;border-width:5px}.panel{width:94vw;padding:26px 18px}.gallery{grid-template-columns:repeat(2,1fr)}} .attachment-field{display:grid;gap:8px;padding:8px 0;border-bottom:2px solid #fff;text-shadow:0 2px 5px #000}.attachment-field span{font-weight:800;font-size:14px}.attachment-field input{border:0!important;padding:4px 0!important}.attachment-field small{font-size:12px;line-height:1.35}.attachment-field input::file-selector-button{margin-right:12px;padding:8px 12px;border:1px solid #fff;background:transparent;color:#fff;font-weight:800;cursor:pointer}</style></head><body><main class="home"><nav class="grid"><button class="tile lieu" data-open="map"><span>CARTE</span></button><button class="tile photos" data-open="photos"><span>PHOTOS</span></button><button class="tile video" data-open="videos"><span>VIDÉO</span></button><button class="tile liens" data-open="links"><span>LIENS</span></button><button class="tile message" data-open="messages"><span>MESSAGE</span></button><button class="tile papiers" data-open="papers"><span>PAPIERS</span></button><button class="tile baleti" data-open="baleti" aria-label="Balèti Sauvage"><svg class="baleti-ring" viewBox="0 0 240 240" aria-hidden="true"><defs><path id="baletiLeft" d="M120,214 A94,94 0 0,1 120,26"/><path id="baletiRight" d="M120,26 A94,94 0 0,1 120,214"/></defs><text><textPath href="#baletiLeft" startOffset="50%" text-anchor="middle">BALÈTI SAUVAGE</textPath></text><text><textPath href="#baletiRight" startOffset="50%" text-anchor="middle">MONTPELLIER</textPath></text></svg></button><a class="tile admin" href="admin.html"><span>ADMIN</span></a></nav></main><div class="modal" id="baleti"><section class="panel"><button class="close">×</button><h2>BALÈTI SAUVAGE</h2><div id="baletiText" class="big"></div><div id="next" class="big"></div></section></div><div class="modal" id="photos"><section class="panel"><button class="close">×</button><h2>PHOTOS</h2><div id="photoGallery" class="gallery"></div></section></div><div class="modal" id="videos"><section class="panel"><button class="close">×</button><h2>VIDÉO</h2><div id="videoPlayer"></div><div id="videoGallery" class="gallery"></div></section></div><div class="modal" id="map"><section class="panel"><button class="close">×</button><h2>CARTE</h2><div id="leaflet" class="map"></div></section></div><div class="modal" id="links"><section class="panel"><button class="close">×</button><h2>LIENS</h2><div id="publicLinks" class="links"></div></section></div><div class="modal" id="messages"><section class="panel"><button class="close">×</button><h2>MESSAGE</h2><form id="messageForm" class="form"><input id="name" placeholder="Prénom" maxlength="60" required><input id="contact" placeholder="Contact" maxlength="254"><textarea id="text" placeholder="Message" maxlength="1200" required></textarea><label class="attachment-field"><span>PIÈCE JOINTE (facultatif)</span><input id="attachment" name="attachment" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.txt,.mp4,.mov,.webm,application/pdf,image/jpeg,image/png,video/mp4,video/quicktime,video/webm"><small>PDF, JPG, PNG, DOC, DOCX, TXT : 8 Mo max · MP4, MOV, WebM : 50 Mo max</small></label><input id="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button type="submit">ENVOYER</button></form><div id="status" class="status"></div></section></div><div class="modal" id="papers"><section class="panel"><button class="close">×</button><h2>PAPIERS</h2><div id="papersContent" class="links"></div><div id="paperStatus" class="status"></div></section></div><div class="lightbox" id="photoLightbox"><button class="lightbox-close" aria-label="Fermer">×</button><button class="lightbox-prev" aria-label="Photo précédente">‹</button><img id="lightboxImage" alt=""><button class="lightbox-next" aria-label="Photo suivante">›</button><div class="lightbox-caption" id="lightboxCaption"></div></div><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',FALLBACK=[43.6108225,3.8766489];let STATE,map,marker,PHOTOS=[],photoIndex=0,baletiAnimating=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nextDate(mode){let n=new Date(),d=new Date(n),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(!x&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function info(){let s=STATE?.settings||{},d=nextDate(s.mode),o=(STATE?.overrides||[]).find(x=>x.event_date===iso(d))||{},pos=Number.isFinite(+o.lat)&&Number.isFinite(+o.lng)?[+o.lat,+o.lng]:Number.isFinite(+s.usualLat)&&Number.isFinite(+s.usualLng)?[+s.usualLat,+s.usualLng]:FALLBACK;return{d,o,pos,time:o.time||(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace||''}}function draw(){let n=info(),date=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(n.d);$('#next').innerHTML='<br>'+(n.o.cancelled?'ANNULÉ<br>':'')+esc(date.toUpperCase())+' · '+esc(n.time.replace(':','H'))+'<br>'+esc(n.place)+(n.o.comment?'<br>'+esc(n.o.comment):'');if(map){map.setView(n.pos,15);if(marker)marker.remove();marker=L.marker(n.pos).addTo(map).bindPopup(esc(n.place))}}function initMap(){let n=info();if(!map){map=L.map('leaflet').setView(n.pos,15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}draw();setTimeout(()=>map.invalidateSize(),100)}function open(id){document.getElementById(id).classList.add('open');if(id==='map')initMap()}function openBaleti(b){if(baletiAnimating)return;baletiAnimating=true;let r=b.getBoundingClientRect(),c=b.cloneNode(true);c.classList.add('baleti-flight');c.style.left=r.left+'px';c.style.top=r.top+'px';c.style.width=r.width+'px';c.style.height=r.height+'px';document.body.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('go')));setTimeout(()=>{open('baleti');c.remove();baletiAnimating=false},520)}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>b.dataset.open==='baleti'?openBaleti(b):open(b.dataset.open));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});function showPhoto(i){if(!PHOTOS.length)return;photoIndex=(i+PHOTOS.length)%PHOTOS.length;let p=PHOTOS[photoIndex];$('#lightboxImage').src=p.url;$('#lightboxImage').alt=p.titre||'Photo';$('#lightboxCaption').innerHTML=esc(p.titre||'')+(p.credit?' · © '+esc(p.credit):'');$('#photoLightbox').classList.add('open')}function closePhoto(){$('#photoLightbox').classList.remove('open');$('#lightboxImage').src=''}$('.lightbox-close').onclick=closePhoto;$('.lightbox-prev').onclick=e=>{e.stopPropagation();showPhoto(photoIndex-1)};$('.lightbox-next').onclick=e=>{e.stopPropagation();showPhoto(photoIndex+1)};$('#photoLightbox').onclick=e=>{if(e.target===$('#photoLightbox'))closePhoto()};document.addEventListener('keydown',e=>{if($('#photoLightbox').classList.contains('open')){if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(photoIndex-1);if(e.key==='ArrowRight')showPhoto(photoIndex+1)}else if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});async function downloadPaper(url,name){let st=$('#paperStatus');st.textContent='Téléchargement…';try{let r=await fetch(url);if(!r.ok)throw Error('document inaccessible');let blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name||'document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);st.textContent='✓ Téléchargement lancé'}catch(e){st.textContent='Impossible de télécharger automatiquement. Ouverture du document…';location.href=url}}function render(j){STATE=j;$('#baletiText').textContent=j.settings?.baletiText||'';draw();PHOTOS=[...(j.photos||[])];$('#photoGallery').innerHTML=PHOTOS.length?PHOTOS.map((p,i)=>'<button class="photo-card" type="button" data-photo="'+i+'"><img src="'+esc(p.url)+'" loading="lazy" alt="'+esc(p.titre||'Photo')+'"><p>'+esc(p.titre||'')+(p.credit?'<br>© '+esc(p.credit):'')+'</p></button>').join(''):'—';document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>showPhoto(+b.dataset.photo));let vs=[...(j.videos||[])].sort((a,b)=>+b.principale-+a.principale);$('#videoGallery').innerHTML=vs.length?vs.map(v=>'<button class="card" data-video="'+esc(v.youtubeId)+'"><img src="https://i.ytimg.com/vi/'+esc(v.youtubeId)+'/hqdefault.jpg" loading="lazy"><p>'+esc(v.titre||'')+'</p></button>').join(''):'—';document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>$('#videoPlayer').innerHTML='<iframe class="player" src="https://www.youtube-nocookie.com/embed/'+b.dataset.video+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>');let ls=j.settings?.links||[];$('#publicLinks').innerHTML=ls.length?ls.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+' ↗</a>').join(''):'—';let pa=j.papers||[];$('#papersContent').innerHTML=pa.length?pa.map((x,i)=>'<button type="button" data-paper="'+i+'">'+esc(x.titre||x.nomOriginal||'Document')+' — TÉLÉCHARGER ↓</button>').join(''):'—';document.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{let x=pa[+b.dataset.paper];downloadPaper(x.url,x.nomOriginal||x.fichier)})}$('#messageForm').onsubmit=async e=>{e.preventDefault();$('#status').textContent='…';try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:$('#name').value,contact:$('#contact').value,message:$('#text').value,website:$('#website').value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');$('#status').textContent='✓';e.target.reset()}catch(x){$('#status').textContent='× '+x.message}};(async()=>{try{let r=await fetch(API+'/api/public'),j=await r.json();if(!r.ok||!j.ok)throw Error();render(j)}catch(e){$('#baletiText').textContent='—'}})();</script><script>(()=>{const f=document.getElementById('messageForm');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();const st=document.getElementById('status'),btn=f.querySelector('button[type="submit"]'),file=document.getElementById('attachment').files[0];if(file){const ext=(file.name.split('.').pop()||'').toLowerCase(),video=['mp4','mov','webm'].includes(ext),max=video?50*1024*1024:8*1024*1024;if(file.size>max){st.textContent=video?'Vidéo : maximum 50 Mo.':'Fichier : maximum 8 Mo.';return}}const d=new FormData();d.append('prenom',document.getElementById('name').value);d.append('contact',document.getElementById('contact').value);d.append('message',document.getElementById('text').value);d.append('website',document.getElementById('website').value);if(file)d.append('attachment',file,file.name);btn.disabled=true;st.textContent=file?'Envoi du message et du fichier…':'Envoi…';try{const r=await fetch(API+'/api/messages',{method:'POST',body:d}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.detail||j.error||('HTTP '+r.status));f.reset();st.textContent='✓ Message envoyé'}catch(err){st.textContent='Erreur : '+err.message}finally{btn.disabled=false}},true)})();</script></body></html>
