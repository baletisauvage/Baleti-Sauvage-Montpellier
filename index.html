<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Balèti Sauvage Montpellier</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#17130d;font-family:Georgia,serif}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,177.586vh);aspect-ratio:1648/928;background:url('reference.jpg') center/100% 100% no-repeat;overflow:hidden}.admin{position:absolute;z-index:60;right:1.3%;top:2%;width:46px;height:46px;display:grid;place-items:center;border:2px solid #111;border-radius:50%;background:#f7e9c6;color:#111;text-decoration:none}.map-shell{position:absolute;z-index:12;left:33.7%;top:19.1%;width:32.7%;height:55.7%;clip-path:polygon(50% 0,91% 7%,100% 31%,95% 66%,78% 91%,50% 100%,22% 91%,5% 66%,0 31%,9% 7%);background:#ddd}.map{width:100%;height:100%}.leaflet-control-attribution{font-size:7px!important}.hotspot{position:absolute;z-index:30;border:0;border-radius:50%;background:transparent;cursor:pointer}.hotspot span{position:absolute;left:13%;right:13%;bottom:13%;display:grid;place-items:center;min-height:27%;background:#f4e5b8;border-radius:0 0 999px 999px;font:900 clamp(8px,1.28vw,22px)/.95 Arial;text-transform:uppercase}.photos{left:28.6%;top:10.9%;width:12.7%;height:22.6%}.baleti{left:59.6%;top:10.9%;width:12.7%;height:22.6%}.videos{left:22.9%;top:39.6%;width:12.7%;height:22.6%}.suivre{left:65.2%;top:39.6%;width:12.7%;height:22.6%}.liens{left:28.9%;top:65.5%;width:12.7%;height:22.6%}.messages{left:59.2%;top:65.5%;width:12.7%;height:22.6%}.baleti span{font-size:clamp(7px,1.02vw,17px)}.modal{position:fixed;z-index:1000;inset:0;display:none;place-items:center;padding:20px;background:#000a}.modal.open{display:grid}.panel{position:relative;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:28px;border:4px solid #17130d;border-radius:24px;background:#f5e5bd}.close{position:absolute;right:14px;top:12px;width:40px;height:40px;border:2px solid #111;border-radius:50%;background:#fff7df;font-size:25px}.baleti-text{padding:18px;background:#fff9e9dc;border-radius:15px;line-height:1.65}.next-pin{background:transparent;border:0}.pin-card{position:relative;transform:translate(-50%,-100%);min-width:145px;padding:7px 9px 11px;background:#111;color:#fff;border:3px solid #f5e5b8;border-radius:15px;text-align:center;font:900 12px/1.1 Arial}.pin-card:after{content:'';position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);border:9px solid transparent;border-top-color:#111}.pin-card em{display:block;margin-top:3px;color:#f7d270;font-style:normal;font-size:15px}.history-dot{width:9px;height:9px;border-radius:50%;background:#111;border:2px solid #f5e5b8}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.photo-card{margin:0;background:#fff8e8;border:2px solid #17130d;border-radius:12px;overflow:hidden;cursor:pointer}.photo-card img{display:block;width:100%;height:180px;object-fit:cover}.photo-card figcaption{padding:9px;font:14px/1.3 Arial}.photo-card.main{grid-column:span 2}.photo-card.main img{height:280px}.lightbox{position:fixed;z-index:1500;inset:0;display:none;place-items:center;background:#000e;padding:30px}.lightbox.open{display:grid}.lightbox img{max-width:94vw;max-height:82vh;object-fit:contain}.lightbox .lbclose{position:absolute;right:20px;top:15px;font-size:34px;color:#fff;background:none;border:0}.lbinfo{color:#fff;text-align:center;margin-top:10px;font:15px Arial}.links-list{display:grid;gap:10px}.links-list a{padding:12px 14px;border:2px solid #17130d;border-radius:10px;background:#fff8e8;color:#17130d;font:bold 16px Arial;text-decoration:none}@media(max-width:760px){body{display:block}.admin{width:36px;height:36px}.leaflet-control-zoom{display:none}.pin-card{min-width:105px;font-size:9px}.photo-card.main{grid-column:auto}.photo-card.main img,.photo-card img{height:180px}}</style></head><body><main class="stage"><a class="admin" href="admin.html" title="Administration">🔒</a><div class="map-shell"><div id="map" class="map"></div></div><button class="hotspot photos" data-modal="photosModal"><span>Photos</span></button><button class="hotspot baleti" data-modal="baletiModal"><span>Balèti Sauvage</span></button><button class="hotspot videos" data-modal="videosModal"><span>Vidéos</span></button><button class="hotspot suivre" data-modal="suivreModal"><span>Suivre</span></button><button class="hotspot liens" data-modal="liensModal"><span>Liens</span></button><button class="hotspot messages" data-modal="messagesModal"><span>Messages</span></button></main><div class="modal" id="baletiModal"><section class="panel"><button class="close">×</button><h2>Balèti Sauvage</h2><div class="baleti-text" id="baletiText">Chargement…</div></section></div><div class="modal" id="photosModal"><section class="panel"><button class="close">×</button><h2>Photos</h2><div id="photoGallery" class="gallery"><p>Chargement…</p></div></section></div><div class="modal" id="videosModal"><section class="panel"><button class="close">×</button><h2>Vidéos</h2><p>Vidéos en préparation.</p></section></div><div class="modal" id="suivreModal"><section class="panel"><button class="close">×</button><h2>Suivre</h2><p>Cette rubrique sera définie plus tard.</p></section></div><div class="modal" id="liensModal"><section class="panel"><button class="close">×</button><h2>Liens</h2><div id="publicLinks" class="links-list"></div></section></div><div class="modal" id="messagesModal"><section class="panel"><button class="close">×</button><h2>Messages</h2><p>Messagerie en préparation.</p></section></div><div id="lightbox" class="lightbox"><button class="lbclose">×</button><div><img id="lbimg" alt=""><div id="lbinfo" class="lbinfo"></div></div></div><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',FALLBACK=[43.6108225,3.8766489];let map,history=[];const valid=(a,b)=>Number.isFinite(+a)&&Number.isFinite(+b)&&Math.abs(+a)<=90&&Math.abs(+b)<=180&&!(+a===0&&+b===0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nextDate(mode){const n=new Date(),d=new Date(n),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(x===0&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function fmt(d){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)}function icon(ev){return L.divIcon({className:'next-pin',iconSize:[1,1],iconAnchor:[0,0],html:`<div class="pin-card"><strong>${ev.cancelled?'ANNULÉ':'PROCHAIN BALÈTI'}</strong>${fmt(ev.date).toUpperCase()}<em>${ev.time.replace(':','H')}</em></div>`})}function initMap(c){map=L.map('map',{minZoom:14,maxZoom:19}).setView(c,16);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(true),100)}function draw(s,ovs){const d=nextDate(s.mode),key=iso(d),o=ovs.find(x=>x.event_date===key)||{},base=valid(s.usualLat,s.usualLng)?[+s.usualLat,+s.usualLng]:FALLBACK,pos=valid(o.lat,o.lng)?[+o.lat,+o.lng]:base,ev={date:d,time:o.time||(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace,comment:o.comment||'',cancelled:!!Number(o.cancelled)};if(!map)initMap(pos);const seen=new Set([pos.map(x=>x.toFixed(5)).join(',')]);ovs.filter(x=>x.event_date<key&&valid(x.lat,x.lng)).forEach(x=>{const k=[+x.lat,+x.lng].map(v=>v.toFixed(5)).join(',');if(seen.has(k))return;seen.add(k);history.push(L.marker([+x.lat,+x.lng],{icon:L.divIcon({className:'',iconSize:[9,9],iconAnchor:[4,4],html:'<div class="history-dot"></div>'})}).addTo(map).bindPopup(esc(x.place||'')))});L.marker(pos,{icon:icon(ev)}).addTo(map).bindPopup(`<strong>${esc(ev.place)}</strong>${ev.comment?'<br>'+esc(ev.comment):''}`);map.setView(pos,16,{animate:false})}function renderPhotos(ps){const g=document.getElementById('photoGallery');if(!ps.length){g.innerHTML='<p>Aucune photo pour le moment.</p>';return}g.innerHTML=ps.map((p,i)=>`<figure class="photo-card ${p.principale?'main':''}" data-photo="${i}"><img src="${esc(p.url)}" alt="${esc(p.titre)}" loading="lazy"><figcaption>${p.titre?'<strong>'+esc(p.titre)+'</strong>':''}${p.datePhoto?'<br>'+esc(p.datePhoto):''}${p.credit?'<br>© '+esc(p.credit):''}</figcaption></figure>`).join('');g.querySelectorAll('[data-photo]').forEach(el=>el.onclick=()=>{const p=ps[+el.dataset.photo];document.getElementById('lbimg').src=p.url;document.getElementById('lbinfo').innerHTML=(p.titre?'<strong>'+esc(p.titre)+'</strong>':'')+(p.credit?'<br>© '+esc(p.credit):'')+(p.lien?'<br><a style="color:white" target="_blank" rel="noopener" href="'+esc(p.lien)+'">'+esc(p.texteLien||'Voir le lien')+'</a>':'');document.getElementById('lightbox').classList.add('open')})}function renderLinks(ls){document.getElementById('publicLinks').innerHTML=(ls||[]).length?(ls||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>`).join(''):'<p>Aucun lien pour le moment.</p>'}async function load(){try{const r=await fetch(API+'/api/public',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');document.getElementById('baletiText').textContent=j.settings.baletiText||'';renderPhotos(j.photos||[]);renderLinks(j.settings.links||[]);draw(j.settings,j.overrides||[])}catch(e){initMap(FALLBACK)}}document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.modal).classList.add('open'));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});document.querySelector('.lbclose').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')};load();</script></body></html>
