t;width:calc(100vw - 36px)!important;height:calc(100vh - 36px)!important;border-radius:0;filter:brightness(.72)}.baleti-flight.go:after{border-radius:0}.baleti-flight.go .baleti-ring{opacity:0}.modal{position:fixed;z-index:50;inset:10px;display:none;padding:16px;overflow:auto;background-position:center;background-size:cover;background-repeat:no-repeat;border:8px solid #000;box-shadow:0 0 0 10px #000}.modal.open{display:grid;place-items:center}#map{background-image:linear-gradient(#0003,#0006),url('assets/lieu.jpg')}#photos{background-image:linear-gradient(#0003,#0006),url('assets/photos.jpg')}#videos{background-image:linear-gradient(#0003,#0006),url('assets/video.jpg')}#baleti{background-image:linear-gradient(#0003,#0006),url('assets/baleti-sauvage.jpg')}#links{background-image:linear-gradient(#0003,#0006),url('assets/liens.jpg')}#messages{background-image:linear-gradient(#0003,#0006),url('assets/message.jpg')}#papers{background-image:linear-gradient(#0003,#0006),url('assets/papiers.jpg')}.panel{position:relative;width:min(950px,96vw);max-height:92vh;overflow:auto;background:rgba(10,10,10,.52);color:#fff;padding:24px;border:2px solid rgba(255,255,255,.7);border-radius:4px;box-shadow:0 12px 50px #0009;backdrop-filter:blur(2px);text-shadow:0 2px 5px #000}.close{position:sticky;float:right;top:0;z-index:3;width:42px;height:42px;border:2px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:28px;cursor:pointer}h2{margin:0 50px 22px 0;font-size:clamp(30px,6vw,62px)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,200px));gap:12px;justify-content:start;align-items:start}.gallery img{width:100%;height:150px;object-fit:cover}.photo-card{appearance:none;display:block;width:100%;padding:6px;background:rgba(0,0,0,.55);color:#fff;border:2px solid #ffffffb8;cursor:zoom-in;text-align:left}.photo-card img{display:block;width:100%;height:140px;object-fit:cover}.photo-card p{margin:6px 2px;font-size:13px;font-weight:700}.photo-card:hover,.photo-card:focus-visible{outline:3px solid #fff;outline-offset:2px}.lightbox{position:fixed;z-index:100;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:54px 70px 70px}.lightbox.open{display:flex}.lightbox img{display:block;max-width:100%;max-height:calc(100vh - 125px);width:auto;height:auto;object-fit:contain;box-shadow:0 8px 50px #000}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;z-index:2;border:2px solid #fff;background:#000a;color:#fff;cursor:pointer;font-weight:900}.lightbox-close{top:14px;right:18px;width:46px;height:46px;font-size:30px}.lightbox-prev,.lightbox-next{top:50%;transform:translateY(-50%);width:50px;height:70px;font-size:36px}.lightbox-prev{left:12px}.lightbox-next{right:12px}.lightbox-caption{position:absolute;left:70px;right:70px;bottom:14px;text-align:center;font-weight:800;text-shadow:0 2px 5px #000}.card{background:rgba(0,0,0,.55);color:#fff;border:2px solid #ffffffb8;padding:7px}.card p{margin:7px 2px;font-weight:700}.links a,.links button{display:block;width:100%;color:#fff;background:rgba(0,0,0,.42);border:2px solid #ffffffb8;padding:12px;margin:8px 0;text-decoration:none;font-weight:800;text-align:left;cursor:pointer;font:800 16px Arial}.map{height:min(68vh,650px);text-shadow:none}.form{display:grid;gap:10px}.form input,.form textarea,.form button{padding:12px;border:2px solid #fff;font:inherit}.form input,.form textarea{background:rgba(0,0,0,.48);color:#fff}.form input::placeholder,.form textarea::placeholder{color:#ffffffc9}.form textarea{min-height:150px}.form button{background:#fff;color:#111;font-weight:900}.big{font-size:clamp(21px,3.5vw,42px);font-weight:800;line-height:1.25}.player{width:100%;aspect-ratio:16/9;border:0;margin-bottom:14px}.status{font-weight:900;margin-top:10px}@media(max-width:760px){html{padding:5px}body{min-height:calc(100vh - 10px);border-width:5px;background-attachment:scroll}.home{min-height:calc(100vh - 20px);padding:12px}.grid{width:100%;height:auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:235px}.tile{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;width:100%;height:105px}.baleti{position:absolute!important;left:50%!important;top:105px!important;transform:translate(-50%,-50%)!important;width:180px;height:180px;z-index:5}.baleti:hover,.baleti:focus-visible{transform:translate(-50%,-50%) scale(1.04)!important}.baleti-ring{inset:-23px;width:calc(100% + 46px);height:calc(100% + 46px)}.baleti-ring text{font-size:15px}.admin{width:88px!important;height:44px!important;justify-self:end;grid-column:2}.modal{inset:5px;border-width:5px;box-shadow:0 0 0 5px #000}.panel{background:rgba(10,10,10,.58)}.lightbox{padding:55px 45px 65px}.lightbox-prev,.lightbox-next{width:40px;height:58px;font-size:30px}.lightbox-caption{left:45px;right:45px}}@media(max-width:420px){.grid{padding-top:210px}.tile{height:96px}.tile span{font-size:13px}.baleti{top:94px!important;width:160px;height:160px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo-card img{height:115px}}@media(prefers-reduced-motion:reduce){.baleti,.baleti:hover .baleti-ring{animation:none}.baleti-flight{transition:none!important}}</style></head><body><main class="home"><nav class="grid"><button class="tile lieu" data-open="map"><span>CARTE</span></button><button class="tile photos" data-open="photos"><span>PHOTOS</span></button><button class="tile video" data-open="videos"><span>VIDÉO</span></button><button class="tile liens" data-open="links"><span>LIENS</span></button><button class="tile message" data-open="messages"><span>MESSAGE</span></button><button class="tile papiers" data-open="papers"><span>PAPIERS</span></button><button class="tile baleti" data-open="baleti" aria-label="Balèti Sauvage"><svg class="baleti-ring" viewBox="0 0 240 240" aria-hidden="true"><defs><path id="baletiCircle" d="M120,120 m-94,0 a94,94 0 1,1 188,0 a94,94 0 1,1 -188,0"/></defs><text><textPath href="#baletiCircle" startOffset="0%">BALÈTI SAUVAGE • BALÈTI SAUVAGE • </textPath></text></svg></button><a class="tile admin" href="admin.html"><span>ADMIN</span></a></nav></main><div class="modal" id="baleti"><section class="panel"><button class="close">×</button><h2>BALÈTI SAUVAGE</h2><div id="baletiText" class="big"></div><div id="next" class="big"></div></section></div><div class="modal" id="photos"><section class="panel"><button class="close">×</button><h2>PHOTOS</h2><div id="photoGallery" class="gallery"></div></section></div><div class="modal" id="videos"><section class="panel"><button class="close">×</button><h2>VIDÉO</h2><div id="videoPlayer"></div><div id="videoGallery" class="gallery"></div></section></div><div class="modal" id="map"><section class="panel"><button class="close">×</button><h2>CARTE</h2><div id="leaflet" class="map"></div></section></div><div class="modal" id="links"><section class="panel"><button class="close">×</button><h2>LIENS</h2><div id="publicLinks" class="links"></div></section></div><div class="modal" id="messages"><section class="panel"><button class="close">×</button><h2>MESSAGE</h2><form id="messageForm" class="form"><input id="name" placeholder="Prénom"><input id="contact" placeholder="Contact"><textarea id="text" placeholder="Message" required></textarea><input id="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button>ENVOYER</button></form><div id="status" class="status"></div></section></div><div class="modal" id="papers"><section class="panel"><button class="close">×</button><h2>PAPIERS</h2><div id="papersContent" class="links"></div><div id="paperStatus" class="status"></div></section></div><div class="lightbox" id="photoLightbox"><button class="lightbox-close" aria-label="Fermer">×</button><button class="lightbox-prev" aria-label="Photo précédente">‹</button><img id="lightboxImage" alt=""><button class="lightbox-next" aria-label="Photo suivante">›</button><div class="lightbox-caption" id="lightboxCaption"></div></div><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',FALLBACK=[43.6108225,3.8766489];let STATE,map,marker,PHOTOS=[],photoIndex=0,baletiAnimating=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nextDate(mode){let n=new Date(),d=new Date(n),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(!x&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function info(){let s=STATE?.settings||{},d=nextDate(s.mode),o=(STATE?.overrides||[]).find(x=>x.event_date===iso(d))||{},pos=Number.isFinite(+o.lat)&&Number.isFinite(+o.lng)?[+o.lat,+o.lng]:Number.isFinite(+s.usualLat)&&Number.isFinite(+s.usualLng)?[+s.usualLat,+s.usualLng]:FALLBACK;return{d,o,pos,time:o.time||(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace||''}}function draw(){let n=info(),date=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(n.d);$('#next').innerHTML='<br>'+(n.o.cancelled?'ANNULÉ<br>':'')+esc(date.toUpperCase())+' · '+esc(n.time.replace(':','H'))+'<br>'+esc(n.place)+(n.o.comment?'<br>'+esc(n.o.comment):'');if(map){map.setView(n.pos,15);if(marker)marker.remove();marker=L.marker(n.pos).addTo(map).bindPopup(esc(n.place))}}function initMap(){let n=info();if(!map){map=L.map('leaflet').setView(n.pos,15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}draw();setTimeout(()=>map.invalidateSize(),100)}function open(id){document.getElementById(id).classList.add('open');if(id==='map')initMap()}function openBaleti(b){if(baletiAnimating)return;baletiAnimating=true;let r=b.getBoundingClientRect(),c=b.cloneNode(true);c.classList.add('baleti-flight');c.style.left=r.left+'px';c.style.top=r.top+'px';c.style.width=r.width+'px';c.style.height=r.height+'px';document.body.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('go')));setTimeout(()=>{open('baleti');c.remove();baletiAnimating=false},520)}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>b.dataset.open==='baleti'?openBaleti(b):open(b.dataset.open));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});function showPhoto(i){if(!PHOTOS.length)return;photoIndex=(i+PHOTOS.length)%PHOTOS.length;let p=PHOTOS[photoIndex];$('#lightboxImage').src=p.url;$('#lightboxImage').alt=p.titre||'Photo';$('#lightboxCaption').innerHTML=esc(p.titre||'')+(p.credit?' · © '+esc(p.credit):'');$('#photoLightbox').classList.add('open')}function closePhoto(){$('#photoLightbox').classList.remove('open');$('#lightboxImage').src=''}$('.lightbox-close').onclick=closePhoto;$('.lightbox-prev').onclick=e=>{e.stopPropagation();showPhoto(photoIndex-1)};$('.lightbox-next').onclick=e=>{e.stopPropagation();showPhoto(photoIndex+1)};$('#photoLightbox').onclick=e=>{if(e.target===$('#photoLightbox'))closePhoto()};document.addEventListener('keydown',e=>{if($('#photoLightbox').classList.contains('open')){if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(photoIndex-1);if(e.key==='ArrowRight')showPhoto(photoIndex+1)}else if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});async function downloadPaper(url,name){let st=$('#paperStatus');st.textContent='Téléchargement…';try{let r=await fetch(url);if(!r.ok)throw Error('document inaccessible');let blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name||'document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);st.textContent='✓ Téléchargement lancé'}catch(e){st.textContent='Impossible de télécharger automatiquement. Ouverture du document…';location.href=url}}function render(j){STATE=j;$('#baletiText').textContent=j.settings?.baletiText||'';draw();PHOTOS=[...(j.photos||[])];$('#photoGallery').innerHTML=PHOTOS.length?PHOTOS.map((p,i)=>'<button class="photo-card" type="button" data-photo="'+i+'"><img src="'+esc(p.url)+'" loading="lazy" alt="'+esc(p.titre||'Photo')+'"><p>'+esc(p.titre||'')+(p.credit?'<br>© '+esc(p.credit):'')+'</p></button>').join(''):'—';document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>showPhoto(+b.dataset.photo));let vs=[...(j.videos||[])].sort((a,b)=>+b.principale-+a.principale);$('#videoGallery').innerHTML=vs.length?vs.map(v=>'<button class="card" data-video="'+esc(v.youtubeId)+'"><img src="https://i.ytimg.com/vi/'+esc(v.youtubeId)+'/hqdefault.jpg" loading="lazy"><p>'+esc(v.titre||'')+'</p></button>').join(''):'—';document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>$('#videoPlayer').innerHTML='<iframe class="player" src="https://www.youtube-nocookie.com/embed/'+b.dataset.video+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>');let ls=j.settings?.links||[];$('#publicLinks').innerHTML=ls.length?ls.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title)+' ↗</a>').join(''):'—';let pa=j.papers||[];$('#papersContent').innerHTML=pa.length?pa.map((x,i)=>'<button type="button" data-paper="'+i+'">'+esc(x.titre||x.nomOriginal||'Document')+' — TÉLÉCHARGER ↓</button>').join(''):'—';document.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{let x=pa[+b.dataset.paper];downloadPaper(x.url,x.nomOriginal||x.fichier)})}$('#messageForm').onsubmit=async e=>{e.preventDefault();$('#status').textContent='…';try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:$('#name').value,contact:$('#contact').value,message:$('#text').value,website:$('#website').value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');$('#status').textContent='✓';e.target.reset()}catch(x){$('#status').textContent='× '+x.message}};(async()=>{try{let r=await fetch(API+'/api/public',{credentials:'include'}),j=await r.json();if(!r.ok||!j.ok)throw Error();render(j)}catch(e){$('#baletiText').textContent='—'}})();</script></body></html>
