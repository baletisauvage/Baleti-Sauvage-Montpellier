const API='https://baleti-sauvage.baletisauvage.workers.dev';let pub={},map;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function habitualDate(mode){let d=new Date(),t=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30,a=(t-d.getDay()+7)%7;if(a===0&&(d.getHours()>h||(d.getHours()===h&&d.getMinutes()>=m)))a=7;d.setDate(d.getDate()+a);d.setHours(h,m,0,0);return d}function key(d){return d.toISOString().slice(0,10)}function eventData(){let s=pub.settings||pub||{},d=habitualDate(s.mode),o=(pub.overrides||[]).find(x=>x.date===key(d))||{};if(o.date){let p=o.date.split('-').map(Number);d=new Date(p[0],p[1]-1,p[2])}return{date:d,time:o.time||(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace||'',lat:Number(o.lat??s.usualLat??43.6108225),lng:Number(o.lng??s.usualLng??3.8766489),comment:o.comment||'',cancelled:!!o.cancelled}}function drawNext(){let e=eventData();$('#nextDate').textContent=e.date.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}).replace('/','·');$('#nextTime').textContent=e.cancelled?'×':e.time.replace(':','H');$('#nextPlace').textContent=e.place}async function load(){try{pub=await(await fetch(API+'/api/public')).json()}catch(e){pub={settings:{mode:'thu',usualPlace:'Montpellier',usualLat:43.6108225,usualLng:3.8766489},photos:[],videos:[]}}drawNext()}function photos(){let a=pub.photos||[];return a.length?'<div class="grid">'+a.map(x=>`<div class="card"><img loading="lazy" src="${esc(x.url||x.src||x.path)}" alt=""></div>`).join('')+'</div>':'<div class="empty">▧</div>'}function videos(){let a=pub.videos||[];return a.length?'<div class="grid">'+a.map(x=>{let u=x.url||'',id=(u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/)||[])[1];return `<a class="card" target="_blank" rel="noopener" href="${esc(u)}">${id?`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="">`:'▶'}</a>`}).join('')+'</div>':'<div class="empty">▶</div>'}function links(){let a=pub.settings?.links||pub.links||[];return '<div class="links">'+a.map(x=>`<a target="_blank" rel="noopener" href="${esc(x.url||x.href)}">${esc(x.label||x.name||'↗')}</a>`).join('')+'</div>'}function event(){let e=eventData();return `<div class="event">${e.cancelled?'× ':''}${e.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · ${esc(e.time)}<small>⌖ ${esc(e.place)} ${esc(e.comment)}</small></div>`}function form(){return `<form class="form" id="msg"><input name="name" placeholder="✎"><textarea name="message" required placeholder="✉"></textarea><button>→</button><div id="status"></div></form>`}function showMap(){let e=eventData();setTimeout(()=>{map&&map.remove();map=L.map('map').setView([e.lat,e.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.circleMarker([e.lat,e.lng],{radius:12,color:'#000',fillColor:'#000',fillOpacity:1}).addTo(map)},40)}function open(t){let n={baleti:'BALÈTI',photos:'▧',videos:'▶',map:'⌖',messages:'✉',follow:'◎',links:'↗',papers:'▤',propose:'+'};$('#heading').textContent=n[t]||'';let h=t==='baleti'?event():t==='photos'?photos():t==='videos'?videos():t==='messages'?form():(t==='links'||t==='follow')?links():t==='map'?'<div id="map" class="map"></div>':`<div class="empty">${n[t]||''}</div>`;$('#content').innerHTML=h;$('#modal').classList.add('open');if(t==='map')showMap();if(t==='messages')$('#msg').onsubmit=send}async function send(e){e.preventDefault();let f=new FormData(e.target),s=$('#status');try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.get('name')||'',message:f.get('message')||''})});s.textContent=r.ok?'✓':'×';r.ok&&e.target.reset()}catch(_){s.textContent='×'}}document.querySelectorAll('.nav').forEach((n,i)=>{n.style.setProperty('--delay',(-i*.23)+'s');n.onclick=()=>open(n.dataset.open);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(n.dataset.open)}}});$('#next').onclick=()=>open('baleti');$('#close').onclick=()=>$('#modal').classList.remove('open');document.addEventListener('keydown',e=>e.key==='Escape'&&$('#modal').classList.remove('open'));load();
