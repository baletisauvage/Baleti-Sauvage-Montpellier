mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(!x&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function fmt(d){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)}function initMap(c){map=L.map('map',{minZoom:13,maxZoom:19,zoomControl:true,scrollWheelZoom:true,dragging:true,touchZoom:true,doubleClickZoom:true,boxZoom:true}).setView(c,15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(true),120)}function draw(s,ovs){let d=nextDate(s.mode),key=iso(d),o=ovs.find(x=>x.event_date===key)||{},base=valid(s.usualLat,s.usualLng)?[+s.usualLat,+s.usualLng]:FALLBACK,pos=valid(o.lat,o.lng)?[+o.lat,+o.lng]:base,time=o.time||(s.mode==='sun'?'14:00':'21:30');if(!map)initMap(pos);else{map.setView(pos,15);map.invalidateSize(true)}L.marker(pos,{icon:L.divIcon({className:'',iconSize:[1,1],html:`<div class="pin-card"><strong>${o.cancelled?'ANNULÉ':'PROCHAIN BALÈTI'}</strong><br>${fmt(d).toUpperCase()}<em>${time.replace(':','H')}</em></div>`})}).addTo(map).bindPopup(`<strong>${E(o.place||s.usualPlace||'')}</strong>${o.comment?'<br>'+E(o.comment):''}`)}function renderPhotos(ps){let g=document.getElementById('photoGallery');g.innerHTML=ps.length?ps.map((p,i)=>`<figure class="photo-card ${p.principale?'main':''}" data-i="${i}"><img src="${E(p.url)}" loading="lazy"><figcaption>${E(p.titre||'')}${p.credit?'<br>© '+E(p.credit):''}</figcaption></figure>`).join(''):'<p>Aucune photo pour le moment.</p>';g.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let p=ps[+x.dataset.i];lbimg.src=p.url;lbinfo.innerHTML=E(p.titre||'')+(p.credit?'<br>© '+E(p.credit):'');lightbox.classList.add('open')})}function renderVideos(vs){let g=document.getElementById('videoGallery'),list=[...vs].sort((a,b)=>+b.principale-+a.principale);g.innerHTML=list.length?list.map((v,i)=>`<article class="video-card ${v.principale?'main':''}" data-v="${i}"><img src="https://i.ytimg.com/vi/${E(v.youtubeId)}/hqdefault.jpg"><div class="video-info"><strong>${E(v.titre)}</strong>${v.evenement?'<br>'+E(v.evenement):''}</div></article>`).join(''):'<p>Aucune vidéo pour le moment.</p>';g.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{videoFrame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(list[+x.dataset.v].youtubeId)+'?autoplay=1&rel=0';videoPlayer.classList.add('open')})}function renderLinks(ls){publicLinks.innerHTML=ls.length?ls.map(x=>`<a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.title)}</a>`).join(''):'<p>Aucun lien pour le moment.</p>'}async function load(){try{let r=await fetch(API+'/api/public',{cache:'no-store'}),j=await r.json();baletiText.textContent=j.settings.baletiText||'';renderPhotos(j.photos||[]);renderVideos(j.videos||[]);renderLinks(j.settings.links||[]);draw(j.settings,j.overrides||[])}catch(e){if(!map)initMap(FALLBACK)}}document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.modal).classList.add('open'));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>{let m=b.closest('.modal');if(m.id==='videosModal'){videoFrame.src='';videoPlayer.classList.remove('open')}m.classList.remove('open')});document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});document.querySelector('.lbclose').onclick=()=>lightbox.classList.remove('open');messageForm.onsubmit=async e=>{e.preventDefault();messageStatus.textContent='Envoi…';try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:messageName.value,contact:messageContact.value,message:messageText.value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');messageForm.reset();messageStatus.textContent='Message envoyé. Merci !'}catch(x){messageStatus.textContent='Erreur : '+x.message}};load();</script></body></html>
