<style>

% 0,50% 50%,55% 0,60% 50%,65% 0,70% 50%,75% 0,80% 50%,85% 0,90% 50%,95% 0,100% 50%,100% 100%,0 100%)}.deck{position:absolute;left:8%;right:8%;bottom:0;height:11%;border:5px solid;background:#fff}.post{position:absolute;top:24%;bottom:9%;width:3%;background:#111}.p1{left:12%}.p2{left:31%}.p3{right:31%}.p4{right:12%}.rail{position:absolute;left:9%;right:9%;bottom:15%;height:23%;border:5px solid;border-top-width:8px;background:repeating-linear-gradient(90deg,transparent 0 36px,#111 37px 42px)}.crowd{position:absolute;z-index:8;inset:28% 5% 8%;pointer-events:none}.person{position:absolute;width:58px;height:150px;transform-origin:50% 100%;animation:sway var(--d,2.2s) ease-in-out infinite alternate}.head{position:absolute;left:17px;top:0;width:29px;height:31px;border:4px solid;border-radius:48% 52% 46% 54%;background:#fff}.hair{position:absolute;left:13px;top:-7px;width:38px;height:21px;background:#111;clip-path:polygon(0 100%,12% 25%,28% 70%,42% 0,58% 72%,75% 12%,88% 70%,100% 20%,94% 100%)}.body{position:absolute;left:8px;top:28px;width:48px;height:70px;border:4px solid;background:#fff;clip-path:polygon(17% 0,83% 0,100% 100%,0 100%)}.leg{position:absolute;top:93px;width:10px;height:53px;background:#111}.leg.a{left:15px;transform:rotate(4deg)}.leg.b{right:13px;transform:rotate(-5deg)}.arm{position:absolute;top:42px;width:9px;height:58px;background:#111;transform-origin:50% 0}.arm.a{left:3px;transform:rotate(19deg)}.arm.b{right:-1px;transform:rotate(-24deg)}.beer{position:absolute;right:-9px;top:91px;width:10px;height:24px;border:3px solid;background:#fff}.fat{width:82px}.fat .body{left:3px;width:72px;border-radius:45% 45% 20% 20%}.short{transform:scale(.78);transform-origin:50% 100%}.punk .hair{height:33px;top:-21px;clip-path:polygon(0 100%,14% 40%,26% 100%,40% 0,53% 100%,67% 17%,78% 100%,100% 50%,91% 100%)}.dress .body{height:79px;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}.dress .leg{top:104px}.seated{transform:rotate(-3deg) scale(.9);transform-origin:50% 100%}.seated .leg{top:90px;height:42px;transform:rotate(66deg)}.musician:after{content:"◉";position:absolute;left:-16px;top:43px;font-size:47px;background:#fff;border:3px solid;line-height:.8;border-radius:20%}.nav-person{pointer-events:auto;cursor:pointer}.sign{position:absolute;z-index:3;left:50%;top:-43px;transform:translateX(-50%) rotate(var(--r,-3deg));min-width:74px;padding:7px 10px;border:4px solid;background:#fff;text-align:center;font-size:18px;line-height:1;box-shadow:5px 5px 0 #111;transition:.2s}.nav-person:hover .sign,.nav-person:focus-within .sign{transform:translateX(-50%) translateY(-13px) rotate(1deg) scale(1.12);background:#111;color:#fff}.nav-person:hover{animation-play-state:paused}.nav-person button{all:unset;position:absolute;inset:0;cursor:pointer}.c1{left:4%;bottom:2%;--d:1.8s}.c2{left:13%;bottom:12%;--d:2.6s}.c3{left:22%;bottom:0;--d:2.1s}.c4{left:31%;bottom:17%;--d:1.7s}.c5{left:42%;bottom:3%;--d:2.8s}.c6{left:53%;bottom:15%;--d:2.2s}.c7{left:64%;bottom:1%;--d:1.9s}.c8{left:74%;bottom:14%;--d:2.5s}.c9{left:84%;bottom:2%;--d:1.6s}.c10{left:92%;bottom:13%;--d:2.3s}.inside1{left:39%;bottom:31%;transform:scale(.74);--d:1.9s}.inside2{left:47%;bottom:29%;transform:scale(.68);--d:2.5s}.inside3{left:56%;bottom:30%;transform:scale(.72);--d:2s}.inside4{left:63%;bottom:29%;transform:scale(.65);--d:2.7s}@keyframes sway{from{rotate:-2deg;translate:0 0}to{rotate:2deg;translate:1px -4px}}.next{position:fixed;z-index:100;left:0;right:0;bottom:0;height:62px;border-top:5px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;gap:clamp(9px,2vw,28px);padding:5px 62px 5px 12px;font-size:clamp(13px,2vw,25px);cursor:pointer}.pulse{width:17px;height:17px;border-radius:50%;background:#111;animation:pulse 1.5s infinite}.next-place{font-family:system-ui,sans-serif;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}@keyframes pulse{50%{transform:scale(.45);opacity:.35}}.admin{position:fixed;z-index:110;right:12px;bottom:9px;width:40px;height:40px;border:3px solid;background:#fff;color:#111;display:grid;place-items:center;text-decoration:none;font-size:18px;transform:rotate(2deg)}.modal{position:fixed;z-index:90;inset:0 0 62px;background:rgba(245,242,232,.96);display:none;overflow:auto;padding:clamp(15px,4vw,55px)}.modal.open{display:block}.close{position:fixed;z-index:101;right:18px;top:14px;width:52px;height:52px;border:4px solid;background:#fff;font-size:30px;cursor:pointer;transform:rotate(3deg)}.panel{max-width:1120px;margin:auto;padding:28px}.panel h2{font-size:clamp(36px,8vw,100px);margin:0 0 25px;line-height:.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.photo-card,.video-card,.paper-card{border:5px solid;background:#fff;padding:8px;box-shadow:8px 8px 0 #111;transform:rotate(var(--rr,-1deg))}.photo-card img,.video-card img{display:block;width:100%;height:230px;object-fit:cover;filter:grayscale(1) contrast(1.2)}.photo-card.main,.video-card.main{grid-column:span 2}.photo-card.main img,.video-card.main img{height:360px}.link-list{display:flex;flex-wrap:wrap;gap:16px}.link-list a,.biglink{border:5px solid #111;background:#fff;color:#111;text-decoration:none;padding:16px 20px;font-size:clamp(20px,3vw,40px);box-shadow:7px 7px 0 #111}.map{height:min(70vh,650px);border:6px solid #111;filter:grayscale(1) contrast(1.15)}.leaflet-control-attribution{font-size:9px!important}.form{display:grid;gap:14px;max-width:700px}.form input,.form textarea{border:5px solid #111;background:#fff;padding:14px;font-family:system-ui,sans-serif;font-weight:800}.form textarea{min-height:170px}.form button{border:5px solid;background:#111;color:#fff;padding:14px;cursor:pointer}.status{font-family:system-ui,sans-serif;font-weight:900}.baleti-card{border:6px solid;background:#fff;padding:25px;box-shadow:10px 10px 0 #111;font-size:clamp(22px,4vw,52px)}.baleti-card small{display:block;font-family:system-ui,sans-serif;font-size:.4em;margin-top:16px}.paper-card{min-height:220px;display:grid;place-items:center;font-size:64px}.principles{position:absolute;z-index:10;left:1.5%;top:2%;display:flex;gap:8px}.principles span{border:3px solid;padding:5px;background:#fff;font-size:13px;transform:rotate(-2deg)}@media(max-width:720px){.scene{inset:0 0 54px}.next{height:54px;font-size:12px;gap:8px;justify-content:flex-start}.next-place{display:none}.admin{width:36px;height:36px;bottom:9px}.modal{inset:0 0 54px}.panel{padding:16px}.title{top:7%}.kiosk{width:78vw;height:50%;bottom:22%}.tree{width:27%}.crowd{inset:34% 1% 5%;transform:scale(.76);transform-origin:50% 100%}.c10,.inside4{display:none}.photo-card.main,.video-card.main{grid-column:auto}.photo-card.main img,.video-card.main img{height:190px}.sign{font-size:17px}.principles{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene" aria-label="Balèti Sauvage">
<div class="principles"><span>0€</span><span>↔</span><span>☮</span><span>∅ PARTI</span></div><div class="title">BALÈTI SAUVAGE</div><div class="moon"></div><div class="tree t1"></div><div class="tree t2"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="ground"></div>

<div id="modal" class="modal"><button class="close" id="close" aria-label="Fermer">×</button><section class="panel" id="panel"></section></div>
<div class="next" id="next" role="button" tabindex="0"><i class="pulse"></i><b>BALÈTI</b><strong id="nextDate">…</strong><strong id="nextTime"></strong><span class="next-place" id="nextPlace"></span><b>⌖</b></div><a class="admin" href="admin.html" title="Administration" aria-label="Administration">⚙</a>
<script>
const API='https://baleti-sauvage.baletisauvage.workers.dev',FALLBACK=[43.6108225,3.8766489];let map,marker,STATE=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function personNoise(){document.querySelectorAll('.person').forEach((p,i)=>{p.style.setProperty('--d',(1.55+(i%7)*.19)+'s')})}personNoise();
function openPanel(type){let p=$('#panel'),html='';if(type==='baleti')html='<h2>BALÈTI</h2><div class="baleti-card"><div id="baletiText">'+esc(STATE?.settings?.baletiText||'')+'</div><small id="baletiNext"></small></div>';if(type==='photos')html='<h2>▧</h2><div class="grid" id="photos"></div>';if(type==='videos')html='<h2>▶</h2><div class="grid" id="videos"></div>';if(type==='map')html='<h2>⌖</h2><div id="map" class="map"></div>';if(type==='messages')html='<h2>✉</h2><form class="form" id="messageForm"><input id="messageName" maxlength="80" placeholder="PRÉNOM" required><input id="messageContact" maxlength="120" placeholder="CONTACT"><textarea id="messageText" maxlength="3000" placeholder="…" required></textarea><input id="website" tabindex="-1" autocomplete="off" style="display:none"><button>✉</button><div class="status" id="messageStatus"></div></form>';if(type==='follow')html='<h2>◎</h2><div class="link-list" id="followLinks"></div>';if(type==='links')html='<h2>↗</h2><div class="link-list" id="links"></div>';if(type==='papers')html='<h2>▤</h2><div class="grid"><div class="paper-card">▤</div><div class="paper-card">✎</div><div class="paper-card">▧</div></div>';if(type==='propose')html='<h2>+</h2><div class="baleti-card">⌖ + 📅 + ⏱<small>PROPOSITION BALÈTI</small></div>';p.innerHTML=html;$('#modal').classList.add('open');renderCurrent(type)}
function renderCurrent(type){if(type==='photos')renderPhotos(STATE?.photos||[]);if(type==='videos')renderVideos(STATE?.videos||[]);if(type==='links')renderLinks(STATE?.settings?.links||[],'#links');if(type==='follow')renderLinks(STATE?.settings?.follow||STATE?.settings?.links||[],'#followLinks');if(type==='map')setTimeout(initMap,30);if(type==='messages')bindMessage();if(type==='baleti'){let n=$('#baletiNext');if(n)n.textContent=[$('#nextDate').textContent,$('#nextTime').textContent,$('#nextPlace').textContent].filter(Boolean).join(' · ')}}
function closePanel(){$('#modal').classList.remove('open');if(map){map.remove();map=null}}
document.querySelectorAll('[data-open]').forEach(x=>x.addEventListener('click',()=>openPanel(x.dataset.open)));$('#close').onclick=closePanel;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
function renderPhotos(a){let el=$('#photos');if(!el)return;el.innerHTML=a.filter(x=>x.visible!==false).map((x,i)=>'<article class="photo-card '+(x.principale?'main':'')+'" style="--rr:'+(i%2?2:-2)+'deg"><img loading="lazy" src="'+esc(x.url||('photos/'+x.fichier))+'" alt="'+esc(x.titre||'')+'"></article>').join('')||'<div class="paper-card">▧</div>'}
function videoThumb(x){return x.thumbnail||x.miniature||x.image||''}function videoUrl(x){return x.url||x.lien||x.youtube||''}function renderVideos(a){let el=$('#videos');if(!el)return;el.innerHTML=a.filter(x=>x.visible!==false).map((x,i)=>{let u=videoUrl(x),im=videoThumb(x);return '<a class="video-card '+(x.principale?'main':'')+'" style="--rr:'+(i%2?-2:2)+'deg" href="'+esc(u)+'" target="_blank" rel="noopener">'+(im?'<img loading="lazy" src="'+esc(im)+'" alt="">':'<div class="paper-card">▶</div>')+'</a>'}).join('')||'<div class="paper-card">▶</div>'}
function normalizeLinks(a){if(!Array.isArray(a))return[];return a.map(x=>typeof x==='string'?{url:x,label:'↗'}:x)}function renderLinks(a,target='#links'){let el=$(target);if(!el)return;el.innerHTML=normalizeLinks(a).filter(x=>x.url||x.lien).map(x=>'<a href="'+esc(x.url||x.lien)+'" target="_blank" rel="noopener">'+esc(x.label||x.nom||x.titre||'↗')+'</a>').join('')||'<span class="biglink">↗</span>'}
function bindMessage(){let f=$('#messageForm');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();let status=$('#messageStatus');status.textContent='…';try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:$('#messageName').value,contact:$('#messageContact').value,message:$('#messageText').value,website:$('#website').value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');status.textContent='✓';e.target.reset()}catch(err){status.textContent='×'}})}
function initMap(){let el=$('#map');if(!el||map)return;let s=STATE?.settings||{},lat=Number(s.lat||s.latitude||FALLBACK[0]),lng=Number(s.lng||s.longitude||FALLBACK[1]);map=L.map(el,{zoomControl:true}).setView([lat,lng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);marker=L.circleMarker([lat,lng],{radius:11,color:'#000',weight:4,fillColor:'#fff',fillOpacity:1}).addTo(map)}
function parseDay(s){let d=new Date(s);return isNaN(d)?null:d}function nextFrom(settings,overrides){let now=new Date(),best=null;for(let o of overrides||[]){let d=parseDay(o.event_date||o.date);if(d&&d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&!o.cancelled&&(!best||d<best.d))best={d,o}}if(!best&&settings.nextDate){let d=parseDay(settings.nextDate);if(d)best={d,o:{}}}return best}function updateNext(settings,overrides){let n=nextFrom(settings,overrides),d=n?.d,o=n?.o||{};$('#nextDate').textContent=d?d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}):(settings.nextDate||'…');$('#nextTime').textContent=o.time||settings.time||settings.heure||'';$('#nextPlace').textContent=o.place||settings.place||settings.lieu||''}
$('#next').onclick=()=>openPanel('baleti');$('#next').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openPanel('baleti')};
(async()=>{try{let r=await fetch(API+'/api/public',{credentials:'include'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');STATE=j;updateNext(j.settings||{},j.overrides||[])}catch(e){$('#nextDate').textContent='—';console.error(e)}})();
</script>
