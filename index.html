<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balèti Sauvage Montpellier</title><link rel="icon" href="favicon_baleti_original.ico"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}html{margin:0;min-height:100%;background:#000;padding:10px}body{margin:0;min-height:calc(100vh - 20px);font-family:Arial,sans-serif;color:#fff;border:8px solid #000;background:linear-gradient(#0002,#0004),url('assets/site-bg.jpg') center/cover fixed no-repeat}.home{min-height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,90px)}.grid{width:min(900px,86vw);display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(18px,3vw,38px)}.tile{appearance:none;position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:clamp(120px,18vh,170px);overflow:hidden;border:2px solid #ffffffd9;border-radius:5px;background-position:center;background-size:cover;color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 8px 28px #0007;padding:0;transition:.16s;grid-column:span 2}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 42%,#000d)}.tile span{position:relative;z-index:1;width:100%;padding:17px 7px 13px;text-align:center;font:900 clamp(17px,2vw,25px)/1 Arial;letter-spacing:.035em;text-shadow:0 2px 5px #000}.tile:hover,.tile:focus-visible{transform:scale(1.035);outline:3px solid #fff;outline-offset:2px}.lieu{background-image:url('assets/lieu.jpg')}.photos{background-image:url('assets/photos.jpg')}.video{background-image:url('assets/video.jpg')}.liens{background-image:url('assets/liens.jpg')}.message{background-image:url('assets/message.jpg')}.papiers{background-image:url('assets/papiers.jpg')}.baleti{background-image:url('assets/baleti-sauvage.jpg');grid-column:2/4}.admin{background-image:url('assets/admin.jpg');grid-column:4/6}.modal{position:fixed;z-index:50;inset:0;display:none;padding:16px;overflow:auto;background-position:center;background-size:cover;background-repeat:no-repeat}.modal.open{display:grid;place-items:center}#map{background-image:linear-gradient(#0005,#0008),url('assets/lieu.jpg')}#photos{background-image:linear-gradient(#0005,#0008),url('assets/photos.jpg')}#videos{background-image:linear-gradient(#0005,#0008),url('assets/video.jpg')}#baleti{background-image:linear-gradient(#0005,#0008),url('assets/baleti-sauvage.jpg')}#links{background-image:linear-gradient(#0005,#0008),url('assets/liens.jpg')}#messages{background-image:linear-gradient(#0005,#0008),url('assets/message.jpg')}#papers{background-image:linear-gradient(#0005,#0008),url('assets/papiers.jpg')}.panel{position:relative;width:min(950px,96vw);max-height:92vh;overflow:auto;background:#f4f0e6e8;color:#111;padding:24px;border-radius:4px;box-shadow:0 12px 50px #0008;backdrop-filter:blur(3px)}.close{position:sticky;float:right;top:0;z-index:3;width:42px;height:42px;border:2px solid #111;background:#fff;font-size:28px;cursor:pointer}h2{margin:0 50px 22px 0;font-size:clamp(30px,6vw,62px)}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.gallery img{width:100%;height:210px;object-fit:cover}.card{background:#fff;border:2px solid #111;padding:7px}.card p{margin:7px 2px;font-weight:700}.links a{display:block;color:#111;border:2px solid #111;padding:12px;margin:8px 0;text-decoration:none;font-weight:800}.map{height:min(68vh,650px)}.form{display:grid;gap:10px}.form input,.form textarea,.form button{padding:12px;border:2px solid #111;font:inherit}.form textarea{min-height:150px}.form button{background:#111;color:#fff;font-weight:900}.big{font-size:clamp(21px,3.5vw,42px);font-weight:800;line-height:1.25}.player{width:100%;aspect-ratio:16/9;border:0;margin-bottom:14px}.status{font-weight:900;margin-top:10px}@media(max-width:760px){html{padding:5px}body{min-height:calc(100vh - 10px);border-width:5px;background-attachment:scroll}.home{min-height:calc(100vh - 20px);align-items:flex-start;padding:16px 10px}.grid{width:100%;grid-template-columns:repeat(2,1fr);gap:12px}.tile{grid-column:auto;min-height:150px}.tile span{font-size:17px;padding:15px 6px 12px}.baleti,.admin{grid-column:auto}}@media(max-width:420px){.tile{min-height:135px}.tile span{font-size:15px}}</style></head><body><main class="home"><nav class="grid"><button class="tile lieu" data-open="map"><span>CARTE</span></button><button class="tile photos" data-open="photos"><span>PHOTOS</span></button><button class="tile video" data-open="videos"><span>VIDÉO</span></button><button class="tile liens" data-open="links"><span>LIENS</span></button><button class="tile message" data-open="messages"><span>MESSAGE</span></button><button class="tile papiers" data-open="papers"><span>PAPIERS</span></button><button class="tile baleti" data-open="baleti"><span>BALÈTI SAUVAGE</span></button><a class="tile admin" href="admin.html"><span>ADMIN</span></a></nav></main><div class="modal" id="baleti"><section class="panel"><button class="close">×</button><h2>BALÈTI SAUVAGE</h2><div id="baletiText" class="big"></div><div id="next" class="big"></div></section></div><div class="modal" id="photos"><section class="panel"><button class="close">×</button><h2>PHOTOS</h2><div id="photoGallery" class="gallery"></div></section></div><div class="modal" id="videos"><section class="panel"><button class="close">×</button><h2>VIDÉO</h2><div id="videoPlayer"></div><div id="videoGallery" class="gallery"></div></section></div><div class="modal" id="map"><section class="panel"><button class="close">×</button><h2>CARTE</h2><div id="leaflet" class="map"></div></section></div><div class="modal" id="links"><section class="panel"><button class="close">×</button><h2>LIENS</h2><div id="publicLinks" class="links"></div></section></div><div class="modal" id="messages"><section class="panel"><button class="close">×</button><h2>MESSAGE</h2><form id="messageForm" class="form"><input id="name" placeholder="Prénom"><input id="contact" placeholder="Contact"><textarea id="text" placeholder="Message" required></textarea><input id="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button>ENVOYER</button></form><div id="status" class="status"></div></section></div><div class="modal" id="papers"><section class="panel"><button class="close">×</button><h2>PAPIERS</h2><div id="papersContent" class="big">—</div></section></div><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',FALLBACK=[43.6108225,3.8766489];let STATE,map,marker;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nextDate(mode){let n=new Date(),d=new Date(n),day=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30;d.setHours(h,m,0,0);let x=(day-d.getDay()+7)%7;if(!x&&d<=n)x=7;d.setDate(d.getDate()+x);return d}function info(){let s=STATE?.settings||{},d=nextDate(s.mode),o=(STATE?.overrides||[]).find(x=>x.event_date===iso(d))||{},pos=Number.isFinite(+o.lat)&&Number.isFinite(+o.lng)?[+o.lat,+o.lng]:Number.isFinite(+s.usualLat)&&Number.isFinite(+s.usualLng)?[+s.usualLat,+s.usualLng]:FALLBACK;return{d,o,pos,time:o.time||(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace||''}}function draw(){let n=info(),date=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(n.d);$('#next').innerHTML='<br>'+(n.o.cancelled?'ANNULÉ<br>':'')+esc(date.toUpperCase())+' · '+esc(n.time.replace(':','H'))+'<br>'+esc(n.place)+(n.o.comment?'<br>'+esc(n.o.comment):'');if(map){map.setView(n.pos,15);if(marker)marker.remove();marker=L.marker(n.pos).addTo(map).bindPopup(esc(n.place))}}function initMap(){let n=info();if(!map){map=L.map('leaflet').setView(n.pos,15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}draw();setTimeout(()=>map.invalidateSize(),100)}function open(id){document.getElementById(id).classList.add('open');if(id==='map')initMap()}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});function render(j){STATE=j;$('#baletiText').textContent=j.settings?.baletiText||'';draw();let ps=j.photos||[];$('#photoGallery').innerHTML=ps.length?ps.map(p=>'<div class="card"><img src="'+esc(p.url)+'" loading="lazy"><p>'+esc(p.titre||'')+(p.credit?'<br>© '+esc(p.credit):'')+'</p></div>').join(''):'—';let vs=[...(j.videos||[])].sort((a,b)=>+b.principale-+a.principale);$('#videoGallery').innerHTML=vs.length?vs.map(v=>'<button class="card" data-video="'+esc(v.youtubeId)+'"><img src="https://i.ytimg.com/vi/'+esc(v.youtubeId)+'/hqdefault.jpg" loading="lazy"><p>'+esc(v.titre||'')+'</p></button>').join(''):'—';document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>$('#videoPlayer').innerHTML='<iframe class="player" src="https://www.youtube-nocookie.com/embed/'+b.dataset.video+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>');let ls=j.settings?.links||[];$('#publicLinks').innerHTML=ls.length?ls.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title)+' ↗</a>').join(''):'—'}$('#messageForm').onsubmit=async e=>{e.preventDefault();$('#status').textContent='…';try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:$('#name').value,contact:$('#contact').value,message:$('#text').value,website:$('#website').value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur');$('#status').textContent='✓';e.target.reset()}catch(x){$('#status').textContent='× '+x.message}};(async()=>{try{let r=await fetch(API+'/api/public',{credentials:'include'}),j=await r.json();if(!r.ok||!j.ok)throw Error();render(j)}catch(e){$('#baletiText').textContent='—'}})();</script></body></html>
