<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balèti Sauvage Montpellier</title><link rel="icon" href="favicon_baleti_original.ico"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#0a0a0a;font-family:Arial,sans-serif}.scene{position:fixed;inset:0 0 58px;background:#f6f2e8;overflow:hidden}.scene svg{width:100%;height:100%;display:block}.ink{fill:#0a0a0a}.paper{fill:#f6f2e8}.stroke{fill:none;stroke:#0a0a0a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fine{stroke-width:3}.crowd>g{transform-box:fill-box;transform-origin:center bottom;animation:sway var(--t,3.4s) ease-in-out infinite alternate}.dance{--t:1.5s}.slow{--t:4.8s}.sign{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:.16s}.sign:hover,.sign:focus{transform:translateY(-14px) rotate(-3deg) scale(1.08)}.sign text{font:900 24px Arial,sans-serif}.sign:hover path{fill:#0a0a0a}.sign:hover text{fill:#fff}.lampglow{fill:#fff;opacity:.48}.bellows{animation:squeeze 1.1s steps(2) infinite alternate;transform-box:fill-box;transform-origin:center}.beer{animation:toast 3.5s steps(3) infinite;transform-box:fill-box;transform-origin:bottom}.scratch{opacity:.12}.next{position:fixed;z-index:90;left:0;right:0;bottom:0;height:58px;border:5px solid #0a0a0a;border-left:0;border-right:0;background:#fff;display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 58px 4px 12px;cursor:pointer;font:900 clamp(14px,2vw,24px) Arial,sans-serif}.dot{width:16px;height:16px;border-radius:50%;background:#0a0a0a;animation:pulse 1.5s infinite}.place{max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:14px}.admin{position:fixed;z-index:100;right:11px;bottom:10px;width:38px;height:38px;border:3px solid;background:#fff;color:#0a0a0a;text-decoration:none;display:grid;place-items:center}.modal{position:fixed;z-index:80;inset:0 0 58px;background:rgba(246,242,232,.98);display:none;overflow:auto;padding:clamp(18px,4vw,60px)}.modal.open{display:block}.close{position:fixed;z-index:85;right:18px;top:14px;width:50px;height:50px;border:4px solid;background:#fff;font-size:28px}.panel{max-width:1100px;margin:auto}.panel h2{font-size:clamp(45px,9vw,110px);margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{border:5px solid;background:#fff;padding:9px}.card img{width:100%;height:240px;object-fit:cover;filter:grayscale(1) contrast(1.3)}.links{display:flex;flex-wrap:wrap;gap:15px}.links a{border:5px solid;background:#fff;color:#111;text-decoration:none;padding:14px 18px;font-size:28px}.map{height:min(70vh,650px);border:6px solid;filter:grayscale(1) contrast(1.2)}.form{display:grid;gap:13px;max-width:700px}.form input,.form textarea{border:5px solid;padding:13px;background:#fff;font:800 16px Arial}.form textarea{min-height:160px}.form button{border:5px solid;background:#111;color:#fff;padding:13px}.event{border:6px solid;background:#fff;padding:25px;font-size:clamp(22px,4vw,50px)}.event small{display:block;font-size:.4em;margin-top:14px}.empty{font-size:70px}@keyframes sway{to{transform:rotate(2deg) translateY(-4px)}}@keyframes squeeze{to{transform:scaleX(.7)}}@keyframes toast{45%,60%{transform:rotate(-25deg) translateY(-12px)}}@keyframes pulse{50%{transform:scale(.45);opacity:.35}}@media(max-width:720px){.scene{inset:0 0 54px}.next{height:54px;justify-content:flex-start;gap:8px;font-size:12px}.place{display:none}.modal{inset:0 0 54px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="scene"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><pattern id="h" width "820" cy="672" rx="28" ry="39" class="paper" stroke="#0a0a0a" stroke-width="6"/><path class="ink" d="M785 716q36-23 72 0l2 170h-77z"/></g><g><circle cx="950" cy="715" r="31" class="paper" stroke="#0a0a0a" stroke-width="6"/><path class="paper" stroke="#0a0a0a" stroke-width="6" d="M911 754q40-26 81 1l15 130h-111z"/></g><g class="dance"><ellipse cx="1195" cy="660" rx="35" ry="42" class="paper" stroke="#0a0a0a" stroke-width="6"/><path class="ink" d="M1148 710q48-29 96 1l24 176h-142z"/></g><g class="slow"><circle cx="1380" cy="700" r="27" class="paper" stroke="#0a0a0a" stroke-width="6"/><path class="paper" stroke="#0a0a0a" stroke-width="6" d="M1344 735q37-21 74 1l9 150h-94z"/></g></g><!-- pancartes tenues, pas une rangée --><g class="sign" tabindex="0" data-open="baleti" transform="translate(80 520) rotate(-7)"><path d="M0 5l155-5 5 62L7 69z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="80" y="45" text-anchor="middle">BALÈTI</text></g><g class="sign" tabindex="0" data-open="photos" transform="translate(250 580) rotate(5)"><path d="M0 3l80-3 4 58-80 6z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="42" y="42" text-anchor="middle">▧</text></g><g class="sign" tabindex="0" data-open="videos" transform="translate(410 650) rotate(-4)"><path d="M0 0l80 5-4 58L2 57z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="40" y="42" text-anchor="middle">▶</text></g><g class="sign" tabindex="0" data-open="map" transform="translate(615 690) rotate(6)"><path d="M0 5l82-5 4 60-81 3z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="42" y="42" text-anchor="middle">⌖</text></g><g class="sign" tabindex="0" data-open="messages" transform="translate(790 620) rotate(-5)"><path d="M2 0l80 4-3 59L0 58z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="41" y="42" text-anchor="middle">✉</text></g><g class="sign" tabindex="0" data-open="follow" transform="translate(930 680) rotate(4)"><path d="M0 3l82-3 4 59-82 4z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="42" y="42" text-anchor="middle">◎</text></g><g class="sign" tabindex="0" data-open="links" transform="translate(1160 610) rotate(-6)"><path d="M2 0l80 5-4 58L0 58z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="41" y="42" text-anchor="middle">↗</text></g><g class="sign" tabindex="0" data-open="papers" transform="translate(1325 670) rotate(7)"><path d="M0 4l82-4 4 59-82 4z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="42" y="42" text-anchor="middle">▤</text></g><g class="sign" tabindex="0" data-open="propose" transform="translate(1450 560) rotate(-5)"><path d="M2 0l80 4-3 59L0 57z" class="paper" stroke="#0a0a0a" stroke-width="6"/><text x="41" y="42" text-anchor="middle">+</text></g></svg></main><button class="next" id="next"><span class="dot"></span><b>BALÈTI</b><span id="nextDate">—</span><span id="nextTime">—</span><span>⌖</span><span class="place" id="nextPlace"></span></button><a class="admin" href="admin.html">⚙</a><div id="modal" class="modal"><button class="close" id="close">×</button><div class="panel"><h2 id="heading"></h2><div id="content"></div></div></div><script>const API='https://baleti-sauvage.baletisauvage.workers.dev';let pub={},map;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function habitualDate(mode){let d=new Date(),t=mode==='sun'?0:4,h=mode==='sun'?14:21,m=mode==='sun'?0:30,a=(t-d.getDay()+7)%7;if(a===0&&(d.getHours()>h||(d.getHours()===h&&d.getMinutes()>=m)))a=7;d.setDate(d.getDate()+a);d.setHours(h,m,0,0);return d}function key(d){return d.toISOString().slice(0,10)}function eventData(){let s=pub.settings||pub||{},d=habitualDate(s.mode),o=(pub.overrides||[]).find(x=>x.date===key(d))||{};if(o.date){let p=o.date.split('-').map(Number);d=new Date(p[0],p[1]-1,p[2])}return{date:d,time:o.time||(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace||'',lat:Number(o.lat??s.usualLat??43.6108225),lng:Number(o.lng??s.usualLng??3.8766489),comment:o.comment||'',cancelled:!!o.cancelled}}function drawNext(){let e=eventData();$('#nextDate').textContent=e.date.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}).replace('/','·');$('#nextTime').textContent=e.cancelled?'×':e.time.replace(':','H');$('#nextPlace').textContent=e.place}async function load(){try{pub=await(await fetch(API+'/api/public')).json()}catch(e){pub={settings:{mode:'thu',usualPlace:'Montpellier',usualLat:43.6108225,usualLng:3.8766489},photos:[],videos:[]}}drawNext()}function photos(){let a=pub.photos||[];return a.length?'<div class="grid">'+a.map(x=>`<div class="card"><img src="${esc(x.url||x.src||x.path)}" alt=""></div>`).join('')+'</div>':'<div class="empty">▧</div>'}function videos(){let a=pub.videos||[];return a.length?'<div class="grid">'+a.map(x=>`<a class="card" target="_blank" rel="noopener" href="${esc(x.url||'')}">▶</a>`).join('')+'</div>':'<div class="empty">▶</div>'}function links(){let a=pub.settings?.links||pub.links||[];return '<div class="links">'+a.map(x=>`<a target="_blank" rel="noopener" href="${esc(x.url||x.href)}">${esc(x.label||x.name||'↗')}</a>`).join('')+'</div>'}function event(){let e=eventData();return `<div class="event">${e.cancelled?'× ':''}${e.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · ${esc(e.time)}<small>⌖ ${esc(e.place)} ${esc(e.comment)}</small></div>`}function form(){return `<form class="form" id="msg"><input name="name" placeholder="✎"><textarea name="message" required placeholder="✉"></textarea><button>→</button><div id="status"></div></form>`}function showMap(){let e=eventData();setTimeout(()=>{map&&map.remove();map=L.map('map').setView([e.lat,e.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.circleMarker([e.lat,e.lng],{radius:12,color:'#000',fillColor:'#000',fillOpacity:1}).addTo(map)},40)}function open(t){let n={baleti:'BALÈTI',photos:'▧',videos:'▶',map:'⌖',messages:'✉',follow:'◎',links:'↗',papers:'▤',propose:'+'};$('#heading').textContent=n[t]||'';let h=t==='baleti'?event():t==='photos'?photos():t==='videos'?videos():t==='messages'?form():(t==='links'||t==='follow')?links():t==='map'?'<div id="map" class="map"></div>':`<div class="empty">${n[t]||''}</div>`;$('#content').innerHTML=h;$('#modal').classList.add('open');if(t==='map')showMap();if(t==='messages')$('#msg').onsubmit=send}async function send(e){e.preventDefault();let f=new FormData(e.target),s=$('#status');try{let r=await fetch(API+'/api/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.get('name')||'',message:f.get('message')||''})});s.textContent=r.ok?'✓':'×';r.ok&&e.target.reset()}catch(_){s.textContent='×'}}document.querySelectorAll('.sign').forEach(n=>{n.onclick=()=>open(n.dataset.open);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(n.dataset.open)}}});$('#next').onclick=()=>open('baleti');$('#close').onclick=()=>$('#modal').classList.remove('open');document.addEventListener('keydown',e=>e.key==='Escape'&&$('#modal').classList.remove('open'));load();</script></body></html>
