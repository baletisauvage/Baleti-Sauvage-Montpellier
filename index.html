|(s.mode==='sun'?'14:00':'21:30'),place:o.place||s.usualPlace||''}}function draw(){let n=info(),date=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(n.d);$('#next').innerHTML='<br>'+(n.o.cancelled?'ANNULÉ<br>':'')+esc(date.toUpperCase())+' · '+esc(n.time.replace(':','H'))+'<br>'+esc(n.place)+(n.o.comment?'<br>'+esc(n.o.comment):'');if(map){map.setView(n.pos,15);if(marker)marker.remove();marker=L.marker(n.pos).addTo(map).bindPopup(esc(n.place))}}function initMap(){let n=info();if(!map){map=L.map('leaflet').setView(n.pos,15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}draw();setTimeout(()=>map.invalidateSize(),100)}function open(id){document.getElementById(id).classList.add('open');if(id==='map')initMap()}function openBaleti(b){if(baletiAnimating)return;baletiAnimating=true;let r=b.getBoundingClientRect(),c=b.cloneNode(true);c.classList.add('baleti-flight');c.style.left=r.left+'px';c.style.top=r.top+'px';c.style.width=r.width+'px';c.style.height=r.height+'px';document.body.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('go')));setTimeout(()=>{open('baleti');c.remove();baletiAnimating=false},520)}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{document.getElementById('menuScreen')?.classList.remove('open');b.dataset.open==='baleti'?openBaleti(b):open(b.dataset.open)});const menuScreen=document.getElementById('menuScreen'),openMenu=document.getElementById('openMenu'),menuBack=document.getElementById('menuBack');if(openMenu)openMenu.onclick=()=>menuScreen.classList.add('open');if(menuBack)menuBack.onclick=()=>menuScreen.classList.remove('open');const contactModal=document.getElementById('contact'),openContact=document.getElementById('openContact');if(openContact)openContact.onclick=()=>contactModal.classList.add('open');const shareSite=document.getElementById('shareSite'),favoriteSite=document.getElementById('f
