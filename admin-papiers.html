<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papiers — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}h2{font-size:27px}label{display:block;font-size:14px;margin-top:12px}input,button{width:100%;padding:10px 2px;margin:3px 0 10px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 16px}.checks label{display:flex;gap:7px;align-items:center;margin:0}.checks input{width:auto;margin:0}.paper{padding:18px 0;margin:0;background:transparent;border:0;border-top:1px solid #17130d}.paper-name{font-family:Georgia,serif;font-size:18px;word-break:break-word;margin-bottom:10px}.actions{display:flex;gap:8px}.actions a,.actions button{flex:0 0 auto;margin:0;padding:9px 14px;border:1px solid #17130d;border-radius:0;text-align:center;text-decoration:none;font-weight:800;background:transparent;color:#17130d}.delete{border-color:#8b1d14!important;color:#8b1d14!important}.status{padding:12px 0;border-bottom:1px solid #17130d;margin-top:10px;font-size:13px}@media(max-width:650px){.wrap{width:90vw;margin-top:24px}.actions{flex-wrap:wrap}h1{font-size:34px}}</style><script data-baleti-admin-auth="1">(()=>{const K="baleti_admin_token",F=window.fetch.bind(window);window.fetch=async(input,init={})=>{const u=typeof input==="string"?input:(input&&input.url)||"";let opt={...init};if(u.includes("baleti-sauvage.baletisauvage.workers.dev")){const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=localStorage.getItem(K);if(token)h.set("X-Admin-Token",token);opt.headers=h}const r=await F(input,opt);if(u.includes("/api/login")&&r.ok){try{const j=await r.clone().json();if(j.token)localStorage.setItem(K,j.token)}catch{}}if(u.includes("/api/logout")&&r.ok)localStorage.removeItem(K);return r}})();</script></head><body><main class="wrap"><section class="card"><a class="back" href="admin.html">← Retour à l’administration</a><h1>Papiers</h1><p>Ajouter des documents et choisir ceux qui seront visibles dans la rubrique PAPIERS du site public.</p><div id="ajouter"></div><form id="upload"><label>Document<input id="paper" name="paper" type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt" required></label><label>Titre public<input name="titre" maxlength="120" required></label><div class="checks"><label><input name="visible" type="checkbox" checked> Visible sur le site public</label></div><button type="submit">Ajouter le papier</button></form><div id="status" class="status"></div></section><section class="card"><h2 id="archives">Papiers enregistrés</h2><div id="list">Chargement…</div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),list=document.getElementById('list');let papers=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}function render(){if(!papers.length){list.innerHTML='<p>Aucun papier enregistré.</p>';return}list.innerHTML=papers.map((p,i)=>`<article class="paper"><div class="paper-name">${esc(p.titre||p.nomOriginal||p.fichier)}</div><label>Titre<input maxlength="120" data-i="${i}" data-k="titre" value="${esc(p.titre||'')}"></label><div class="checks"><label><input type="checkbox" data-i="${i}" data-k="visible" ${p.visible?'checked':''}> Visible sur le site public</label></div><div class="actions"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Télécharger</a><button data-save="${i}">Enregistrer</button><button class="delete" data-delete="${i}">Supprimer</button></div></article>`).join('');list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(+b.dataset.save));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete))}function val(i,k){const e=list.querySelector(`[data-i="${i}"][data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value}async function load(){try{const s=await req('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await req('/api/admin');papers=d.papers||[];render();status.textContent=papers.length+' papier(s) enregistré(s).'}catch(e){status.textContent='Erreur : '+e.message}}document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),file=document.getElementById('paper').files[0];if(!file)return;if(file.size>8*1024*1024){status.textContent='Le document dépasse 8 Mo.';return}fd.set('visible',f.visible.checked?'1':'0');status.textContent='Téléversement en cours…';try{const d=await req('/api/papers/upload',{method:'POST',body:fd});papers=d.papers||[];f.reset();f.visible.checked=true;render();status.textContent='Papier ajouté.'}catch(e){status.textContent='Erreur : '+e.message}};async function save(i){const p=papers[i];try{const d=await req('/api/papers/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier,titre:val(i,'titre'),visible:val(i,'visible')})});papers=d.papers||[];render();status.textContent='Papier modifié.'}catch(e){status.textContent='Erreur : '+e.message}}async function del(i){const p=papers[i];if(!confirm('Supprimer ce papier ?'))return;try{const d=await req('/api/papers/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier})});papers=d.papers||[];render();status.textContent='Papier supprimé.'}catch(e){status.textContent='Erreur : '+e.message}}load();</script></body></html>
