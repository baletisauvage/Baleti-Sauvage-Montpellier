<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papiers — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#17130d;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(900px,94vw);margin:28px auto}.card{background:#f6e6bd;border:3px solid #000;border-radius:18px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif}input,button{width:100%;padding:11px;margin:5px 0 10px;border:2px solid #222;border-radius:9px;font-size:16px}button{background:#17130d;color:#fff;font-weight:800;cursor:pointer}.back{display:inline-block;color:#17130d;font-weight:bold;margin-bottom:8px}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px}.checks label{display:flex;gap:7px;align-items:center}.checks input{width:auto;margin:0}.paper{padding:14px;margin:12px 0;background:#fff8e8;border:2px solid #17130d;border-radius:13px}.paper-name{font-weight:900;word-break:break-word;margin-bottom:10px}.actions{display:flex;gap:8px}.actions a,.actions button{flex:1;margin:0;padding:11px;border:2px solid #222;border-radius:9px;text-align:center;text-decoration:none;font-weight:800}.actions a{background:#fff;color:#17130d}.delete{background:#7b1d18}.status{padding:11px;background:#fff8e8;border-radius:9px;margin-top:10px}@media(max-width:650px){.actions{display:block}.actions a,.actions button{display:block;width:100%;margin:6px 0}}</style></head><body><main class="wrap"><section class="card"><a class="back" href="admin.html">← Retour à l’administration</a><h1>Papiers</h1><p>Ajouter des documents et choisir ceux qui seront visibles dans la rubrique PAPIERS du site public.</p><form id="upload"><label>Document<input id="paper" name="paper" type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt" required></label><label>Titre public<input name="titre" maxlength="120" required></label><div class="checks"><label><input name="visible" type="checkbox" checked> Visible sur le site public</label></div><button type="submit">Ajouter le papier</button></form><div id="status" class="status"></div></section><section class="card"><h2>Papiers enregistrés</h2><div id="list">Chargement…</div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),list=document.getElementById('list');let papers=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(!r.ok||!j.ok)throw Error(j.error||j.detail||'Erreur');return j}function render(){if(!papers.length){list.innerHTML='<p>Aucun papier enregistré.</p>';return}list.innerHTML=papers.map((p,i)=>`<article class="paper"><div class="paper-name">${esc(p.titre||p.nomOriginal||p.fichier)}</div><label>Titre<input data-i="${i}" data-k="titre" value="${esc(p.titre||'')}"></label><div class="checks"><label><input type="checkbox" data-i="${i}" data-k="visible" ${p.visible?'checked':''}> Visible sur le site public</label></div><div class="actions"><a href="${esc(p.url)}" target="_blank" rel="noopener">Télécharger</a><button data-save="${i}">Enregistrer</button><button class="delete" data-delete="${i}">Supprimer</button></div></article>`).join('');list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(+b.dataset.save));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete))}function val(i,k){const e=list.querySelector(`[data-i="${i}"][data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value}async function load(){try{const s=await req('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await req('/api/admin');papers=d.papers||[];render();status.textContent=papers.length+' papier(s) enregistré(s).'}catch(e){status.textContent='Erreur : '+e.message}}document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),file=document.getElementById('paper').files[0];if(!file)return;if(file.size>8*1024*1024){status.textContent='Le document dépasse 8 Mo.';return}fd.set('visible',f.visible.checked?'1':'0');status.textContent='Téléversement en cours…';try{const d=await req('/api/papers/upload',{method:'POST',body:fd});papers=d.papers||[];f.reset();f.visible.checked=true;render();status.textContent='Papier ajouté.'}catch(e){status.textContent='Erreur : '+e.message}};async function save(i){const p=papers[i];try{const d=await req('/api/papers/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier,titre:val(i,'titre'),visible:val(i,'visible')})});papers=d.papers||[];render();status.textContent='Papier modifié.'}catch(e){status.textContent='Erreur : '+e.message}}async function del(i){const p=papers[i];if(!confirm('Supprimer ce papier ?'))return;try{const d=await req('/api/papers/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier})});papers=d.papers||[];render();status.textContent='Papier supprimé.'}catch(e){status.textContent='Erreur : '+e.message}}load();</script></body></html>
