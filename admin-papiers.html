<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papiers — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}h2{font-size:27px}label{display:block;font-size:14px;margin-top:12px}input,button{width:100%;padding:10px 2px;margin:3px 0 10px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 16px}.checks label{display:flex;gap:7px;align-items:center;margin:0}.checks input{width:auto;margin:0}.paper{padding:18px 0;margin:0;background:transparent;border:0;border-top:1px solid #17130d}.paper-name{font-family:Georgia,serif;font-size:18px;word-break:break-word;margin-bottom:10px}.actions{display:flex;gap:8px}.actions a,.actions button{flex:0 0 auto;margin:0;padding:9px 14px;border:1px solid #17130d;border-radius:0;text-align:center;text-decoration:none;font-weight:800;background:transparent;color:#17130d}.delete{border-color:#8b1d14!important;color:#8b1d14!important}.status{padding:12px 0;border-bottom:1px solid #17130d;margin-top:10px;font-size:13px}@media(max-width:650px){.wrap{width:90vw;margin-top:24px}.actions{flex-wrap:wrap}h1{font-size:34px}}.paper-menu{display:flex;gap:8px;margin:22px 0 0}.paper-menu button{margin:0}.paper-menu button.active{background:#17130d;color:#f4f0e7}.paper-panel{display:none}.paper-panel.active{display:block}.paper-gallery details.paper{padding:0}.paper-gallery details.paper>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 6px;font:500 18px Georgia,serif;overflow-wrap:anywhere}.paper-gallery details.paper>summary::-webkit-details-marker{display:none}.paper-gallery details.paper>summary:after{content:"⌄";font:22px Arial;flex-shrink:0}.paper-gallery details.paper[open]>summary:after{content:"⌃"}.paper-gallery details.paper[open]{background:#eee9df}.paper-gallery .paper-body{padding:0 8px 18px}.paper-gallery .paper-body label{margin-top:6px}.paper-gallery .paper-body input{margin-bottom:5px}.paper-gallery .actions{flex-wrap:wrap;margin-top:12px}.paper-gallery .published-media-card{border-radius:0!important;border:0!important;border-top:1px solid #17130d!important;margin:0!important;padding:0!important}@media(max-width:650px){.paper-menu{display:grid;grid-template-columns:1fr 1fr}.paper-menu button{width:100%}}.paper-preview{margin:12px 0 18px}.paper-preview[hidden]{display:none!important}.paper-preview-toggle{cursor:pointer}.paper-preview canvas{max-width:100%}.paper-preview button{margin:4px 0 16px}.paper-preview-note{font-size:13px;line-height:1.5;opacity:.8}.paper-preview-loading{font-size:13px}</style></head><body><main class="wrap"><section class="card"><a class="back" href="admin.html">← Retour à l’administration</a><h1>Papiers</h1><p>Ajouter des documents et choisir ceux qui seront visibles dans la rubrique PAPIERS du site public.</p><div class="paper-menu"><button type="button" data-view="add">Ajouter un papier</button><button type="button" data-view="gallery">Galerie</button></div></section><section class="card paper-panel" id="panel-add"><h2 id="ajouter">Ajouter un papier</h2><form id="upload"><label>Document<input id="paper" name="paper" type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt" required></label><label>Titre public<input name="titre" maxlength="120" required></label><div class="checks"><label><input name="visible" type="checkbox" checked> Visible sur le site public</label></div><button type="submit">Ajouter le papier</button></form><div id="status" class="status"></div></section><section class="card paper-panel" id="panel-gallery"><h2 id="archives">Galerie</h2><div id="list" class="paper-gallery">Chargement…</div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),list=document.getElementById('list');let papers=[];function view(name){document.querySelectorAll('.paper-panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+name));document.querySelectorAll('.paper-menu button').forEach(x=>x.classList.toggle('active',x.dataset.view===name));history.replaceState(null,'','?view='+name)}document.querySelectorAll('.paper-menu button').forEach(b=>b.onclick=()=>view(b.dataset.view));view(new URLSearchParams(location.search).get('view')==='gallery'?'gallery':'add');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}function chronoAdmin(items,key){return [...items].sort((a,b)=>{const when=o=>String(o[key]||o.date_media||o.ajouteLe||o.published_at||'').trim();const norm=o=>{const raw=when(o).replace(' ','T');return /^\\d{4}-\\d{2}-\\d{2}$/.test(raw)?raw+'T00:00:00':raw};return norm(b).localeCompare(norm(a))})}let pdfJsLoader;function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(!pdfJsLoader)pdfJsLoader=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';script.onload=()=>{if(!window.pdfjsLib)return reject(Error('Lecteur PDF indisponible'));window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(window.pdfjsLib)};script.onerror=()=>reject(Error('Impossible de charger le lecteur PDF'));document.head.append(script)});return pdfJsLoader}
function setupPaperPreview(card,url,filename,mimeType){if(!card||!url)return;const holder=document.createElement('div');holder.className='paper-preview';const body=card.querySelector('.paper-body');if(!body)return;const previewButton=document.createElement('button');previewButton.type='button';previewButton.textContent='APERÇU ▾';previewButton.setAttribute('aria-expanded','false');previewButton.className='paper-preview-toggle';const actions=body.querySelector('.actions');if(actions)actions.prepend(previewButton);else body.prepend(previewButton);holder.hidden=true;body.insertBefore(holder,body.firstChild);const pdf=/\.pdf(?:$|[?#])/i.test(String(filename||url))||mimeType==='application/pdf';let generation=0;previewButton.addEventListener('click',async()=>{const run=++generation;const opening=holder.hidden;holder.hidden=!opening;previewButton.setAttribute('aria-expanded',String(opening));previewButton.textContent=opening?'FERMER L’APERÇU ▴':'APERÇU ▾';holder.replaceChildren();if(!opening)return;if(!pdf){holder.innerHTML='<p class="paper-preview-note">Aperçu intégré disponible pour les PDF. Utilisez « Télécharger » pour consulter ce document.</p>';return}const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/i.test(navigator.userAgent));if(mobile){const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='OUVRIR LE PDF SUR LE TÉLÉPHONE ↗';link.className='secondary';link.style.cssText='display:inline-block;margin:8px 0 12px;padding:10px 12px';holder.append(link);const frame=document.createElement('iframe');frame.src=url;frame.title='Aperçu PDF : '+String(filename||'document');frame.loading='eager';frame.style.cssText='display:block;width:100%;height:70vh;min-height:420px;border:1px solid #17130d;background:white';holder.append(frame);return;} const status=document.createElement('p');status.className='paper-preview-loading';status.textContent='Chargement de l’aperçu PDF…';holder.append(status);try{const lib=await loadPdfJs();if(run!==generation||holder.hidden)return;const resolvedUrl=new URL(url,location.href).href;const doc=await lib.getDocument({url:resolvedUrl,withCredentials:false,disableRange:true,disableStream:true}).promise;if(run!==generation||holder.hidden){doc.destroy();return}status.remove();let next=1;const more=document.createElement('button');more.type='button';more.textContent='Afficher les pages suivantes';more.className='secondary';async function showPages(){more.disabled=true;const last=Math.min(doc.numPages,next+2);for(;next<=last;next++){if(run!==generation||holder.hidden)return;const page=await doc.getPage(next);const base=page.getViewport({scale:1});const width=Math.max(200,Math.min(holder.clientWidth||600,850));const scale=width/base.width;const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.style.cssText='display:block;width:100%;height:auto;margin:0 0 12px;background:#fff;border:1px solid #17130d';canvas.setAttribute('aria-label','Page '+next+' du PDF');holder.insertBefore(canvas,more.isConnected?more:null);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;page.cleanup()}if(next<=doc.numPages){more.disabled=false;more.textContent='Afficher les pages suivantes ('+(doc.numPages-next+1)+' restantes)';if(!more.isConnected)holder.append(more)}else more.remove()}more.onclick=()=>showPages().catch(e=>{status.textContent='Erreur de lecture du PDF : '+e.message;holder.append(status)});await showPages()}catch(e){if(run!==generation||holder.hidden)return;status.textContent='Aperçu impossible : '+(e&&e.message?e.message:'erreur inconnue')+'. Adresse du fichier : '+url+'. Vous pouvez utiliser « Télécharger ».';console.warn('PDF preview:',e)}})};
function render(){queueMicrotask(()=>window.__mergePublishedGallery?.());if(!papers.length){list.innerHTML='<p>Aucun papier enregistré.</p>';return}list.innerHTML=papers.map((p,i)=>`<details class="paper"><summary>${esc(p.titre||p.nomOriginal||p.fichier)}</summary><div class="paper-body"><label>Titre<input maxlength="120" data-i="${i}" data-k="titre" value="${esc(p.titre||'')}"></label><div class="checks"><label><input type="checkbox" data-i="${i}" data-k="visible" ${p.visible?'checked':''}> Visible sur le site public</label></div><div class="actions"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Télécharger</a><button data-save="${i}">Enregistrer</button><button class="delete" data-delete="${i}">Supprimer</button></div></div></details>`).join('');list.querySelectorAll('details.paper').forEach((card,i)=>setupPaperPreview(card,papers[i]?.url,papers[i]?.nomOriginal||papers[i]?.fichier,papers[i]?.mime_type));list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(+b.dataset.save));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete))}function val(i,k){const e=list.querySelector(`[data-i="${i}"][data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value}async function load(){try{const s=await req('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await req('/api/admin');papers=chronoAdmin(d.papers||[],'datePapier');render();status.textContent=papers.length+' papier(s) enregistré(s).'}catch(e){status.textContent='Erreur : '+e.message}}document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),file=document.getElementById('paper').files[0];if(!file)return;if(file.size>8*1024*1024){status.textContent='Le document dépasse 8 Mo.';return}fd.set('visible',f.visible.checked?'1':'0');status.textContent='Téléversement en cours…';try{const d=await req('/api/papers/upload',{method:'POST',body:fd});papers=d.papers||[];f.reset();f.visible.checked=true;render();status.textContent='Papier ajouté.'}catch(e){status.textContent='Erreur : '+e.message}};async function save(i){const p=papers[i];try{const d=await req('/api/papers/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier,titre:val(i,'titre'),visible:val(i,'visible')})});papers=d.papers||[];render();status.textContent='Papier modifié.'}catch(e){status.textContent='Erreur : '+e.message}}async function del(i){const p=papers[i];if(!confirm('Supprimer ce papier ?'))return;try{const d=await req('/api/papers/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier})});papers=d.papers||[];render();status.textContent='Papier supprimé.'}catch(e){status.textContent='Erreur : '+e.message}}load();</script><script>
/* Publications provenant des messages : liste persistante et édition identique. */
(function(){
 const api='https://baleti-sauvage.baletisauvage.workers.dev',kind='document';
 const list=document.getElementById('list');if(!list)return;
 const panel=list.parentElement;
 const container=document.createElement('div');container.className='published-media-list';container.style.cssText='margin-top:16px';
 panel.append(container);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function downloadPublished(item,button){const old=button.textContent;button.disabled=true;button.textContent='Téléchargement…';try{const url=api+'/api/published/file?id='+encodeURIComponent(item.id);const response=await fetch(url,{credentials:'include'});if(!response.ok)throw Error('Fichier indisponible ('+response.status+')');const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=(item.original_name||'piece-jointe').replace(/[\\/]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),60000)}catch(err){alert('Téléchargement impossible : '+err.message)}finally{button.disabled=false;button.textContent=old}}
 async function call(path,options={}){const r=await fetch(api+path,{credentials:'include',...options});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Erreur serveur');return d}
 function field(form,label,value,type='text'){const wrap=document.createElement('label');wrap.textContent=label+' ';const input=document.createElement('input');input.type=type;if(type==='checkbox')input.checked=!!value;else input.value=value||'';wrap.append(input);form.append(wrap);return input}

 let publishedCards=[];
 window.__mergePublishedGallery=()=>{
  const main=document.getElementById('list');if(!main)return;
  main.querySelectorAll('[data-published-media]').forEach(n=>n.remove());
  const originals=Array.from(main.children).filter(n=>n.matches(".paper"));
  originals.forEach((node,i)=>{const item=papers[i];node.dataset.chrono=String(item?.datePapier||item?.ajouteLe||'');});
  if(publishedCards.length&&originals.length===0)main.replaceChildren();
  publishedCards.forEach(({node,item})=>{node.dataset.publishedMedia='1';node.dataset.chrono=String(item.date_media||item.published_at||'');main.append(node)});
  const all=Array.from(main.children).filter(n=>n.dataset.chrono!==undefined);
  all.sort((a,b)=>b.dataset.chrono.localeCompare(a.dataset.chrono));all.forEach(n=>main.append(n));
 };
 async function refresh(){
  try{
   const data=await call('/api/published/admin');container.replaceChildren();publishedCards=[];
   for(const item of chronoAdmin((data.items||[]).filter(x=>x.kind===kind),'date_media')){
    const card=document.createElement('details');card.className='paper published-media-card';const summary=document.createElement('summary');summary.textContent=item.title||item.original_name||'Sans titre';card.append(summary);const body=document.createElement('div');body.className='paper-body';card.append(body);
    const url=api+'/api/published/file?id='+encodeURIComponent(item.id);
    
    
    const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Voir / télécharger';body.append(link);
    const form=document.createElement('form');form.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:12px';
    const titleInput=field(form,'Titre',item.title||item.original_name||'');titleInput.maxLength=120;
    
    const visibleInput=field(form,'Visible',Number(item.visible)!==0,'checkbox');
    
    const actions=document.createElement('div');actions.className='actions';const download=document.createElement('a');download.href='#';download.textContent='Télécharger';download.onclick=e=>{e.preventDefault();downloadPublished(item,download)};actions.append(download);const save=document.createElement('button');save.type='submit';save.textContent='Enregistrer';actions.append(save);
    const remove=document.createElement('button');remove.type='button';remove.textContent='Supprimer';remove.className='delete';actions.append(remove);form.append(actions);body.append(form);container.append(card);setupPaperPreview(card,url,item.original_name||item.title,item.media_type);publishedCards.push({node:card,item});
    form.onsubmit=async e=>{e.preventDefault();if(!titleInput.value.trim()){alert('Titre obligatoire');return}save.disabled=true;try{await call('/api/published/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,title:titleInput.value.trim(),visible:visibleInput.checked,date_media:item.date_media||'',credit:item.credit||'',principale:Number(item.principale)===1})});await refresh()}catch(err){alert(err.message);save.disabled=false}};
    remove.onclick=async()=>{if(!confirm('Supprimer définitivement cette publication ?'))return;remove.disabled=true;try{await call('/api/published/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})});await refresh()}catch(err){alert(err.message);remove.disabled=false}};
   }
   window.__mergePublishedGallery?.();
  }catch(e){container.textContent='Impossible de charger les publications : '+e.message}
 }
 refresh();
})();
</script></body></html>
