<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papiers — Administration Balèti Sauvage</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#17130d;font-family:Arial,sans-serif}.wrap{width:min(920px,92vw);margin:42px auto 80px}.card{background:transparent;border:0;border-top:1px solid #17130d;padding:26px 0;margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;margin-top:0}h1{font-size:42px}h2{font-size:27px}label{display:block;font-size:14px;margin-top:12px}input,button{width:100%;padding:10px 2px;margin:3px 0 10px;border:0;border-bottom:1px solid #17130d;border-radius:0;background:transparent;color:#17130d;font-size:15px}input:focus{outline:0;border-bottom-width:2px}button{width:auto;padding:9px 14px;border:1px solid #17130d;font-weight:800;cursor:pointer}.back{display:block;width:max-content;margin-bottom:28px;padding-bottom:5px;border-bottom:1px solid #17130d;color:#17130d;text-decoration:none;font-size:13px;font-weight:800}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 16px}.checks label{display:flex;gap:7px;align-items:center;margin:0}.checks input{width:auto;margin:0}.paper{padding:18px 0;margin:0;background:transparent;border:0;border-top:1px solid #17130d}.paper-name{font-family:Georgia,serif;font-size:18px;word-break:break-word;margin-bottom:10px}.actions{display:flex;gap:8px}.actions a,.actions button{flex:0 0 auto;margin:0;padding:9px 14px;border:1px solid #17130d;border-radius:0;text-align:center;text-decoration:none;font-weight:800;background:transparent;color:#17130d}.delete{border-color:#8b1d14!important;color:#8b1d14!important}.status{padding:12px 0;border-bottom:1px solid #17130d;margin-top:10px;font-size:13px}@media(max-width:650px){.wrap{width:90vw;margin-top:24px}.actions{flex-wrap:wrap}h1{font-size:34px}}</style></head><body><script data-baleti-mobile-auth="1">(()=>{const K='baleti_admin_session',F=window.fetch.bind(window),HOST='baleti-sauvage.baletisauvage.workers.dev';window.fetch=async(input,init={})=>{const u=typeof input==='string'?input:(input&&input.url)||'';if(!u.startsWith('https://'+HOST+'/'))return F(input,init);const h=new Headers(init.headers||(input instanceof Request?input.headers:undefined));const token=sessionStorage.getItem(K);if(token)h.set('X-Admin-Token',token);const r=await F(input,{...init,headers:h});if(u.includes('/api/login')&&r.ok){try{const j=await r.clone().json();if(j.token)sessionStorage.setItem(K,j.token)}catch(e){}}if(u.includes('/api/logout')&&r.ok)sessionStorage.removeItem(K);return r}})();</script><main class="wrap"><section class="card"><a class="back" href="admin.html">← Retour à l’administration</a><h1>Papiers</h1><p>Ajouter des documents et choisir ceux qui seront visibles dans la rubrique PAPIERS du site public.</p><div id="ajouter"></div><form id="upload"><label>Document<input id="paper" name="paper" type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt" required></label><label>Titre public<input name="titre" maxlength="120" required></label><div class="checks"><label><input name="visible" type="checkbox" checked> Visible sur le site public</label></div><button type="submit">Ajouter le papier</button></form><div id="status" class="status"></div></section><section class="card"><h2 id="archives">Papiers enregistrés</h2><div id="list">Chargement…</div></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),list=document.getElementById('list');let papers=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Réponse Worker invalide')}if(r.status===401){location.href='admin.html';throw Error('Connexion administrateur nécessaire.')}if(!r.ok||j.ok===false)throw Error(j.error||j.detail||('HTTP '+r.status));return j}function render(){if(!papers.length){list.innerHTML='<p>Aucun papier enregistré.</p>';return}list.innerHTML=papers.map((p,i)=>`<article class="paper"><div class="paper-name">${esc(p.titre||p.nomOriginal||p.fichier)}</div><label>Titre<input maxlength="120" data-i="${i}" data-k="titre" value="${esc(p.titre||'')}"></label><div class="checks"><label><input type="checkbox" data-i="${i}" data-k="visible" ${p.visible?'checked':''}> Visible sur le site public</label></div><div class="actions"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Télécharger</a><button data-save="${i}">Enregistrer</button><button class="delete" data-delete="${i}">Supprimer</button></div></article>`).join('');list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(+b.dataset.save));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete))}function val(i,k){const e=list.querySelector(`[data-i="${i}"][data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value}async function load(){try{const s=await req('/api/session');if(!s.authenticated){location.href='admin.html';return}const d=await req('/api/admin');papers=d.papers||[];render();status.textContent=papers.length+' papier(s) enregistré(s).'}catch(e){status.textContent='Erreur : '+e.message}}document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),file=document.getElementById('paper').files[0];if(!file)return;if(file.size>8*1024*1024){status.textContent='Le document dépasse 8 Mo.';return}fd.set('visible',f.visible.checked?'1':'0');status.textContent='Téléversement en cours…';try{const d=await req('/api/papers/upload',{method:'POST',body:fd});papers=d.papers||[];f.reset();f.visible.checked=true;render();status.textContent='Papier ajouté.'}catch(e){status.textContent='Erreur : '+e.message}};async function save(i){const p=papers[i];try{const d=await req('/api/papers/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier,titre:val(i,'titre'),visible:val(i,'visible')})});papers=d.papers||[];render();status.textContent='Papier modifié.'}catch(e){status.textContent='Erreur : '+e.message}}async function del(i){const p=papers[i];if(!confirm('Supprimer ce papier ?'))return;try{const d=await req('/api/papers/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fichier:p.fichier})});papers=d.papers||[];render();status.textContent='Papier supprimé.'}catch(e){status.textContent='Erreur : '+e.message}}load();</script><script>
/* Publications provenant des messages : liste persistante et édition identique. */
(function(){
 const api='https://baleti-sauvage.baletisauvage.workers.dev',kind='document';
 const list=document.getElementById('list');if(!list)return;
 const panel=list.parentElement;
 const container=document.createElement('div');container.className='published-media-list';container.style.cssText='margin-top:16px';
 panel.append(container);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function downloadPublished(item,button){const old=button.textContent;button.disabled=true;button.textContent='Téléchargement…';try{const url=api+'/api/published/file?id='+encodeURIComponent(item.id);const response=await fetch(url,{credentials:'include'});if(!response.ok)throw Error('Fichier indisponible ('+response.status+')');const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=(item.original_name||'piece-jointe').replace(/[\\/]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),60000)}catch(err){alert('Téléchargement impossible : '+err.message)}finally{button.disabled=false;button.textContent=old}}
 async function call(path,options={}){const r=await fetch(api+path,{credentials:'include',...options});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Erreur serveur');return d}
 function field(form,label,value,type='text'){const wrap=document.createElement('label');wrap.textContent=label+' ';const input=document.createElement('input');input.type=type;if(type==='checkbox')input.checked=!!value;else input.value=value||'';wrap.append(input);form.append(wrap);return input}
 async function refresh(){
  try{
   const data=await call('/api/published/admin');container.replaceChildren();
   for(const item of (data.items||[]).filter(x=>x.kind===kind)){
    const card=document.createElement('article');card.className='paper published-media-card';card.style.cssText='margin:12px 0;padding:16px;border:1px solid #aaa5;border-radius:8px';
    const url=api+'/api/published/file?id='+encodeURIComponent(item.id);
    const title=document.createElement('strong');title.textContent=item.title||item.original_name||'Sans titre';card.append(title);
    
    const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Voir / télécharger';card.append(link);
    const form=document.createElement('form');form.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:12px';
    const titleInput=field(form,'Titre',item.title||item.original_name||'');titleInput.maxLength=120;
    
    const visibleInput=field(form,'Visible',Number(item.visible)!==0,'checkbox');
    
    const actions=document.createElement('div');actions.className='actions';const download=document.createElement('a');download.href='#';download.textContent='Télécharger';download.onclick=e=>{e.preventDefault();downloadPublished(item,download)};actions.append(download);const save=document.createElement('button');save.type='submit';save.textContent='Enregistrer';actions.append(save);
    const remove=document.createElement('button');remove.type='button';remove.textContent='Supprimer';remove.className='delete';actions.append(remove);form.append(actions);card.append(form);container.append(card);
    form.onsubmit=async e=>{e.preventDefault();if(!titleInput.value.trim()){alert('Titre obligatoire');return}save.disabled=true;try{await call('/api/published/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,title:titleInput.value.trim(),visible:visibleInput.checked,date_media:item.date_media||'',credit:item.credit||'',principale:Number(item.principale)===1})});await refresh()}catch(err){alert(err.message);save.disabled=false}};
    remove.onclick=async()=>{if(!confirm('Supprimer définitivement cette publication ?'))return;remove.disabled=true;try{await call('/api/published/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})});await refresh()}catch(err){alert(err.message);remove.disabled=false}};
   }
  }catch(e){container.textContent='Impossible de charger les publications : '+e.message}
 }
 refresh();
})();
</script></body></html>
