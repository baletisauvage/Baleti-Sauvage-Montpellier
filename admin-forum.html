<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modération — Forum</title><style>body{font:16px Arial,sans-serif;background:#f4f0e7;color:#17130d;margin:0}.wrap{max-width:850px;margin:30px auto;padding:0 20px}h1{font:normal 34px Georgia,serif}article{padding:18px 0;border-top:1px solid #999}p{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:10px 16px;background:#17130d;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}small{color:#555}a{color:inherit}.toolbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:18px 0}.reply{margin-left:24px;padding-left:16px;border-left:3px solid #999}.hidden{opacity:.55}.expired{opacity:.7}.bulkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 20px}.bulkbar label{display:flex;align-items:center;gap:6px}.bulkbar input,.pick input{width:18px;height:18px;accent-color:#17130d}.pick{display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;cursor:pointer}.bulkbar button{background:#8c1c1c}.bulkbar button:disabled{background:#777}</style></head><body><main class="wrap"><a href="admin.html">← Administration</a><h1>Modération du Forum</h1><p>Les discussions sont publiques pendant 72 heures. Masquer une discussion masque également ses réponses.</p><div class="toolbar"><button id="reload" type="button">Actualiser les messages</button><div id="status" role="status" aria-live="polite">Chargement…</div></div><div class="bulkbar"><label><input id="selectAll" type="checkbox"> Tout sélectionner</label><button id="hideSelected" type="button" disabled>Masquer la sélection</button><span id="selectedCount" aria-live="polite">0 sélectionné</span></div><section id="posts"></section></main><script>const API='https://baleti-sauvage.baletisauvage.workers.dev',status=document.getElementById('status'),posts=document.getElementById('posts'),selectAll=document.getElementById('selectAll'),hideSelected=document.getElementById('hideSelected'),selectedCount=document.getElementById('selectedCount');let busy=false;function selected(){return [...posts.querySelectorAll('input[data-post-id]:checked')].map(x=>x.dataset.postId)}function updateSelection(){const boxes=[...posts.querySelectorAll('input[data-post-id]')],n=selected().length;selectedCount.textContent=n+' sélectionné'+(n>1?'s':'');hideSelected.disabled=busy||n===0;selectAll.disabled=busy||boxes.length===0;selectAll.checked=boxes.length>0&&n===boxes.length;selectAll.indeterminate=n>0&&n<boxes.length}selectAll.onchange=()=>{posts.querySelectorAll('input[data-post-id]').forEach(x=>x.checked=selectAll.checked);updateSelection()};hideSelected.onclick=async()=>{const ids=selected();if(!ids.length||busy)return;if(!confirm('Masquer '+ids.length+' message(s) sélectionné(s) ? Les réponses aux discussions masquées seront également masquées.'))return;busy=true;updateSelection();let done=0;try{for(const id of ids){await api('/api/forum/moderate',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id})});done++}await load()}catch(e){status.textContent=done+' message(s) masqué(s) sur '+ids.length+' : '+e.message;await load()}finally{busy=false;updateSelection()}};async function api(path,options={}){const r=await fetch(API+path,{credentials:'include',...options,headers:{...(options.headers||{})}});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Erreur serveur');return j}function element(tag,value){const e=document.createElement(tag);e.textContent=value;return e}async function load(){try{const session=await api('/api/session');if(!session.authenticated){location.href='admin.html';return}const j=await api('/api/forum/admin');try{localStorage.setItem('baleti_forum_last_seen_v1',String(Date.now()))}catch(e){}posts.replaceChildren();selectAll.checked=false;const active=j.posts.filter(p=>!p.hidden&&p.expires_at>Date.now()).length;status.textContent=active+' messages actifs · '+j.posts.length+' messages au total (expirés ou masqués inclus)';if(!j.posts.length)posts.append(element('p','Aucun message à modérer.'));for(const p of j.posts){const article=document.createElement('article');if(p.parent_id)article.classList.add('reply');if(p.hidden)article.classList.add('hidden');if(p.expires_at<Date.now())article.classList.add('expired');article.append(element('strong',p.nickname),element('small',' · '+new Date(p.created_at).toLocaleString('fr-FR')+(p.parent_id?' · réponse':'')+(p.hidden?' · masqué':'')+(p.expires_at<Date.now()?' · expiré':'')),element('p',p.body));if(!p.hidden&&p.expires_at>Date.now()){const pick=document.createElement('label');pick.className='pick';const check=document.createElement('input');check.type='checkbox';check.dataset.postId=p.id;check.setAttribute('aria-label','Sélectionner le message de '+p.nickname);check.onchange=updateSelection;pick.append(check,element('span','Sélectionner'));article.prepend(pick,document.createElement('br'));const btn=element('button','Masquer');btn.onclick=async()=>{if(!confirm('Masquer ce message'+(p.parent_id?'':' et ses réponses')+' ? Cette action est irréversible depuis cette interface.'))return;btn.disabled=true;try{await api('/api/forum/moderate',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:p.id})});await load()}catch(e){status.textContent=e.message;btn.disabled=false}};article.append(btn)}posts.append(article)}updateSelection()}catch(e){status.textContent='Modération indisponible : '+e.message}}document.getElementById('reload').onclick=load;load();</script></body></html>
